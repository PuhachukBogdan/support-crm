// Chats core contract (roadmap 4.1–4.3, feature 012).
//
// The Chats service's own domain surface: conversations, messages, and the player feed.
// Cross-service data (operator/player/brand identity) is NOT modelled here — those cross via
// the users/brands contracts (Principle VIII), never a DB join. This file owns only chats_db shapes.
//
// Caller context rides in gRPC METADATA, not message fields (research R1) — keys
// `x-actor-user-id`, `x-actor-account-id`, `x-actor-role`, `x-actor-permissions` (comma-joined),
// `x-actor-brands` (comma-joined permitted brand ids, R3), `x-is-preview`. The service-tier guard
// re-checks the permission context independently so a call skipping the gateway is refused (SC-004).
//
// Pagination is keyset only (Principle VII / R7): opaque page_token (empty = first page) + page_size
// (server-capped at 100, default 50); responses return next_page_token (empty = no more). No offset,
// no totals. Additive-only: never renumber or reuse field numbers.
//
// Generated TS message types (git-ignored): libs/proto/gen/crm/chats/v1/chats.ts

syntax = "proto3";

package crm.chats.v1;

import "crm/audit/v1/audit.proto";

// Package-scoped enums → PREFIXED values; *_UNSPECIFIED = 0; wire value = NAME (enums:String).

enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  CONVERSATION_STATUS_OPEN = 1;
  CONVERSATION_STATUS_PENDING = 2;
  CONVERSATION_STATUS_RESOLVED = 3;
  CONVERSATION_STATUS_SNOOZED = 4;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_PUBLIC_REPLY = 1;      // operator, not private
  MESSAGE_KIND_PRIVATE_NOTE = 2;      // operator, private — never in CUSTOMER projection (SEC-13)
  MESSAGE_KIND_INCOMING_CUSTOMER = 3; // player (normally channel-ingested, Phase 6)
  MESSAGE_KIND_SYSTEM = 4;            // system
}

enum ThreadProjection {
  THREAD_PROJECTION_UNSPECIFIED = 0;
  THREAD_PROJECTION_STAFF = 1;        // all kinds
  THREAD_PROJECTION_CUSTOMER = 2;     // public + incoming only; private notes excluded at query (R4)
}

// Lean list item (no thread) — ListConversations / player feed.
message ConversationSummary {
  string id = 1;
  string brand_id = 2;
  string player_id = 3;               // "" when unlinked
  ConversationStatus status = 4;
  string priority = 5;                // "" when unset
  string assignee_operator_id = 6;    // "" when unassigned
  string channel = 7;
  string last_activity_at = 8;        // ISO-8601 (updated_at)
  string created_at = 9;
}

// Full conversation detail (metadata; thread via GetThread).
message Conversation {
  string id = 1;
  string brand_id = 2;
  string player_id = 3;
  ConversationStatus status = 4;
  string priority = 5;
  string assignee_operator_id = 6;
  string channel = 7;
  string reference = 8;
  // Reserved classification (ADR 0027) — surfaced read-only, populated by later features:
  string category = 9;
  string sub_category = 10;
  string classified_by = 11;
  string created_at = 12;
  string updated_at = 13;
  // Feature 014 (roadmap 4.7) — additive. The first-reply measurement rides on the detail so the UI
  // needs no second call. Absent when no clock ever started (no SLA policy applied).
  FirstReplySlaState first_reply_sla = 14;
}

// Feature 016 (roadmap 4.9) — rendering metadata for a file attached to a message. The bytes are
// served by the uploads path (users), never inlined here. `upload_id` is a soft ref across a
// database boundary; the values beside it are fetched from users per thread page, deliberately NOT
// denormalized into chats_db — that keeps the PII-capable display_name in exactly one database.
message Attachment {
  string upload_id = 1;
  string content_type = 2;            // the VERIFIED type
  int64 byte_size = 3;
  string display_name = 4;            // sanitized; may be "" when the client sent nothing usable
  bool has_derivative = 5;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  MessageKind kind = 3;               // derived (R5)
  string author_id = 4;               // "" for system
  string body = 5;
  repeated string mentions = 6;       // operator-id soft refs; only on PRIVATE_NOTE; resolution deferred (R6)
  string created_at = 7;
  // Feature 016 — additive. ABSENT from the CUSTOMER projection for a private note, because the
  // note itself is excluded at query level (SEC-13) and attachments load THROUGH the message.
  // Nothing fetches attachments by a separate query; SC-008 asserts the ids are absent too, not
  // merely the bytes — the 012 lesson was that the id and the mentions leaked alongside the body.
  repeated Attachment attachments = 8;
}

service ChatsReadService {
  rpc ListConversations(ListConversationsRequest) returns (ConversationPage);
  rpc GetConversation(GetConversationRequest) returns (Conversation);
  rpc GetThread(GetThreadRequest) returns (MessagePage);
  rpc GetPlayerFeed(GetPlayerFeedRequest) returns (ConversationPage); // brand-union within account (US3)
  // ── Feature 013 (workflow, roadmap 4.4–4.5) — additive ──
  rpc ListConversationLabels(ConversationIdRequest) returns (LabelList);
  rpc ListLabels(Empty) returns (LabelList);
  rpc ListMacros(Empty) returns (MacroList);
  rpc ListCannedResponses(Empty) returns (CannedResponseList);
  // ── Feature 014 (automations + first-reply SLA, roadmap 4.6–4.7) — additive ──
  rpc ListAutomations(ListAutomationsRequest) returns (AutomationList);
  rpc ListAutomationRuns(ListAutomationRunsRequest) returns (AutomationRunList);
  rpc GetFirstReplySlaPolicies(Empty) returns (FirstReplySlaPolicyList);

  // ── Feature 015 (audit trail, roadmap 4.8) — additive. One RPC per source; the gateway fans out
  // and merges. Gated by `platform.audit.view` at BOTH tiers. No write/update/delete counterpart
  // exists anywhere — append-only means there is no mutation path to expose.
  rpc ListAuditEntries(crm.audit.v1.ListAuditEntriesRequest) returns (crm.audit.v1.AuditEntryPage);
}

message ListConversationsRequest {
  // All filters optional; any combination (FR-002). *_UNSPECIFIED / "" = no filter on that dimension.
  ConversationStatus status = 1;
  string priority = 2;
  string assignee_operator_id = 3;
  string player_id = 4;
  string brand_id = 5;                // optional narrowing; result is always intersected with permitted brands (R3)
  string page_token = 6;
  int32 page_size = 7;                // server-capped (100 max, 50 default)
  // Feature 014 (R10): the breached list is a FILTER on the inbox, not a parallel endpoint — it
  // inherits keyset paging, the page cap, brand intersection and crm.inbox.view. Unknown value ⇒
  // 400 at the REST edge (never a widened query).
  SlaOutcome sla_outcome = 8;
}

message ConversationPage {
  repeated ConversationSummary conversations = 1;
  string next_page_token = 2;
}

message GetConversationRequest {
  string id = 1;
}

message GetThreadRequest {
  string conversation_id = 1;
  ThreadProjection projection = 2;    // STAFF | CUSTOMER (R4)
  string page_token = 3;
  int32 page_size = 4;
}

message MessagePage {
  repeated Message messages = 1;
  string next_page_token = 2;
}

message GetPlayerFeedRequest {
  string player_id = 1;
  ThreadProjection projection = 2;
  string page_token = 3;
  int32 page_size = 4;
}

service ChatsWriteService {
  rpc PostMessage(PostMessageRequest) returns (Message);
  rpc SetConversationStatus(SetConversationStatusRequest) returns (Conversation);
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);
  // Internal/seed + future channel ingress (Phase 6) path for inbound customer messages:
  rpc RecordIncomingMessage(RecordIncomingMessageRequest) returns (Message);
  // ── Feature 013 (workflow, roadmap 4.4–4.5) — additive ──
  rpc AssignConversation(AssignConversationRequest) returns (Conversation);
  rpc AutoAssignConversation(AutoAssignRequest) returns (AutoAssignResult);
  rpc AttachLabel(LabelLinkRequest) returns (Ack);
  rpc DetachLabel(LabelLinkRequest) returns (Ack);
  rpc CreateLabel(CreateLabelRequest) returns (Label);
  rpc DefineMacro(DefineMacroRequest) returns (Macro);
  rpc ApplyMacro(ApplyMacroRequest) returns (Conversation);
  rpc CreateCannedResponse(CreateCannedResponseRequest) returns (CannedResponse);
  // ── Feature 014 (automations + first-reply SLA, roadmap 4.6–4.7) — additive ──
  rpc CreateAutomation(CreateAutomationRequest) returns (Automation);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (Automation);
  rpc DeleteAutomation(AutomationIdRequest) returns (Ack);
  rpc SetFirstReplySlaPolicy(SetFirstReplySlaPolicyRequest) returns (FirstReplySlaPolicy);
}

message PostMessageRequest {
  string conversation_id = 1;
  MessageKind kind = 2;               // PUBLIC_REPLY | PRIVATE_NOTE only (validated)
  string body = 3;
  repeated string mentions = 4;       // honored only for PRIVATE_NOTE (R6)
  // Feature 016 — additive. Validated and CLAIMED via users.ClaimUploads BEFORE the message row is
  // written (feature 013's ordering discipline: a refused attachment leaves no partial message).
  // Capped at 50 like every other id list on this contract — an unbounded `repeated string` on an
  // authenticated path is an unbounded request (Principle VII).
  repeated string upload_ids = 5;     // max 50
}

message SetConversationStatusRequest {
  string conversation_id = 1;
  ConversationStatus status = 2;      // must be a valid non-UNSPECIFIED value
}

message CreateConversationRequest {
  string brand_id = 1;
  string player_id = 2;               // optional
  string priority = 3;
  string channel = 4;
  string assignee_operator_id = 5;
}

message RecordIncomingMessageRequest {
  string conversation_id = 1;
  string body = 2;
  string author_id = 3;               // player id
}

// ═══════════════════════════════════════════════════════════════════════════════
// Feature 013 — Conversation workflow (roadmap 4.4 assignment + 4.5 labels/macros/
// canned). ADDITIVE ONLY: nothing above is renumbered (Principle VIII, buf
// breaking=FILE). Caller context still rides in metadata (x-actor-*), never in a body.
// ═══════════════════════════════════════════════════════════════════════════════

// A macro's action set (v1, research R4). Richer actions (send message, SLA, automation)
// belong to roadmap 4.6/4.7 — an unknown type is rejected at define AND at apply.
enum MacroActionType {
  MACRO_ACTION_TYPE_UNSPECIFIED = 0;
  MACRO_ACTION_TYPE_SET_STATUS = 1;   // value = ConversationStatus name
  MACRO_ACTION_TYPE_ADD_LABEL = 2;    // value = label_id
  MACRO_ACTION_TYPE_ASSIGN = 3;       // value = operator_id
  // Feature 014: the shared action vocabulary is used by macros AND automation rules.
  MACRO_ACTION_TYPE_SET_PRIORITY = 4; // value = priority name (research R9)
}

message MacroAction {
  MacroActionType type = 1;
  string value = 2;
}

message Label {
  string id = 1;
  string name = 2;
  string color = 3;                   // "" when unset
}
message LabelList { repeated Label labels = 1; }

message Macro {
  string id = 1;
  string name = 2;
  repeated MacroAction actions = 3;
}
message MacroList { repeated Macro macros = 1; }

// Reusable reply text. Text ONLY — never sends a message by itself (FR-009).
message CannedResponse {
  string id = 1;
  string name = 2;
  string body = 3;
}
message CannedResponseList { repeated CannedResponse canned = 1; }

message Ack { bool ok = 1; }

// Round-robin candidate. Supplied BY THE CALLER until the Users service resolves teams +
// capacity (roadmap 5.3 / research R3) — the chats service makes no Users call here.
message RoundRobinCandidate {
  string operator_id = 1;
  int32 capacity = 2;
  int32 current_load = 3;
}

message ConversationIdRequest { string conversation_id = 1; }
message Empty {}

message AssignConversationRequest {
  string conversation_id = 1;
  string operator_id = 2;             // "" = unassign
}

message AutoAssignRequest {
  string conversation_id = 1;
  string group_key = 2;                        // opaque; rotation state keyed by (account, group_key)
  repeated RoundRobinCandidate candidates = 3; // caller-supplied until Phase 5
}
message AutoAssignResult {
  bool assigned = 1;
  string operator_id = 2;                      // "" when none available
  Conversation conversation = 3;               // populated when assigned
  // "" on success; a machine-readable reason when assigned=false, e.g.
  // NO_OPERATOR_AVAILABLE | GROUP_ROUTING_NOT_AVAILABLE (spec US3 #3/#4).
  string reason = 4;
}

message LabelLinkRequest {
  string conversation_id = 1;
  string label_id = 2;
}
message CreateLabelRequest {
  string name = 1;
  string color = 2;
}
message DefineMacroRequest {
  string name = 1;
  repeated MacroAction actions = 2;
}
message ApplyMacroRequest {
  string conversation_id = 1;
  string macro_id = 2;
}
message CreateCannedResponseRequest {
  string name = 1;
  string body = 2;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Feature 014 — Automations engine (roadmap 4.6) + first-reply SLA (roadmap 4.7).
// ADDITIVE ONLY: nothing above is renumbered; MacroActionType gained a value at the
// end (SET_PRIORITY = 4) and ListConversationsRequest a field (sla_outcome = 8).
// Caller context still rides in metadata (x-actor-*), never in a body.
// ═══════════════════════════════════════════════════════════════════════════════

// A rule's trigger. Closed, additive catalogue — an UNSPECIFIED/unknown trigger is refused at
// authoring AND at run time (a definition stored before a catalogue change must never resolve to a
// different meaning than its author intended).
enum AutomationTrigger {
  AUTOMATION_TRIGGER_UNSPECIFIED = 0;          // refused — a rule must name its trigger
  AUTOMATION_TRIGGER_CONVERSATION_CREATED = 1;
  AUTOMATION_TRIGGER_MESSAGE_RECEIVED = 2;     // inbound PLAYER message only (never staff replies)
  AUTOMATION_TRIGGER_STATUS_CHANGED = 3;
  AUTOMATION_TRIGGER_FIRST_REPLY_BREACHED = 4; // emitted by the 4.7 half (US3 join)
}

enum ConditionField {
  CONDITION_FIELD_UNSPECIFIED = 0;  // refused
  CONDITION_FIELD_STATUS = 1;
  CONDITION_FIELD_PRIORITY = 2;
  CONDITION_FIELD_BRAND = 3;
  CONDITION_FIELD_CHANNEL = 4;
  CONDITION_FIELD_ASSIGNEE = 5;     // PRESENT / ABSENT
  CONDITION_FIELD_LABEL = 6;        // PRESENT / ABSENT, value = label_id
  CONDITION_FIELD_MESSAGE_TEXT = 7; // CONTAINS, only under MESSAGE_RECEIVED
}

enum ConditionOp {
  CONDITION_OP_UNSPECIFIED = 0;     // refused
  CONDITION_OP_EQ = 1;
  CONDITION_OP_NE = 2;
  CONDITION_OP_PRESENT = 3;
  CONDITION_OP_ABSENT = 4;
  CONDITION_OP_CONTAINS = 5;        // message text only
}

// First-reply measurement outcome. Also the ListConversations filter (R10).
enum SlaOutcome {
  SLA_OUTCOME_UNSPECIFIED = 0;      // no filter
  SLA_OUTCOME_RUNNING = 1;
  SLA_OUTCOME_MET = 2;
  SLA_OUTCOME_BREACHED = 3;
}

message AutomationCondition {
  ConditionField field = 1;
  ConditionOp op = 2;
  string value = 3;
}

message AutomationDefinition {
  AutomationTrigger trigger = 1;
  repeated AutomationCondition conditions = 2; // may be empty (= every occurrence of the trigger)
  repeated MacroAction actions = 3;            // MUST be non-empty; shares the macro vocabulary
}

message Automation {
  string id = 1;
  string name = 2;
  bool active = 3;
  int32 position = 4;
  int32 revision = 5;
  // The authority the rule acts with: its author's CURRENT permissions, re-resolved on every
  // evaluation (FR-023 / research R5). A rule is never more powerful than its author.
  string author_user_id = 6;
  AutomationDefinition definition = 7;
  string created_at = 8;
  string updated_at = 9;
}
message AutomationList {
  repeated Automation automations = 1;
  string next_page_token = 2;
}

message ListAutomationsRequest {
  string page_token = 1;
  int32 page_size = 2;                         // server-capped
}

message CreateAutomationRequest {
  string name = 1;
  AutomationDefinition definition = 2;
  int32 position = 3;
  bool active = 4;
}

// Partial update. Explicit has_* presence flags: proto3 scalar presence is ambiguous through
// proto-loader, so "" / 0 / false must not silently mean "clear this field".
message UpdateAutomationRequest {
  string id = 1;
  string name = 2;
  bool has_name = 3;
  AutomationDefinition definition = 4;
  bool has_definition = 5;                     // when true the definition is revalidated + revision bumped
  int32 position = 6;
  bool has_position = 7;
  bool active = 8;
  bool has_active = 9;
}

message AutomationIdRequest { string id = 1; }

// One diagnostic entry per evaluation (FR-007). PII-FREE by construction: ids, an outcome and a
// short reason — never message text, never a player id. NOT the 0019 audit store (that is 4.8).
message AutomationRun {
  string id = 1;
  string automation_id = 2;
  int32 automation_revision = 3;
  string conversation_id = 4;
  AutomationTrigger trigger = 5;
  string outcome = 6;                          // applied | not_matched | refused
  string reason = 7;                           // e.g. "author lacks crm.conversation.assign"
  string created_at = 8;
}
message AutomationRunList {
  repeated AutomationRun runs = 1;
  string next_page_token = 2;
}

message ListAutomationRunsRequest {
  string automation_id = 1;                    // "" = every rule in the account
  string conversation_id = 2;                  // "" = every conversation
  string page_token = 3;
  int32 page_size = 4;
}

// The first-reply target. scope_* use the "*" sentinel rather than absence: Postgres unique
// indexes treat NULLs as DISTINCT, so NULL scoping would allow two account-level defaults and make
// "the target" ambiguous (research R7).
message FirstReplySlaPolicy {
  string id = 1;
  int32 target_minutes = 2;
  string scope_priority = 3;                   // "*" = any priority
  string scope_brand_id = 4;                   // "*" = any brand
}
message FirstReplySlaPolicyList { repeated FirstReplySlaPolicy policies = 1; }

message SetFirstReplySlaPolicyRequest {
  int32 target_minutes = 1;                    // > 0
  string scope_priority = 2;                   // "" or "*" = any
  string scope_brand_id = 3;
}

// Per-conversation measurement, surfaced on the conversation detail.
message FirstReplySlaState {
  SlaOutcome outcome = 1;
  string started_at = 2;
  string deadline_at = 3;
  int32 target_minutes = 4;                    // FROZEN at clock start (FR-016)
  string first_reply_at = 5;                   // "" while running
  int32 first_reply_seconds = 6;               // 0 while running
}

// ─────────────────────────────────────────────────────────────────────────────────
// Maintenance surface — deliberately a SEPARATE service (research R3).
//
// Not a user-facing surface: the gateway exposes NO route to it, and the handler requires actor
// metadata `x-actor-kind: system`. It is the entry point for the worker's repeatable tick and the
// only caller of the single unscoped id-only read. It answers with COUNTS — never rows — so no
// tenant data crosses the boundary even to a system caller.
// ─────────────────────────────────────────────────────────────────────────────────
service ChatsMaintenanceService {
  rpc SweepFirstReplySla(SweepRequest) returns (SweepResult);

  // Feature 017 (roadmap 4.10). Both inherit every property of the sweep above: system actor only, no
  // gateway route, batch-capped, COUNTS in the response.
  //
  // Claim and run due exports. `queued → running` is a CONDITIONAL update, so two overlapping ticks
  // cannot claim one row — idempotency comes from the predicate, not from bookkeeping. Also recovers a
  // STALE `running` row (claimed too long ago, i.e. the producer died) to failed/interrupted, which is
  // what stops a row from being `running` forever.
  rpc RunDueExports(MaintenanceBatchRequest) returns (RunDueExportsResult);

  // Flip `ready` rows past their expiry to `expired`. The BYTES are removed independently by
  // users.UsersMaintenanceService.PurgeExpiredArtefacts on its own predicate (research R7), so neither
  // service waits on the other: a downed peer delays nothing and loses nothing.
  rpc ExpireDueExports(MaintenanceBatchRequest) returns (ExpireDueExportsResult);
}

message SweepRequest {
  int32 limit = 1;                             // server-capped (SLA_SWEEP_BATCH)
}
message SweepResult {
  int32 checked = 1;
  int32 breached = 2;
  int32 rules_applied = 3;
  // No ids of any kind. Counts only.
}

message MaintenanceBatchRequest {
  int32 limit = 1;                             // server-capped
}
message RunDueExportsResult {
  int32 claimed = 1;
  int32 completed = 2;
  int32 failed = 3;
  int32 recovered_stale = 4;
  // Counts only. No export ids, no scopes, no filters.
}
message ExpireDueExportsResult {
  int32 expired = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Exports (feature 017, roadmap 4.10 — SEC-21/SEC-22/SEC-27)
//
// An export is a FILE of data the requester may already read. Three properties make it defensible,
// and all three are visible in this contract:
//   • it is produced OUT of the request (FR-001) — CreateExport returns a record, never bytes;
//   • the bytes never appear here (research R4) — the artefact reaches storage through the EXISTING
//     users.UploadsService.CreateUpload, so feature 016's `bytes`-message set is unchanged and
//     `users` remains the only holder of storage credentials;
//   • nothing is a URL. ResolveExportArtefact hands back an ID, and the bytes are then fetched
//     through the brokered ReadUpload, which re-authorizes AT FETCH TIME (FR-010). A signed link
//     would move the decision to link-creation time, which IS the SEC-10/SEC-27 defect.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service ChatsExportService {
  // Create a request. Refuses BEFORE writing a row when the scope is unknown, the caller lacks its
  // permission, a filter is unrecognised, or the quota is exhausted (FR-005/FR-009/FR-017).
  rpc CreateExport(CreateExportRequest) returns (ExportJob);

  // The caller's OWN exports, keyset-paged, newest first. Never anyone else's.
  rpc ListExports(ListExportsRequest) returns (ListExportsResponse);

  // One export. Account-scoped AND owner-checked: a same-account non-owner, another account's id, an
  // unknown id and an EXPIRED export all return the identical NOT_FOUND (FR-011) — no existence oracle.
  rpc GetExport(GetExportRequest) returns (ExportJob);

  // Resolve to the artefact reference the gateway may then read through UploadsService. Refuses unless
  // the caller is the OWNER, the status is `ready` and the expiry is in the future.
  rpc ResolveExportArtefact(GetExportRequest) returns (ExportArtefactRef);

  // ── Deliberately ABSENT ────────────────────────────────────────────────────────────────────────
  // • No UpdateExport / DeleteExport / CancelExport — an export is not editable in v1, and a
  //   requester-driven delete would be a SECOND way to remove bytes; research R8 keeps exactly one,
  //   and it is a system sweep.
  // • No RetryExport — a failed export is re-requested, so every attempt is one audited act rather
  //   than an unaudited second run against the same record.
  // • No DownloadExport carrying bytes — that would add a `bytes` message and break the single-path
  //   guarantee this whole design is built to preserve.
}

// The SAME filter vocabulary as ListConversationsRequest (FR-027).
//
// ⚠️ Mirrored, not extracted, and the field numbers MATCH so the parity test reads as an equality.
// Extracting a shared nested message would renumber a SHIPPED message and touch feature 012's wire
// tests to gain tidiness on an internal contract. What keeps two declarations ONE vocabulary is the
// test (`tests/exports/filter-parity.spec.ts`), not the intent — intent does not survive a future
// field added to one side only.
message ExportFilters {
  ConversationStatus status = 1;
  string priority = 2;
  string assignee_operator_id = 3;
  string player_id = 4;
  string brand_id = 5;
  // 6 and 7 are page_token / page_size on the list request — INTENTIONALLY ABSENT: an export covers
  // the whole filtered set up to the scope's row limit, so paging is an internal production concern
  // and never a request parameter.
  SlaOutcome sla_outcome = 8;
}

message CreateExportRequest {
  // From the closed catalogue (libs/common/src/exports/scopes.ts). Unknown ⇒ INVALID_ARGUMENT, never
  // coerced to a default — feature 012's live defect was exactly a silently coerced unknown value.
  string scope = 1;
  ExportFilters filters = 2;
}

message ExportJob {
  string id = 1;
  string scope = 2;
  string format = 3;
  string status = 4;            // queued | running | ready | failed | expired
  int32 row_count = 5;          // 0 until complete
  int64 byte_size = 6;          // 0 until complete
  string failure_reason = 7;    // a short CODE from the closed list, never a raw error or a row value
  string expires_at = 8;        // RFC3339
  string created_at = 9;        // RFC3339
  string completed_at = 10;     // RFC3339, empty until terminal
  // `requested_by` is deliberately ABSENT: the caller is always the owner, so echoing an actor id
  // adds a joinable identifier and no information.
  // `upload_id` is deliberately ABSENT: obtainable only through ResolveExportArtefact, so no client
  // can accumulate artefact references from a list response.
}

message ListExportsRequest {
  int32 page_size = 1;          // server-capped
  string cursor = 2;            // opaque keyset cursor
}

message ListExportsResponse {
  repeated ExportJob exports = 1;
  string next_cursor = 2;
}

message GetExportRequest {
  string export_id = 1;
}

message ExportArtefactRef {
  string upload_id = 1;         // an id for UploadsService.ReadUpload — never a URL, never signed
  string display_name = 2;      // sanitized, for Content-Disposition; never logged (SEC-26)
}
