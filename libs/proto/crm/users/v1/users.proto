// Chats <-> Users boundary contract (roadmap 2.1, feature 006).
//
// Read-only surface the Chats service consumes for the unified feed + assignment.
// Cross-service data crosses HERE (gRPC), never via a DB join (Principle VIII).
// Player is keyed by player_id and unifies 1..N brands (ADR 0032 §0.1 "Player-lite").
// GR8 fields are NOT in this contract — the GR8 projection is deferred to 7.4.
//
// Feature 011 (RBAC): the caller's effective-permission CONTEXT rides in gRPC METADATA
// (not message fields) — keys `x-actor-user-id`, `x-actor-account-id`, `x-actor-role`,
// `x-actor-permissions` (comma-joined), `x-is-preview`. The service-tier guard re-checks it
// independently so a call that skips the gateway is refused (US1). Field-level masking of the
// Player DTO by tier is applied server-side in US4 (allow-list build; masked fields ABSENT).
//
// Generated TS message types (git-ignored): libs/proto/gen/crm/users/v1/users.ts

syntax = "proto3";

package crm.users.v1;

import "crm/audit/v1/audit.proto";

service UsersReadService {
  rpc GetPlayer(GetPlayerRequest) returns (Player);
  rpc GetOperator(GetOperatorRequest) returns (Operator);
  // Keyset pagination (Principle VII): opaque page_token, never offset/total.
  rpc ListPlayersByBrand(ListPlayersByBrandRequest) returns (PlayerPage);

  // ── Feature 015 (audit trail, roadmap 4.8) — additive. One RPC per source; the gateway fans out
  // and merges. Gated by `platform.audit.view` at BOTH tiers. No write/update/delete counterpart
  // exists anywhere — append-only means there is no mutation path to expose.
  rpc ListAuditEntries(crm.audit.v1.ListAuditEntriesRequest) returns (crm.audit.v1.AuditEntryPage);
}

message GetPlayerRequest {
  string player_id = 1;
}

message GetOperatorRequest {
  string operator_id = 1;
}

message ListPlayersByBrandRequest {
  string brand_id = 1;
  string page_token = 2; // opaque keyset cursor; empty = first page
  int32 page_size = 3;
}

// Our own player fields only. GR8-derived data is served later from the Redis cache
// (5.4) with a stale flag — deliberately absent from this foundational contract.
//
// ═══════════════════════════════════════════════════════════════════════════════════════════════
// ⚠️ EVERY FIELD HERE SITS WHOLLY INSIDE ONE VISIBILITY TIER (feature 018, roadmap 5.1).
//
// The response is built by ALLOW-LIST from the caller's role tier (SEC-AP1), and masking works per
// FIELD NAME. A field spanning two tiers therefore cannot be masked at all — it can only be served
// whole or dropped whole, and each is wrong for somebody. The tier of each field is noted below and
// the map itself lives in libs/common/src/policy/field-tiers.ts.
//
// ⚠️ WHAT KEEPS THE GR8 SNAPSHOT OUT IS THIS MESSAGE, NOT THE MASKING. The snapshot is classified at
// the top tier, and `maskPlayer` therefore KEEPS it for admin/super_admin — they are cleared for it.
// It stays out of every response because there is no field for it here. Consequently the row→wire
// mapping must be an EXPLICIT FIELD LIST, never a spread of the masked record: a generic passthrough
// would serve customer PII to any role cleared for that tier, silently, with every test still green.
// (Established by executing the masking during feature 018's analysis pass.)
// ═══════════════════════════════════════════════════════════════════════════════════════════════
message Player {
  string player_id = 1;             // tier: open
  // NOT tier-classified, and mapped OUTSIDE the masking step — it is the caller's own tenant id,
  // i.e. CONTEXT rather than customer data. Adding it to the tier map would be the wrong repair: a
  // tenancy value would acquire a clearance level it has no business having, and unclassified fields
  // are dropped for EVERY role (including admin), so this field would otherwise always be empty.
  string account_id = 2;
  repeated string brand_ids = 3;    // tier: open — DERIVED from the classified `brands` relation
  bool vip = 4;                     // tier: operational
  string segment = 5;               // tier: operational
  string am_notes = 6;              // tier: am_only
  // tier: operational — the OPERATIONAL attributes only.
  //
  // ⚠️ MEANING NARROWED by feature 018; the field NUMBER does not move. It was documented as carrying
  // custom attributes PLUS preferences PLUS the portfolio scaffold — three columns the policy puts in
  // two different tiers, which made the field unmaskable. Narrowing is safe here and would not be
  // later: no producer has ever written it, because nothing served this message until 5.1.
  string custom_attributes_json = 7;
  // ── feature 018 (roadmap 5.1): the split that makes the message maskable ──────────────────────
  string preferences_json = 8;      // tier: am_only
  string portfolio_json = 9;        // tier: am_only
}

message Operator {
  string operator_id = 1;
  string account_id = 2;
  string display_name = 3;
  bool active = 4;
}

message PlayerPage {
  repeated Player players = 1;
  string next_page_token = 2; // empty when no more pages
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Feature 016 — One Validated Upload Path (roadmap 4.9). ADDITIVE ONLY: a new service and new
// messages; nothing above is renumbered, renamed or removed (`buf breaking` stays clean).
//
// NOT a separate .proto file, deliberately: feature 015 created crm/audit/v1/audit.proto because
// THREE services implemented the same messages. Here one service implements and the others are
// clients, so a shared file would buy nothing and cost an import (research R12).
// ═══════════════════════════════════════════════════════════════════════════════════════════════

// UploadsService — the ONLY surface in the product through which bytes enter or leave (FR-001).
//
// Owned by `users` (research R1). `users` is the only service holding object-store credentials, so
// "stored files are unreachable without the product's authorization" (FR-021/SC-010) is a property
// of the deployment rather than a claim in a document.
//
// Unary, not streaming (research R2): the caps are 10 MB (attachment) and 2 MB (avatar), and the
// risk in this feature belongs in validation and ownership, not in transport plumbing. The
// header/bytes split below is already stream-compatible, so growing past the caps is a migration,
// not a redesign. gRPC message limits are raised to 12 MB on this path only.
//
// Caller context rides in METADATA as everywhere else (x-actor-account-id / -user-id /
// -permissions / x-is-preview), never in a message body.
service UploadsService {
  // Validate and store. Refuses unless: the purpose exists, the caller holds its permission, the
  // size is within its cap, and the file's ACTUAL CONTENT is on its allow-list. For image purposes
  // the decode must also succeed, and a derivative is produced from it.
  rpc CreateUpload(CreateUploadRequest) returns (Upload);

  // Serve bytes back. Authorization is evaluated HERE, at request time (FR-010) — a reference that
  // was once usable stops working the moment the requester's account or permissions change.
  rpc ReadUpload(ReadUploadRequest) returns (UploadContent);

  // A consumer claims uploads before writing the record that references them (research R8).
  // Refuses an upload from another account or one that does not exist — which is what makes a
  // cross-account attachment impossible (FR-015).
  rpc ClaimUploads(ClaimUploadsRequest) returns (ClaimUploadsResponse);

  // Metadata for rendering (name, type, size, whether a derivative exists). No bytes.
  rpc DescribeUploads(DescribeUploadsRequest) returns (DescribeUploadsResponse);

  // ── Deliberately ABSENT ────────────────────────────────────────────────────────────────────────
  // • No UpdateUpload / DeleteUpload. Nothing in v1 removes bytes; reclaiming abandoned uploads is
  //   a retention concern (ADR 0015) and its own feature — which must also decide what a `deletion`
  //   audit entry looks like for a file.
  // • No presigned-URL RPC. FR-010 requires authorization at request time; a signed URL grants
  //   access to whoever holds it for the length of its window, which is exactly the SEC-10
  //   leaked-link case.
  // • No "upload on behalf of" parameter. The uploader is the caller, from metadata, always.
}

enum UploadVariant {
  UPLOAD_VARIANT_UNSPECIFIED = 0;
  UPLOAD_VARIANT_ORIGINAL = 1;
  UPLOAD_VARIANT_DERIVATIVE = 2; // absent for non-image purposes → NOT_FOUND, never a silent fallback
}

message CreateUploadRequest {
  // From the closed catalogue (libs/common/src/uploads/purposes.ts). Unknown → INVALID_ARGUMENT.
  string purpose = 1;
  // What the client SAYS it is. Recorded nowhere: it is compared against the detected type and then
  // discarded. A stored declared-type would look authoritative to a future reader and is not.
  string declared_content_type = 2;
  // The client's filename. Used only to derive a sanitized display label — never the storage
  // identity (FR-008), and never logged (FR-020: a filename can itself be PII).
  string filename = 3;
  bytes content = 4;
}

message Upload {
  string id = 1;
  string purpose = 2;
  string content_type = 3; // VERIFIED from content — never the declared value
  int64 byte_size = 4;
  string display_name = 5;
  bool has_derivative = 6;
  string created_at = 7; // RFC3339
}

message ReadUploadRequest {
  string upload_id = 1;
  UploadVariant variant = 2;
}

message UploadContent {
  string content_type = 1; // the verified type; the gateway sends exactly this, with nosniff
  string display_name = 2; // sanitized, for Content-Disposition
  bool inline_safe = 3;    // true only for raster images → gateway may use `inline`; PDF is `attachment`
  bytes content = 4;
}

// Both id-list requests below are CAPPED at 50 ids and refuse above it. `repeated string` with no
// bound is an unbounded request on an authenticated path — a caller could pass ten thousand ids and
// turn one call into a scan (Principle VII / FR-023). The cap is enforced at both tiers.
message ClaimUploadsRequest {
  repeated string upload_ids = 1; // max 50
  // What is claiming them, e.g. "chats:message". Opaque provenance, never a joinable key — the
  // consumer's own table holds the real reference.
  string claimed_by = 2;
}

message ClaimUploadsResponse {
  // Echoed on success. A partial claim is not possible: any id that is unknown, already claimed by
  // something else, or in another account fails the whole call (FR-015 — validate before any write).
  repeated string upload_ids = 1;
}

message DescribeUploadsRequest {
  repeated string upload_ids = 1; // max 50 — see the note above ClaimUploadsRequest
}

message DescribeUploadsResponse {
  // Only uploads in the caller's account. An id from another account is simply absent — the
  // response never distinguishes "not yours" from "does not exist" (FR-011).
  repeated Upload uploads = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// UsersMaintenanceService — the ONE place stored bytes are removed (feature 017, research R8)
//
// A separate service, deliberately NOT part of `UploadsService`: it is not a requester-facing verb.
// The gateway exposes NO route to it, and the handler refuses any caller without `x-actor-kind: system`.
// Modelled on chats.ChatsMaintenanceService, which feature 014 introduced for the same shape.
//
// ⚠️ This SUPERSEDES feature 016's "nothing in v1 removes bytes" for ONE purpose class, and the
// property that replaces it is NARROWER, not weaker:
//   • only purposes declared `ephemeral: true` are selectable — no `ingested` purpose may be
//     ephemeral, so an avatar or an attachment is structurally unreachable from here;
//   • only a system actor may call it, and there is no route;
//   • there is still NO UpdateUpload / DeleteUpload / PresignUpload / SignUpload on the uploads
//     surface — a user-facing delete does not exist.
// An artefact whose defining property is that it EXPIRES cannot honour "nothing removes bytes", and a
// flag that says "expired" while the bytes sit in a bucket is SEC-27 rather than a fix for it.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service UsersMaintenanceService {
  // Delete the bytes of ephemeral artefacts past their expiry, then their rows. Idempotent by
  // predicate: a purged row leaves the predicate because the row is gone. Counts only in the response.
  rpc PurgeExpiredArtefacts(MaintenanceBatchRequest) returns (PurgeResult);
}

message MaintenanceBatchRequest {
  int32 limit = 1;                  // server-capped
}

message PurgeResult {
  int32 purged = 1;                 // object AND row both gone
  int32 object_missing = 2;         // object already absent, row removed anyway — NORMAL, not an error
  int32 failed = 3;                 // storage refused; the row stays and the next tick retries
}
