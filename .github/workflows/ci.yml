name: CI

# Quality gate (roadmap 0.8 / US6): install -> lint -> test on every push and PR.
# `npm ci` triggers the root postinstall (proto:gen) so generated stubs exist before
# lint/test. A red stage fails the check and blocks the merge.
on:
  push:
  pull_request:

jobs:
  install-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (also generates proto stubs via postinstall)
        run: npm ci

      - name: Lint (ESLint + tsc --noEmit across workspaces)
        run: npm run lint

      # ⭐ 2026-08-13 — the gate now SAYS WHAT BROKE, and that is a fix rather than a convenience.
      #
      # ── Why this shape ───────────────────────────────────────────────────────────────────────────
      # The step log is readable only with repository credentials (`GET …/actions/runs/{id}/logs`
      # answers 403 unauthenticated, on a PUBLIC repo too), and the failure annotation carries exactly
      # one sentence: «Process completed with exit code 1». So a red run could be seen and not read —
      # which is how the W35 push produced a failure nobody could diagnose without opening the browser,
      # while the same commit passed a full Linux rehearsal three times. A gate whose verdict cannot be
      # read is a gate that gets re-run instead of understood.
      #
      # The job SUMMARY is published in the check run's `output`, which IS readable without credentials.
      # So on failure the failing suites and the tail of the output go there.
      #
      # ⚠️ **The command is NOT piped.** `npm test | tail` would report tail's exit code, and a red suite
      # would pass — the same trap that once deployed a stale image to the stand (W28) and hid two red
      # guards behind a green line (W30). Output goes to a FILE, the code is captured bare, and the step
      # exits with it.
      - name: Test (Jest services + next/jest web + root linking test)
        run: |
          set +e
          npm test > /tmp/test-output.txt 2>&1
          code=$?
          set -e
          tail -c 200000 /tmp/test-output.txt
          if [ "$code" -ne 0 ]; then
            # ⭐ THE VERDICT AS AN ANNOTATION, which is the half that is readable WITHOUT credentials.
            #
            # The job summary below renders on the run page for a human. The API does not expose it
            # (`check-runs` answers an empty `output`), and the step log is 403 for anyone without repo
            # access — so a red run could be seen and not read. An `::error::` annotation IS returned by
            # `GET /repos/{o}/{r}/check-runs/{id}/annotations` unauthenticated, so the failing suites and
            # assertions travel to whoever needs them instead of only to whoever can log in.
            #
            # Newlines are `%0A` and a literal `%` is `%25` — the workflow-command escaping, in that order
            # (escaping `%` after the newlines would double-escape the separators).
            # The failing suites and assertions, PLUS the first failure's own block — the diff is what
            # names the offending line, and a test name alone sends the reader guessing (it did: the first
            # annotation identified a source-scanning test and not the source it objected to).
            detail=$( { grep -E '^(FAIL |Summary of all failing tests)' /tmp/test-output.txt | sort -u | head -12
                        awk '/^[[:space:]]+● /{ if (!/● Console/) { block=1 } } block { print; n++ } n>45{ exit }' \
                          /tmp/test-output.txt; } | head -60)
            esc=$(printf '%s' "$detail" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=Test failures::${esc}"
            {
              echo "## Test step failed (exit $code)"
              echo
              echo "### Suites reported as FAIL"
              echo '```'
              grep -E '^(FAIL|Summary of all failing tests)' /tmp/test-output.txt | sort -u | head -40 || true
              echo '```'
              echo "### Failing assertions"
              echo '```'
              grep -nE '^\s+● ' /tmp/test-output.txt | grep -v 'Console' | head -40 || true
              echo '```'
              echo "### Last 120 lines"
              echo '```'
              tail -120 /tmp/test-output.txt || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
