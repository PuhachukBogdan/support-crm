# Local development orchestration (spec 003-local-infra, US1).
#
# `docker compose up` brings up one Postgres engine (a DB + isolated role per data-owning
# service, created by deploy/local/postgres/init) and one Redis, then the six backend
# services. Only the gateway is exposed to the host (single ingress, US4). The Next.js web
# app runs via `npm run dev:web` (not containerised until Phase 8). Local dev only —
# production is Kubernetes (Phase 13). Secrets come from .env (git-ignored); there are NO
# defaults baked in (FR-005). See deploy/local/README.md for the port map.

name: crm

x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Per-service role passwords consumed by the init script (no hardcoded creds).
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
      CHATS_DB_PASSWORD: ${CHATS_DB_PASSWORD:?set CHATS_DB_PASSWORD in .env}
      BRANDS_DB_PASSWORD: ${BRANDS_DB_PASSWORD:?set BRANDS_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    # Optional host bind for a local DB client; comment out to keep Postgres internal-only.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Object store for uploaded bytes (feature 016, roadmap 4.9 — spec Q1 / research R6).
  # MinIO here and on beton-test; a managed private bucket in production — ONE client
  # (@aws-sdk/client-s3) for both, so Track B exercises the shape that actually ships.
  # ONLY the users service holds these credentials (research R2): the gateway proxies bytes
  # and gains no storage configuration at all, which is what makes "one validated path"
  # (FR-001) checkable rather than a convention.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - miniodata:/data
    # Host-bound to 127.0.0.1 so SC-010/SEC-39 can be asserted directly against the store
    # (Track B B4: an anonymous GET of an object URL must be denied).
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and assert it is PRIVATE. `mc anonymous set none` is
  # deliberate rather than relying on MinIO's default — SEC-39 is a posture we assert, not
  # one we inherit. No public read policy is set anywhere, ever.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        mc alias set store http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "store/$$S3_BUCKET" &&
        mc anonymous set none "store/$$S3_BUCKET" &&
        echo "bucket ready (private)"
    restart: 'no'

  gateway:
    <<: *service-base
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      REDIS_URL: redis://redis:6379
      AUTH_GRPC_TARGET: auth:50051
      USERS_GRPC_TARGET: users:50052
      CHATS_GRPC_TARGET: chats:50053
      BRANDS_GRPC_TARGET: brands:50054
      WORKER_GRPC_TARGET: worker:50055
      # Session edge (feature 009): the guard verifies the access JWT LOCALLY, so the gateway
      # needs the SAME secret the auth service signs with. `Secure` defaults ON; relax to off
      # (COOKIE_SECURE=false in .env) only for local plain-HTTP dev.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    # Single host-exposed ingress: REST + WebSocket on one port (US4 / FR-009).
    #
    # ⚠️ Bound to LOOPBACK. `'3000:3000'` binds 0.0.0.0, which on a host with a public address puts
    # the entire REST API on the open internet over plain HTTP — found exactly that way on the test
    # stand on 2026-08-02, after the front end was published: the browser's door was locked and the
    # API's was not. Nothing in the product needs the host port: the web container reaches the
    # gateway by service name over the compose network, and the live scripts run ON the host.
    # Set GATEWAY_BIND=0.0.0.0 deliberately if some tool really must reach it from elsewhere.
    ports:
      - '${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000'
    # ── Why the gateway is on the `edge` network too (feature 034, W4) ─────────────────────────────
    # The realtime socket is the ONE path the shared Caddy must route to the gateway rather than to
    # the web container: Next.js does not proxy a WebSocket upgrade, so `/ws` goes straight here.
    # Caddy is not part of this compose project, so it can only reach a container that shares the
    # external `edge` network with it — exactly the reason `web` is on two networks (see below).
    #
    # ⚠️ This publishes NOTHING new. The host port above stays loopback-bound and Caddy routes only
    # `/ws` here; joining a docker network is not an internet exposure. The socket is authenticated
    # in the gateway itself — a handshake without a valid session cookie is closed with 1008 — which
    # is what lets the stand's outer basic auth skip this one path (a browser sends no basic-auth
    # credentials on an upgrade, so keeping the lock on `/ws` closed every socket).
    networks:
      - default
      - edge

  auth:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/auth.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50051
      DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD:?}@postgres:5432/auth_db
      # Signs the short-lived access JWT; the gateway verifies it with the SAME secret (009).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # ── Mail (feature 028) ────────────────────────────────────────────────────────────────
      # The defaults describe the CATCHER, because that is the transport local development and
      # every live test round use — mail must not leave a developer's machine or a test round.
      # A real relay overrides four values and nothing else changes (FR-014).
      #
      # ⚠️ `APP_BASE_URL` has no default anywhere in the product. A guessed one emails invitation
      # links that look perfect and lead nowhere — the defect roadmap 8.6/T033 existed for.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env — the invitation link points at it}
      MAIL_BRAND_NAME: ${MAIL_BRAND_NAME:-Support CRM}
      # Empty = unrestricted. Set it on anything that is not production: an accidental send to a
      # real customer address from a synthetic stand is an incident, not a typo (FR-018).
      MAIL_ALLOWED_RECIPIENT_DOMAINS: ${MAIL_ALLOWED_RECIPIENT_DOMAINS:-}
      # Feature 033 (Principle III): the same host allow-list that governs the channel relay and the
      # channel mailbox also governs THIS relay. Auth did not ask for it — feature 028 recorded the
      # egress allow-list as "a later, isolated change" and this is that change, applied at the one
      # shared transport boundary rather than per sender. Absent = unrestricted, so no existing
      # deployment changes behaviour until somebody sets it.
      MAIL_ALLOWED_HOSTS: ${MAIL_ALLOWED_HOSTS:-}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-5}
      # ── The FIXED sign-in code (2026-08-10) — a STAND convenience, off unless both are set ────
      #
      # Set together, they make the emailed code the SAME STRING every time for the listed
      # addresses. Everything else about the second factor is unchanged: the code is still hashed,
      # still expires, still single-use, still emailed. It exists because a stand's owner is signing
      # in many times a day through a mailbox behind the edge proxy's password.
      #
      # ⛔ `auth` REFUSES TO START if only one of the two is set, if the code is not `CODE_LENGTH`
      # characters of the code alphabet, or if `NODE_ENV=production` — a permanent second factor
      # must not be what survives into the deployment holding real data (rule 5 / SEC gate).
      DEV_FIXED_LOGIN_CODE: ${DEV_FIXED_LOGIN_CODE:-}
      DEV_FIXED_LOGIN_CODE_EMAILS: ${DEV_FIXED_LOGIN_CODE_EMAILS:-}
      # Session lifetimes. The DEFAULTS here are the product's (15 min / 1 day / 7 days) — a
      # deployment that sets nothing behaves exactly as before.
      #
      # ⚠️ The hosted stand overrides SESSION_TTL/REMEMBER_TTL to a year in its own `.env`, on the
      # operator's instruction, so a demo session is never interrupted. That is a deliberate
      # weakening and it is safe ONLY because the stand holds synthetic data: a refresh cookie that
      # lives a year is a credential that lives a year. It must be reverted before real data — the
      # security gate (findings.md, P0) owns that, not this file.
      ACCESS_TTL: ${ACCESS_TTL:-900}
      SESSION_TTL: ${SESSION_TTL:-86400}
      REMEMBER_TTL: ${REMEMBER_TTL:-604800}

  users:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/users.Dockerfile }
    # Restated in full: a YAML merge key does not deep-merge `depends_on`, it replaces it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50052
      DATABASE_URL: postgresql://users_user:${USERS_DB_PASSWORD:?}@postgres:5432/users_db
      # Feature 016: the ONLY service holding object-store credentials (research R2/R10).
      # Its config guard is refuse-to-start, so a missing key is a boot failure, never a
      # runtime surprise. The gateway deliberately gains nothing here.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Feature 020: salt for the contact-match hashes. `:?` and NO default, deliberately — an
      # unsalted hash of an email is a dictionary lookup away from the address, and a service that
      # booted without one would build a table of recoverable customer contacts while every test
      # stayed green. Refusing to start is the only failure mode with a symptom.
      CONTACT_HASH_SALT: ${CONTACT_HASH_SALT:?set CONTACT_HASH_SALT in .env (min 32 chars)}
      # Feature 025 (roadmap 5.9) — 🅿 PROVISIONAL, revised by the operations team's real numbers.
      # Both are measured from LAST ACTIVITY, not from entering the previous state. Defaults are
      # given here (unlike the salt above) because a wrong threshold is visible within minutes,
      # whereas a missing salt has no symptom at all — but the service still refuses to boot without
      # a value, so a deployment cannot inherit these by accident.
      PRESENCE_AWAY_AFTER_SECONDS: ${PRESENCE_AWAY_AFTER_SECONDS:-600}
      PRESENCE_OFFLINE_AFTER_SECONDS: ${PRESENCE_OFFLINE_AFTER_SECONDS:-3600}

  chats:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/chats.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50053
      DATABASE_URL: postgresql://chats_user:${CHATS_DB_PASSWORD:?}@postgres:5432/chats_db
      # ── Feature 034 (roadmap 7.1, block W4) — the FIRST Redis in this service, and it PUBLISHES only ──
      #
      # ⚠️ Deliberately not refuse-to-start: absent means the realtime edge is not configured, which is a
      # legitimate deployment (and the whole unit-test suite). The service runs, the socket stays quiet, and
      # every client still sees the truth on its next ordinary read.
      #
      # ⭐ This does NOT overturn "chats has no Redis" (`export.maintenance.ts`). That decision protected
      # two properties — Postgres stays the source of truth, and there is no second store of work — and a
      # fire-and-forget PUBLISH keeps both: it writes nothing, claims nothing and is never read back.
      # `tests/realtime/publish-only.spec.ts` fails the build if `subscribe`/`Queue`/`set(`/`get(` ever
      # appear in this service, so the door stays exactly one verb wide.
      REDIS_URL: redis://redis:6379
      # Feature 014: an automation rule acts with its AUTHOR's current permissions, resolved from
      # auth on every evaluation (FR-023). Acyclic — auth never calls chats.
      AUTH_GRPC_TARGET: auth:50051
      # Feature 016: attachments are claimed and described over the users contract (research R8).
      # Acyclic — users never calls chats. Chats holds NO storage credentials: it references an
      # upload by id and never sees a byte.
      USERS_GRPC_TARGET: users:50052
      # ── Feature 023 (roadmap 4.8a + 4.18) ────────────────────────────────────────────────────
      #
      # ⚠️ These are REQUIRED, not defaulted-in-code. `loadConfig` checks presence before zod runs, so
      # a `.default()` in the schema never applies — the first draft had one, and the service
      # crash-looped here on its first live boot. Compose passes only what is listed (the documented
      # gotcha: `.env` substitutes `${VAR}`, it does not inject).
      #
      # 🅿 PROVISIONAL retention windows, revised by the operator's answer on access-record retention
      # (Q1) and by SEC-25. NOTHING READS THEM YET and no deletion job exists (research R9): deleting
      # history on a number nobody has confirmed is what feature 018 refused when it reverted
      # `record.open`. Declaring them now means the later job reads a value instead of inventing one.
      TRANSITION_RETENTION_DAYS: ${TRANSITION_RETENTION_DAYS:-365}
      TRANSITION_RESTRICTED_RETENTION_DAYS: ${TRANSITION_RESTRICTED_RETENTION_DAYS:-90}
      # The title window's third arm. Lower it on a test box so the sweep is observable in a run that
      # does not last fifteen minutes.
      SUBJECT_WINDOW_TIMEOUT_MINUTES: ${SUBJECT_WINDOW_TIMEOUT_MINUTES:-10}
      # ── Feature 024 (roadmap 5.3) ──
      # 🅿 PROVISIONAL — how many open conversations one operator may hold before auto-assignment
      # skips them, when the pool comes from a GROUP. Revised by roadmap 4.19–4.21 (per-channel
      # capacity budgets, ADR 0042) and 5.9 (presence, which does not exist yet). A caller supplying
      # its own candidate list supplies its own capacities and is unaffected.
      ROUTING_DEFAULT_CAPACITY: ${ROUTING_DEFAULT_CAPACITY:-6}
      # Feature 031 (roadmap 4.21): OPTIONAL per-brand unit budget, `brand-a:4,brand-b:2`. Empty means
      # every brand uses ROUTING_DEFAULT_CAPACITY above — which stays the fallback rather than being
      # replaced, so an upgrade cannot make a deployment's budget vanish.
      ROUTING_CAPACITY_BY_BRAND: ${ROUTING_CAPACITY_BY_BRAND:-}
      # ── Feature 033 (roadmap 6.1/6.5) — channel intake ──
      #
      # ⚠️ Listed here because compose hands the container ONLY what this block names — the failure
      # feature 009's first live run hit, with the key correctly set in `.env` and never reaching the
      # process. These three are tunables, not refuse-to-start keys, so the service boots without them
      # and simply verifies nothing: an empty secret map means every delivery is refused as an unknown
      # channel, which is the fail-closed direction.
      #
      # `<channel key>:<secret>` pairs. The SECRET cannot be a hash — verifying an HMAC needs the key
      # material — so it lives in configuration and nowhere else, never in a database column.
      CHANNEL_SECRETS: ${CHANNEL_SECRETS:-}
      # Bounds forgery (a captured body must not replay forever), NOT duplication — that is the unique
      # constraint on (channel, external event id).
      CHANNEL_INTAKE_REPLAY_WINDOW_S: ${CHANNEL_INTAKE_REPLAY_WINDOW_S:-300}
      CHANNEL_EMAIL_ADDRESS: ${CHANNEL_EMAIL_ADDRESS:-}
      # ── Feature 033 (roadmap 6.5) — the OUTBOUND relay, because chats opens the connection ──
      #
      # ⚠️ These were MISSING, and the block above says why that is fatal: compose hands the container
      # only what this block names. `ChatsSmtpTransport` reads exactly these keys, so without them the
      # host was empty in every compose deployment, nodemailer fell back to localhost:1025 inside a
      # container running no mail server, and the agent's reply died after five retries with the
      # customer's address deliberately absent from the log — a silent failure by construction.
      #
      # Same four values as auth's relay above, and deliberately the SAME NAMES: one transport, one
      # boundary (research R7/R8). Two names for one relay is the two-lists-to-keep-in-agreement
      # problem the move to `libs/common` existed to prevent.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # ⭐ …and the channel's OWN relay, which overrides the five above as a SET (never per key — see
      # `resolveChannelSmtpConfig`: a per-key fallback hands the transactional relay's credentials to
      # somebody else's server). Empty = the channel sends through the same relay as auth, which is the
      # behaviour every deployment had before these keys existed.
      #
      # ⚠️ On this stand they are REQUIRED and the reason is in the `greenmail` block below: login codes
      # stay in mailpit, and the channel's mailbox is greenmail, because mailpit speaks no IMAP at all. In
      # production the same split is ordinary — a brand's support mailbox lives with a provider and its
      # replies must leave through it, or they fail that domain's SPF.
      CHANNEL_SMTP_HOST: ${CHANNEL_SMTP_HOST:-}
      CHANNEL_SMTP_PORT: ${CHANNEL_SMTP_PORT:-}
      CHANNEL_SMTP_SECURE: ${CHANNEL_SMTP_SECURE:-}
      CHANNEL_SMTP_USER: ${CHANNEL_SMTP_USER:-}
      CHANNEL_SMTP_PASSWORD: ${CHANNEL_SMTP_PASSWORD:-}
      # Only the fallback: a channel message's `from` is per-BRAND and comes from the message itself
      # (white-label rule 6), and `CHANNEL_EMAIL_ADDRESS` above wins over this.
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      MAIL_ALLOWED_RECIPIENT_DOMAINS: ${MAIL_ALLOWED_RECIPIENT_DOMAINS:-}
      MAIL_ALLOWED_HOSTS: ${MAIL_ALLOWED_HOSTS:-}
      # The dead-letter threshold for the outbox (FR-039) — `chats` owns the outbox, so `chats` owns the
      # count. ⚠️ It was named on the WORKER's block only, where it does nothing: the worker says "now"
      # and never reads a delivery's attempt count. A deployment that lowered it would have changed
      # nothing, silently, which is worse than a value that is simply wrong.
      CHANNEL_MAIL_MAX_ATTEMPTS: ${CHANNEL_MAIL_MAX_ATTEMPTS:-5}

  brands:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/brands.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50054
      DATABASE_URL: postgresql://brands_user:${BRANDS_DB_PASSWORD:?}@postgres:5432/brands_db

  worker:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/worker.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50055
      REDIS_URL: redis://redis:6379
      # Feature 014: the worker's first real job (first-reply SLA sweep, roadmap 4.7). Scheduling
      # only — chats owns the data and the verdict (research R1/R2). Breach-detection latency is
      # bounded by the interval by design; override it to a few seconds on a test box so a breach is
      # observable in seconds instead of half a minute.
      CHATS_GRPC_TARGET: chats:50053
      SLA_SWEEP_INTERVAL_MS: ${SLA_SWEEP_INTERVAL_MS:-30000}
      SLA_SWEEP_BATCH: ${SLA_SWEEP_BATCH:-500}
      # Feature 017 (roadmap 4.10): two more ticks. The export tick IS the queue — chats has no Redis,
      # so it writes a `queued` row and this claims it (research R3). The purge tick asks `users` to
      # delete expired artefact bytes, because `users` holds the storage credentials and therefore owns
      # the deletion (research R8).
      #
      # ⚠️ USERS_GRPC_TARGET is refuse-to-start config: without it the worker will not boot. That is
      # deliberate — compose passes only the env it lists here, and feature 009's first live run failed
      # exactly this way (a required key present in `.env` but never handed to the container).
      USERS_GRPC_TARGET: users:50052
      # Feature 028: the mail sweep's target. The worker only says "now" — auth holds the outbox,
      # renders the message and opens the SMTP connection (spec 028 research R2).
      AUTH_GRPC_TARGET: auth:50051
      MAIL_SWEEP_INTERVAL_MS: ${MAIL_SWEEP_INTERVAL_MS:-15000}
      MAIL_SWEEP_BATCH: ${MAIL_SWEEP_BATCH:-20}
      EXPORT_RUN_INTERVAL_MS: ${EXPORT_RUN_INTERVAL_MS:-10000}
      EXPORT_RUN_BATCH: ${EXPORT_RUN_BATCH:-5}
      # Shorten this on a test box to watch a purge happen instead of waiting five minutes.
      ARTEFACT_PURGE_INTERVAL_MS: ${ARTEFACT_PURGE_INTERVAL_MS:-300000}
      ARTEFACT_PURGE_BATCH: ${ARTEFACT_PURGE_BATCH:-100}
      # ── Feature 033 (roadmap 6.4) — the channel mailbox, and the egress guard on both mail hosts ──
      #
      # This service holds the only long-lived CONNECTION in the product: an IMAP session kept open so
      # the mailbox can tell us a message arrived (IDLE). `greenmail` serves it — mailpit speaks no
      # IMAP at all, which is why a second mail server exists (research R16).
      #
      # An absent host means the reader never starts, which is correct for every deployment with no
      # email channel; it is deliberately NOT refuse-to-start config for that reason.
      # ⭐ WHICH channel this mailbox is. The reader asks chats which tenant owns this key rather than
      # being told in configuration — a configured account id can DISAGREE with the `Channel` row, and the
      # disagreement uploads one tenant's customer files into another tenant's storage.
      CHANNEL_KEY: ${CHANNEL_KEY:-}
      # The address this channel sends FROM, when it differs from the IMAP user. Used for ONE thing: the
      # loop check no header provides — our own reply arriving back through somebody's auto-forward.
      CHANNEL_MAIL_FROM: ${CHANNEL_MAIL_FROM:-}
      CHANNEL_IMAP_HOST: ${CHANNEL_IMAP_HOST:-greenmail}
      CHANNEL_IMAP_PORT: ${CHANNEL_IMAP_PORT:-3143}
      CHANNEL_IMAP_SECURE: ${CHANNEL_IMAP_SECURE:-false}
      CHANNEL_IMAP_USER: ${CHANNEL_IMAP_USER:-}
      CHANNEL_IMAP_PASSWORD: ${CHANNEL_IMAP_PASSWORD:-}
      # ⚠️ The SAFETY NET, not the delivery path — delivery is push. If this interval ever starts to
      # determine how fast mail appears, the IDLE connection is broken and this is hiding it.
      CHANNEL_MAIL_SWEEP_INTERVAL_MS: ${CHANNEL_MAIL_SWEEP_INTERVAL_MS:-60000}
      CHANNEL_MAIL_MAX_ATTEMPTS: ${CHANNEL_MAIL_MAX_ATTEMPTS:-5}
      # ⭐ The SENDER's clock (feature 033 US4). 15 s, matching feature 028's mail sweep: an agent's reply
      # is something a person is waiting on, like a login code and unlike a breach. Clamped in code.
      CHANNEL_OUTBOUND_INTERVAL_MS: ${CHANNEL_OUTBOUND_INTERVAL_MS:-15000}
      CHANNEL_OUTBOUND_BATCH: ${CHANNEL_OUTBOUND_BATCH:-20}
      # Egress allow-list for every outbound mail connection the product opens (Principle III) — one
      # list for one boundary, so auth's relay and this service's mailbox cannot disagree. Empty =
      # unrestricted, the same reading feature 028 chose for recipient domains: reversed, it would
      # silently stop all mail in production, where empty is the legitimate setting.
      MAIL_ALLOWED_HOSTS: ${MAIL_ALLOWED_HOSTS:-}

  # The mail catcher (feature 028). ⚠️ NOT scaffolding — this is the transport for local
  # development and for every live test round, because mail must not leave a developer's machine
  # and a round must be able to read the DELIVERED MESSAGE rather than a database row.
  #
  # ⚠️ The web interface is bound to LOOPBACK by default, like the gateway (SEC-40): it is a
  # mailbox full of live one-time codes, and anyone who can read it can sign in as anybody.
  # Publishing it is a deliberate act — on the hosted stand it goes behind the edge proxy's own
  # password, and it must be gone before real data (tracked with SEC-42).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_UI_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025'
    networks:
      - default
      - edge

  # ── The CHANNEL mailbox (feature 033, research R16) ─────────────────────────────────────────────
  #
  # ⚠️ **Why a second mail server rather than reusing mailpit.** Mailpit speaks SMTP, POP3 and its own
  # REST API — and NOT IMAP (verified on v1.30.6: `--pop3` exists, no `--imap` flag does). Feature 033
  # takes mail in over IMAP with **IDLE**, because the operator asked for real time and POP3 has no
  # push. So the stand would have had nothing to prove the real transport against.
  #
  # The alternative — a Mailpit-REST inbound adapter for the stand and IMAP for production — was
  # rejected: it puts a code path in the product that only the stand ever runs, and leaves the path
  # customers depend on proven by unit tests alone. This repository has shipped that exact gap twice
  # (roadmap 4.9, 5.1), which is why a live round is required at all.
  #
  # ── One server, two roles ───────────────────────────────────────────────────────────────────────
  # It is BOTH our support mailbox and, in a live round, the "customer's" mailbox — the addresses tell
  # the two apart, the server does not need to. That is what lets `live-w3.sh` read the agent's reply
  # out of the customer's inbox and then answer it, proving the threading leg end to end.
  #
  # ⚠️ Authentication is disabled: it is a synthetic mailbox on a synthetic stand, and it holds no
  # login codes (those stay in mailpit). Like mailpit, it must be gone before real data (SEC-42).
  greenmail:
    image: greenmail/standalone:2.1.10
    restart: unless-stopped
    environment:
      # `auth.disabled` creates a user on first login, so no provisioning step exists to forget.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      # Loopback by default, exactly like mailpit and the gateway (SEC-40).
      - '${GREENMAIL_BIND:-127.0.0.1}:${GREENMAIL_SMTP_PORT:-3025}:3025'
      - '${GREENMAIL_BIND:-127.0.0.1}:${GREENMAIL_IMAP_PORT:-3143}:3143'
    networks:
      - default

  # The Next.js front end (roadmap 8.6 hosted; the containerisation itself belongs to Phase 13 and
  # is done early here so the product can be opened in a browser).
  #
  # ── Why it is on TWO networks ───────────────────────────────────────────────────────────────────
  # `default` so it can reach `gateway` by service name, and the external `edge` network so the
  # shared Caddy reverse proxy can reach IT by container name. Caddy is not part of this compose
  # project — it fronts several unrelated projects on the same host — so the network is declared
  # external rather than created here.
  #
  # ⚠️ It publishes NO host port. The only way in is through Caddy, which terminates TLS. Publishing
  # a port as well would quietly create a second, plain-HTTP door to the same app, and the session
  # cookies are `Secure` — they would simply not be sent on it, which presents as "login does
  # nothing" rather than as a misconfiguration.
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        # Build-time, not runtime: Next bakes `rewrites()` into the build. See the Dockerfile.
        GATEWAY_ORIGIN: http://gateway:3000
        # ── Feature 034 (W4): where the BROWSER dials the socket ──────────────────────────────────
        #
        # ⚠️ Build-time for the same reason as the line above: `NEXT_PUBLIC_*` is inlined into the client
        # bundle, so setting it only at runtime changes nothing at all — a trap worth naming, because the
        # symptom is a socket that quietly keeps using the default.
        #
        # ⭐ Empty means SAME ORIGIN (`/ws` on whatever serves the page), which is the correct production
        # shape: one origin, one cookie, one certificate, with the edge proxy routing `/ws` to the gateway.
        # It is set here because on this stand a browser reaches the containers directly, and Next's rewrite
        # covers REST only — a WebSocket upgrade is not a rewrite. Getting this wrong is what made W4's first
        # headed check receive 0 frames while `live-w4.sh` passed 13/13.
        NEXT_PUBLIC_WS_ORIGIN: ${NEXT_PUBLIC_WS_ORIGIN:-}
        # `on` enables the realtime subscription. Off by default — see providers.tsx for why.
        NEXT_PUBLIC_REALTIME: ${NEXT_PUBLIC_REALTIME:-}
    environment:
      NODE_ENV: production
      GATEWAY_ORIGIN: http://gateway:3000
      NEXT_PUBLIC_WS_ORIGIN: ${NEXT_PUBLIC_WS_ORIGIN:-}
    # ⚠️ **LOOPBACK ONLY**, and that is the whole point of writing the address out.
    #
    # Bound to 127.0.0.1 so the UI is reachable over an SSH tunnel (`ssh -L 3002:localhost:3002`)
    # WITHOUT going through the edge proxy — which is how a proxy-specific fault gets ruled in or out
    # instead of argued about. It is not published to the host's public address: SEC-40 was exactly
    # that mistake made with the gateway's port, and the same default (`0.0.0.0`) would repeat it.
    #
    # ⓘ Override with WEB_BIND if a different loopback address is wanted; there is no reason to set
    # it to 0.0.0.0, because the public route is Caddy's and it carries the outer password.
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3002}:3001'
    depends_on:
      - gateway
    networks:
      - default
      - edge

volumes:
  pgdata:
  miniodata:

networks:
  default:
  # Created outside this project by the shared reverse proxy. `docker network create edge` if a
  # fresh host does not have it.
  edge:
    external: true
