// Chats <-> Users boundary contract (roadmap 2.1, feature 006).
//
// Read-only surface the Chats service consumes for the unified feed + assignment.
// Cross-service data crosses HERE (gRPC), never via a DB join (Principle VIII).
// Player is keyed by player_id and unifies 1..N brands (ADR 0032 §0.1 "Player-lite").
// GR8 fields are NOT in this contract — the GR8 projection is deferred to 7.4.
//
// Feature 011 (RBAC): the caller's effective-permission CONTEXT rides in gRPC METADATA
// (not message fields) — keys `x-actor-user-id`, `x-actor-account-id`, `x-actor-role`,
// `x-actor-permissions` (comma-joined), `x-is-preview`. The service-tier guard re-checks it
// independently so a call that skips the gateway is refused (US1). Field-level masking of the
// Player DTO by tier is applied server-side in US4 (allow-list build; masked fields ABSENT).
//
// Generated TS message types (git-ignored): libs/proto/gen/crm/users/v1/users.ts

syntax = "proto3";

package crm.users.v1;

import "crm/audit/v1/audit.proto";

service UsersReadService {
  rpc GetPlayer(GetPlayerRequest) returns (Player);
  rpc GetOperator(GetOperatorRequest) returns (Operator);
  // Keyset pagination (Principle VII): opaque page_token, never offset/total.
  rpc ListPlayersByBrand(ListPlayersByBrandRequest) returns (PlayerPage);

  // ── W9 / spec 035 (ADR 0044 §4) — the anti-pitching inversion, caller-credentialed ──
  //
  // "Does this email/phone belong to a player?" — read-only (unlike Maintenance's
  // ResolveChannelParticipant, which upserts), gated by `crm.contact.lookup`, audited on EVERY
  // attempt with the salted hash of the value, rate-capped per user by counting the trail itself.
  // The response is JUST ENOUGH to confirm and attach: ids, a matched flag, an ambiguous flag that
  // names nobody. The searched value never comes back; no page, no list, no card.
  rpc LookupPlayerByContact(LookupPlayerByContactRequest) returns (ContactLookupResult);

  // ── Feature 020 (roadmap 5.2) — additive. Which brand-scoped records make up one human.
  //
  // Chats needs it to answer a person's conversation feed and cannot join across services
  // (Principle VIII), so identity crosses HERE, as an explicit call — the same way chats already
  // dials this service for uploads. Chats never derives a person itself; it asks.
  rpc ListPersonMembers(ListPersonMembersRequest) returns (PersonMemberList);

  // ── Feature 024 (roadmap 5.3) — additive. AUTH user ids → assignable operator profiles.
  //
  // Group membership is keyed on the AUTH identity (the subject the permission resolver keys on),
  // while a conversation's assignee is an operator PROFILE. Turning a group into a routing candidate
  // pool therefore needs one explicit translation, and it is explicit rather than assumed: see
  // specs/024-groups-and-grants/research.md R3, which also records why
  // `Conversation.assignee_operator_id` is NOT reinterpreted to close the gap.
  rpc ListOperatorsByAuthUsers(ListOperatorsByAuthUsersRequest) returns (ListOperatorsByAuthUsersResponse);

  // ── Feature 015 (audit trail, roadmap 4.8) — additive. One RPC per source; the gateway fans out
  // and merges. Gated by `platform.audit.view` at BOTH tiers. No write/update/delete counterpart
  // exists anywhere — append-only means there is no mutation path to expose.
  rpc ListAuditEntries(crm.audit.v1.ListAuditEntriesRequest) returns (crm.audit.v1.AuditEntryPage);

  // ── Feature 025 (roadmap 5.9) — additive. Who is available to take work right now.
  //
  // READS only, and that is not a style choice: `tests/users-read/no-outbound.spec.ts` requires every
  // rpc on this service to be `Get*`/`List*`, and it already rejected feature 024's first draft
  // (`ResolveOperators`). The presence WRITES therefore live on `OperatorPresenceService` below.
  rpc GetOperatorPresence(GetOperatorPresenceRequest) returns (OperatorPresence);
  rpc ListOperatorPresence(ListOperatorPresenceRequest) returns (OperatorPresenceList);

  // ── Feature 026 (roadmap 5.7) — additive. Which player is looked after by which manager.
  //
  // READS only, for the reason every read on this service is: `tests/users-read/no-outbound.spec.ts`
  // requires every rpc here to be `Get*`/`List*`. The assignment WRITES live on
  // `PlayerAssignmentService` below.
  rpc GetPlayerAssignment(GetPlayerAssignmentRequest) returns (PlayerAssignment);
  rpc ListAssignedPlayers(ListAssignedPlayersRequest) returns (AssignedPlayerPage);
}

message GetPlayerRequest {
  string player_id = 1;
  // ⚠️ REQUIRED since feature 020 (roadmap 5.2 / ADR 0038 §3). `player_id` is unique only WITHIN a
  // brand — the same value under two brands is two different people — so a request naming only the
  // platform id does not identify a customer, it names two. Absent ⇒ INVALID_ARGUMENT, never an
  // arbitrary match. Added as a new field rather than by changing field 1, so the change is additive.
  string brand_id = 2;
}

// Feature 020. The members are full identities: a bare platform id would name two customers.
message ListPersonMembersRequest {
  string person_id = 1;
}

message PlayerRef {
  string brand_id = 1;
  string player_id = 2;
}

message PersonMemberList {
  repeated PlayerRef members = 1;
}

message GetOperatorRequest {
  string operator_id = 1;
}

message ListPlayersByBrandRequest {
  string brand_id = 1;
  string page_token = 2; // opaque keyset cursor; empty = first page
  int32 page_size = 3;
  /**
   * ⭐ W11 (roadmap 9.17) — narrow the page to platform ids that BEGIN with this.
   *
   * ⚠️ **A PLAYER ID, never a contact.** Searching by email or phone is the anti-pitching
   * INVERSION and it lives in exactly one place: `LookupPlayerByContact`, reachable only from
   * inside an unidentified conversation, audited with a hash and rate-capped (ADR 0044 §4). A
   * directory that searched by contact would be the "player database with a search box" that
   * decision forbids — so this field accepts the id the agent already has in front of them.
   *
   * It widens no disclosure: the same page, narrowed. The bulk-read tier guard still runs FIRST,
   * so a role that may not read the directory at all is refused before this is ever consulted.
   */
  string player_id_prefix = 4;
}

// Our own player fields only. GR8-derived data is served later from the Redis cache
// (5.4) with a stale flag — deliberately absent from this foundational contract.
//
// ═══════════════════════════════════════════════════════════════════════════════════════════════
// ⚠️ EVERY FIELD HERE SITS WHOLLY INSIDE ONE VISIBILITY TIER (feature 018, roadmap 5.1).
//
// The response is built by ALLOW-LIST from the caller's role tier (SEC-AP1), and masking works per
// FIELD NAME. A field spanning two tiers therefore cannot be masked at all — it can only be served
// whole or dropped whole, and each is wrong for somebody. The tier of each field is noted below and
// the map itself lives in libs/common/src/policy/field-tiers.ts.
//
// ⚠️ WHAT KEEPS THE GR8 SNAPSHOT OUT IS THIS MESSAGE, NOT THE MASKING. The snapshot is classified at
// the top tier, and `maskPlayer` therefore KEEPS it for admin/super_admin — they are cleared for it.
// It stays out of every response because there is no field for it here. Consequently the row→wire
// mapping must be an EXPLICIT FIELD LIST, never a spread of the masked record: a generic passthrough
// would serve customer PII to any role cleared for that tier, silently, with every test still green.
// (Established by executing the masking during feature 018's analysis pass.)
// ═══════════════════════════════════════════════════════════════════════════════════════════════
message Player {
  string player_id = 1;             // tier: open — unique only WITHIN a brand (feature 020)
  // NOT tier-classified, and mapped OUTSIDE the masking step — it is the caller's own tenant id,
  // i.e. CONTEXT rather than customer data. Adding it to the tier map would be the wrong repair: a
  // tenancy value would acquire a clearance level it has no business having, and unclassified fields
  // are dropped for EVERY role (including admin), so this field would otherwise always be empty.
  string account_id = 2;
  // ⚠️ DEPRECATED by feature 020 — use `brand_id` (field 10). Kept with its number and its repeated
  // type because consumers already read it: narrowing a repeated field to "always one" is a meaning
  // change on live data, and `buf breaking` would flag the removal. It now carries exactly one
  // element — this record's brand. Remove in a later change, once nothing reads it.
  repeated string brand_ids = 3 [deprecated = true];
  bool vip = 4;                     // tier: operational
  string segment = 5;               // tier: operational
  string am_notes = 6;              // tier: am_only
  // tier: operational — the OPERATIONAL attributes only.
  //
  // ⚠️ MEANING NARROWED by feature 018; the field NUMBER does not move. It was documented as carrying
  // custom attributes PLUS preferences PLUS the portfolio scaffold — three columns the policy puts in
  // two different tiers, which made the field unmaskable. Narrowing is safe here and would not be
  // later: no producer has ever written it, because nothing served this message until 5.1.
  string custom_attributes_json = 7;
  // ── feature 018 (roadmap 5.1): the split that makes the message maskable ──────────────────────
  // ⚠️ THE CUSTOMER's preferences — VIP portfolio data about a real human being. NOT an operator's
  // UI settings: those are `OperatorUiPreferencesService` at the end of this file (feature 021), and
  // the two are named apart so a search for one never returns the other. Roadmap 4.15's gap survived
  // seven features because "custom attributes" existed on `Player` while the requirement meant
  // `Conversation` — the name being taken made everyone assume the thing was built.
  string preferences_json = 8;      // tier: am_only
  string portfolio_json = 9;        // tier: am_only
  // The brand this record belongs to — part of its IDENTITY, never part of an access decision
  // (ADR 0038 §1: one support department serves every brand). Field 10 = additive.
  string brand_id = 10;             // tier: open
  // ── Feature 022 (roadmap 4.13) — additive, field 11 ───────────────────────────────────────────
  //
  // WHICH HUMAN THIS RECORD BELONGS TO. Empty when this record is not linked to any other.
  //
  // Why it exists: feature 020 stored the cross-brand link (`Person` / `PersonMember`) and exposed it
  // in ONE direction only — `ListPersonMembers(person_id)` → members. Nothing could go the other way,
  // and every card is opened on a brand-scoped player record. So the person-level reads 020 declared
  // (`chats.GetPersonFeed`) were UNADDRESSABLE: the caller had no way to obtain the identifier they
  // require. A link that cannot be reached from the side the product reads from is the same defect as
  // an rpc nothing serves, one layer down.
  //
  // Why a FIELD and not a `GetPersonForPlayer` rpc: the card already fetches the player, so it learns
  // the person in a read it is already making. A separate lookup would be a second round trip on the
  // critical path of every card open, and a card that rendered before it returned would show the
  // brand-scoped answer and then widen — a visible flicker between two truths about one human.
  //
  // At most one person per player record is a DATABASE guarantee
  // (`PersonMember.@@unique([account_id, brand_id, player_id])`), which is why "absent link ⇒ empty"
  // needs no tie-breaking rule and the reverse lookup needs no new index.
  //
  // NOT a write surface: establishing, changing or removing a link stays feature 020's
  // (`linkByContact` / `unlink`, on a matching email or phone).
  string person_id = 11;            // tier: open
}

message Operator {
  string operator_id = 1;
  string account_id = 2;
  string display_name = 3;
  bool active = 4;
  // ⭐ W19 (subpoint 5.4, roadmap 8.10): the avatar as an UPLOAD REFERENCE — never bytes, never a
  // URL. The bytes live behind feature 016's one ingest path (`purpose: avatar` — 2 MB, png/jpeg/
  // webp by MAGIC BYTES, an always-made 256px derivative); a reader renders
  // `/uploads/{id}/thumb`, and the purpose's `permission: null` means any signed-in colleague in
  // the account may see it. "" = no avatar set.
  string avatar_upload_id = 5;
}

// ── Feature 024 (roadmap 5.3): the auth-identity → operator-profile translation ──────────────────

message ListOperatorsByAuthUsersRequest {
  string account_id = 1;
  repeated string auth_user_ids = 2;
}

message ResolvedOperator {
  string operator_id = 1;
  string auth_user_id = 2;

  // ── Feature 025 (roadmap 5.9) — additive, and this is WHY presence lives in this service.
  //
  // Routing already calls this rpc to turn a desk's membership into candidates. Availability rides
  // the answer, so the hot path gains a FACT and not a HOP (research R5). Anywhere else, chats would
  // need a third call — or a second place that answers "can this person take work?".
  //
  // `blocked_channels` lists ONLY the channels switched OFF. Absence means available: a channel this
  // product has never heard of is available by construction, which is what lets Phase 6 introduce one
  // without a migration here (research R8).
  PresenceState state = 3;
  repeated string blocked_channels = 4;
}

message ListOperatorsByAuthUsersResponse {
  // ACTIVE profiles only. A member with no profile, or with an inactive one, is simply ABSENT — and
  // is therefore not a routing candidate (fail-closed). The difference between the number asked for
  // and the number returned is what makes an empty pool explainable instead of mysterious.
  repeated ResolvedOperator operators = 1;
}

message PlayerPage {
  repeated Player players = 1;
  string next_page_token = 2; // empty when no more pages
}

// ── W9 / spec 035 — the contact lookup pair (ADR 0044 §4) ──
message LookupPlayerByContactRequest {
  // The CONVERSATION's own brand: a match on another brand is another human being (the 07-29
  // Person repair), so the lookup is brand-scoped and a cross-brand hit answers `matched = false`
  // rather than leaking presence elsewhere. The account rides the caller's metadata, never a field.
  string brand_id = 1;
  string kind = 2;  // 'email' | 'phone' — ContactMatch's closed vocabulary; anything else refused
  string value = 3; // raw; normalised + salted-hashed inside, never stored, never echoed back
}

message ContactLookupResult {
  bool matched = 1;
  // Two records share the hash within this brand — the result names NOBODY (0044 §4: the response
  // is enough to confirm a match, never a results grid to browse).
  bool ambiguous = 2;
  string player_id = 3; // set only when matched
  string brand_id = 4;  // echoes the searched brand — the attach must carry the PAIR
  // The salted hash the attempt was audited under — returned so the CALLING service (chats) can
  // write its conversation-side transition with the SAME correlatable token. Non-reversible; the
  // raw value still travels nowhere but the original request.
  string value_hash = 5;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Feature 016 — One Validated Upload Path (roadmap 4.9). ADDITIVE ONLY: a new service and new
// messages; nothing above is renumbered, renamed or removed (`buf breaking` stays clean).
//
// NOT a separate .proto file, deliberately: feature 015 created crm/audit/v1/audit.proto because
// THREE services implemented the same messages. Here one service implements and the others are
// clients, so a shared file would buy nothing and cost an import (research R12).
// ═══════════════════════════════════════════════════════════════════════════════════════════════

// UploadsService — the ONLY surface in the product through which bytes enter or leave (FR-001).
//
// Owned by `users` (research R1). `users` is the only service holding object-store credentials, so
// "stored files are unreachable without the product's authorization" (FR-021/SC-010) is a property
// of the deployment rather than a claim in a document.
//
// Unary, not streaming (research R2): the caps are 10 MB (attachment) and 2 MB (avatar), and the
// risk in this feature belongs in validation and ownership, not in transport plumbing. The
// header/bytes split below is already stream-compatible, so growing past the caps is a migration,
// not a redesign. gRPC message limits are raised to 12 MB on this path only.
//
// Caller context rides in METADATA as everywhere else (x-actor-account-id / -user-id /
// -permissions / x-is-preview), never in a message body.
service UploadsService {
  // Validate and store. Refuses unless: the purpose exists, the caller holds its permission, the
  // size is within its cap, and the file's ACTUAL CONTENT is on its allow-list. For image purposes
  // the decode must also succeed, and a derivative is produced from it.
  rpc CreateUpload(CreateUploadRequest) returns (Upload);

  // Serve bytes back. Authorization is evaluated HERE, at request time (FR-010) — a reference that
  // was once usable stops working the moment the requester's account or permissions change.
  rpc ReadUpload(ReadUploadRequest) returns (UploadContent);

  // A consumer claims uploads before writing the record that references them (research R8).
  // Refuses an upload from another account or one that does not exist — which is what makes a
  // cross-account attachment impossible (FR-015).
  rpc ClaimUploads(ClaimUploadsRequest) returns (ClaimUploadsResponse);

  // Metadata for rendering (name, type, size, whether a derivative exists). No bytes.
  rpc DescribeUploads(DescribeUploadsRequest) returns (DescribeUploadsResponse);

  // ── Deliberately ABSENT ────────────────────────────────────────────────────────────────────────
  // • No UpdateUpload / DeleteUpload. Nothing in v1 removes bytes; reclaiming abandoned uploads is
  //   a retention concern (ADR 0015) and its own feature — which must also decide what a `deletion`
  //   audit entry looks like for a file.
  // • No presigned-URL RPC. FR-010 requires authorization at request time; a signed URL grants
  //   access to whoever holds it for the length of its window, which is exactly the SEC-10
  //   leaked-link case.
  // • No "upload on behalf of" parameter. The uploader is the caller, from metadata, always.
}

enum UploadVariant {
  UPLOAD_VARIANT_UNSPECIFIED = 0;
  UPLOAD_VARIANT_ORIGINAL = 1;
  UPLOAD_VARIANT_DERIVATIVE = 2; // absent for non-image purposes → NOT_FOUND, never a silent fallback
}

message CreateUploadRequest {
  // From the closed catalogue (libs/common/src/uploads/purposes.ts). Unknown → INVALID_ARGUMENT.
  string purpose = 1;
  // What the client SAYS it is. Recorded nowhere: it is compared against the detected type and then
  // discarded. A stored declared-type would look authoritative to a future reader and is not.
  string declared_content_type = 2;
  // The client's filename. Used only to derive a sanitized display label — never the storage
  // identity (FR-008), and never logged (FR-020: a filename can itself be PII).
  string filename = 3;
  bytes content = 4;
}

message Upload {
  string id = 1;
  string purpose = 2;
  string content_type = 3; // VERIFIED from content — never the declared value
  int64 byte_size = 4;
  string display_name = 5;
  bool has_derivative = 6;
  string created_at = 7; // RFC3339
}

message ReadUploadRequest {
  string upload_id = 1;
  UploadVariant variant = 2;
}

message UploadContent {
  string content_type = 1; // the verified type; the gateway sends exactly this, with nosniff
  string display_name = 2; // sanitized, for Content-Disposition
  bool inline_safe = 3;    // true only for raster images → gateway may use `inline`; PDF is `attachment`
  bytes content = 4;
}

// Both id-list requests below are CAPPED at 50 ids and refuse above it. `repeated string` with no
// bound is an unbounded request on an authenticated path — a caller could pass ten thousand ids and
// turn one call into a scan (Principle VII / FR-023). The cap is enforced at both tiers.
message ClaimUploadsRequest {
  repeated string upload_ids = 1; // max 50
  // What is claiming them, e.g. "chats:message". Opaque provenance, never a joinable key — the
  // consumer's own table holds the real reference.
  string claimed_by = 2;
}

message ClaimUploadsResponse {
  // Echoed on success. A partial claim is not possible: any id that is unknown, already claimed by
  // something else, or in another account fails the whole call (FR-015 — validate before any write).
  repeated string upload_ids = 1;
}

message DescribeUploadsRequest {
  repeated string upload_ids = 1; // max 50 — see the note above ClaimUploadsRequest
}

message DescribeUploadsResponse {
  // Only uploads in the caller's account. An id from another account is simply absent — the
  // response never distinguishes "not yours" from "does not exist" (FR-011).
  repeated Upload uploads = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// UsersMaintenanceService — the ONE place stored bytes are removed (feature 017, research R8)
//
// A separate service, deliberately NOT part of `UploadsService`: it is not a requester-facing verb.
// The gateway exposes NO route to it, and the handler refuses any caller without `x-actor-kind: system`.
// Modelled on chats.ChatsMaintenanceService, which feature 014 introduced for the same shape.
//
// ⚠️ This SUPERSEDES feature 016's "nothing in v1 removes bytes" for ONE purpose class, and the
// property that replaces it is NARROWER, not weaker:
//   • only purposes declared `ephemeral: true` are selectable — no `ingested` purpose may be
//     ephemeral, so an avatar or an attachment is structurally unreachable from here;
//   • only a system actor may call it, and there is no route;
//   • there is still NO UpdateUpload / DeleteUpload / PresignUpload / SignUpload on the uploads
//     surface — a user-facing delete does not exist.
// An artefact whose defining property is that it EXPIRES cannot honour "nothing removes bytes", and a
// flag that says "expired" while the bytes sit in a bucket is SEC-27 rather than a fix for it.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service UsersMaintenanceService {
  // ── ⭐ W31 / feature 038 (ADR 0043 §3): the operator half of deactivation ────────────────────────
  //
  // `Operator.active` has been read since feature 018 — the assignable list, the routing pool and
  // the participant resolver all honour it — and until now NOTHING WROTE IT. This is the writer.
  //
  // Here, on the maintenance service, for this service's three standing reasons: system actor only,
  // no gateway route, counts (here: an ack) rather than records. A route any session could call
  // would let one colleague switch another off without holding the key that governs exactly that —
  // the same argument feature 025 recorded for lowering somebody's presence.
  //
  // ⚠️ Reactivation uses the same rpc with `active = true`: one writer, two directions, so «who can
  // turn a person back on» has one answer rather than a second path nobody audited.
  rpc SetOperatorActive(SetOperatorActiveRequest) returns (SetOperatorActiveResult);

  /**
   * ⭐ W32 (roadmap 3.16, ADR 0043 §4) — move a departing colleague's PORTFOLIO to a named successor.
   *
   * ⚠️ Per player this is CLOSE the current period and OPEN a new one, in ONE transaction — and that
   * is forced by the database, not chosen for tidiness: the partial unique index permits only one open
   * period per player, so the new one cannot exist beside the old. Two separate transactions would
   * leave a window where the player belongs to nobody, and a crash inside it would make that permanent.
   *
   * Idempotent by predicate: a moved player no longer matches «theirs and still open», so a
   * half-finished pass simply resumes. Counts out — never a player id: this answer travels to a log.
   */
  rpc ReassignPortfolio(ReassignPortfolioRequest) returns (ReassignPortfolioResult);

  // Delete the bytes of ephemeral artefacts past their expiry, then their rows. Idempotent by
  // predicate: a purged row leaves the predicate because the row is gone. Counts only in the response.
  rpc PurgeExpiredArtefacts(MaintenanceBatchRequest) returns (PurgeResult);

  // ── Feature 025 (roadmap 5.9). Lower the availability of operators whose session has gone quiet.
  //
  // Here rather than on the presence service, and for the three reasons this service exists at all:
  // it is SYSTEM-ACTOR ONLY, it has NO gateway route, and it answers in COUNTS. A sweep that any
  // session could invoke would be a way to put a colleague offline without holding the key that
  // governs exactly that (FR-022).
  //
  // Idempotent by predicate: a row the sweep has already lowered no longer matches the threshold it
  // was lowered for, so a second tick with no activity in between writes nothing.
  rpc SweepIdlePresence(MaintenanceBatchRequest) returns (SweepPresenceResult);

  // ── ⭐ Feature 031 (roadmap 4.20). Who at this desk can take pushed work — asked by a MACHINE.
  //
  // Same question as `UsersReadService.ListOperatorsByAuthUsers`, same repository method, and
  // deliberately a SECOND surface rather than a relaxation of the first.
  //
  // ⚠️ That rpc is gated on `crm.conversation.assign` and its comment states the rule: *"the caller
  // forwards its own credentials unchanged; calling as a system actor would launder the permission."*
  // The backlog drain has no credentials to forward — a tick belongs to no person — so it must not be
  // able to reach the human surface at all. Instead it asks here, where the gate is the actor KIND
  // that no breadth of permission satisfies, exactly as the purge and the presence sweep above.
  //
  // The ACCOUNT is in the request because a machine has none of its own; the handler refuses an absent
  // one rather than defaulting. Staffing facts only — no customer data exists in this answer to mask.
  rpc ResolveRoutingOperators(ResolveRoutingOperatorsRequest) returns (ListOperatorsByAuthUsersResponse);

  // ── ⭐ Feature 033 (roadmap 6.1/6.4) — the envelope, and who wrote ────────────────────────────────
  //
  // Both live on the MAINTENANCE service for the reason its header states: system actor only, no gateway
  // route, and a caller that is a machine with no credentials to forward. Intake is not a person, and a
  // tick is not a person.
  //
  // ⚠️ **`ResolveChannelParticipant` takes the VALUE and returns a HANDLE.** The hash salt
  // (`CONTACT_HASH_SALT`) lives in this service and does not travel: copying it into chats so chats could
  // hash locally would put a secret in a second service purely to avoid one in-cluster hop of a value this
  // service already owns. Sending the value to its owner is strictly better than distributing the key that
  // protects it. The value is never logged on either side.
  rpc ResolveChannelParticipant(ResolveChannelParticipantRequest) returns (ChannelParticipant);

  // ⚠️ **THE ONE RPC IN THE PRODUCT THAT RETURNS AN UNMASKED CONTACT VALUE.** Its terms, all firm:
  // callable only by the outbound delivery path, reachable from no gateway route, never logged, and
  // account-scoped like everything else. It exists because replying to an email needs the address the
  // customer wrote FROM — which a hash cannot give and the player's registered address must not, since
  // they may differ and answering the wrong one sends a stranger's conversation to them.
  rpc GetChannelEnvelope(GetChannelEnvelopeRequest) returns (ChannelEnvelope);

  // ── ⭐ W17 (subpoint 4.6) — the opaque handle for WRITING FIRST ────────────────────────────────
  // "Write to my player" needs somewhere to send, and the product's only real address source today is
  // a ChannelParticipant this player has already written from (GR8 sync 5.4 does not exist; the Player
  // row carries no address by design). This answers with the OPAQUE participant id — never the address,
  // which continues to leave this service only through GetChannelEnvelope on the delivery path — and
  // `""` when the product knows no address for this player, which the screen renders as a labelled
  // absence rather than a broken button. Same fencing as its siblings: system actor, no gateway route.
  rpc GetPlayerEmailParticipant(GetPlayerEmailParticipantRequest) returns (PlayerEmailParticipant);
}

// W17 — which (brand, player) pair. The PAIR, as everywhere since ADR 0038 §3: a bare platform id
// names two different human beings under two brands.
message GetPlayerEmailParticipantRequest {
  string account_id = 1;
  string brand_id = 2;
  string player_id = 3;
}

message PlayerEmailParticipant {
  string participant_id = 1; // "" = no address known for this player yet
}

// Feature 033 — resolve who wrote, and remember where to answer, in one call.
//
// One rpc for two jobs on purpose: intake performs both at the same moment and for the same message, and
// two calls would let the envelope be recorded for a thread whose identity lookup failed, or the reverse.
message ResolveChannelParticipantRequest {
  string account_id = 1;            // required: the system caller has no account of its own
  string brand_id = 2;              // identity is BRAND-SCOPED (ADR 0038) — the same address under two
                                    // brands is two people until a Person link says otherwise
  string channel_kind = 3;          // `api | email | messenger`
  // The identifier CLASS, stated separately from the value because the class is what may be RECORDED and
  // the value is not (ADR 0044 §4). A caller that sent only a string would force this service to guess
  // which kind it was looking at, and a guess about identity is how a phone gets matched to email hashes.
  string kind = 4;                  // `email | phone | player_id`
  string value = 5;                 // ⚠️ hashed HERE; never logged, never returned, never stored in chats
}

message ChannelParticipant {
  string participant_id = 1;        // the opaque handle chats stores on the conversation
  string player_id = 2;             // empty = UNIDENTIFIED (FR-022/FR-023) — intake still succeeds
  // More than one candidate matched. The ticket is left unidentified rather than attached to either: a
  // wrong attachment puts one customer's words on another customer's record, and anything written while
  // it was wrong stays where it was written (ADR 0044 §5).
  bool ambiguous = 3;
}

message GetChannelEnvelopeRequest {
  string account_id = 1;
  string participant_id = 2;
}

message ChannelEnvelope {
  string address = 1;               // ⚠️ unmasked. See the rpc's terms above before adding a caller.
}

message ResolveRoutingOperatorsRequest {
  string account_id = 1;            // required: the system caller has no account of its own
  repeated string auth_user_ids = 2;
}

message SweepPresenceResult {
  int32 to_away = 1;
  int32 to_offline = 2;
  int32 failed = 3;
}

message MaintenanceBatchRequest {
  int32 limit = 1;                  // server-capped
}

message PurgeResult {
  int32 purged = 1;                 // object AND row both gone
  int32 object_missing = 2;         // object already absent, row removed anyway — NORMAL, not an error
  int32 failed = 3;                 // storage refused; the row stays and the next tick retries
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Feature 021 (roadmap 5.6, ADR 0035 §7) — the OPERATOR's own appearance settings.
//
// ⚠️ NOT `Player.preferences_json` (field 8 above). That field is the CUSTOMER's preferences — VIP
// portfolio data about a real human being, tier `am_only`, masked from most roles. THIS service
// carries an employee's theme and font size: cosmetic, self-owned, readable by nobody else.
//
// Two completely different things, and they are named apart on purpose: a search for
// `preferences_json` must never return this service, and a search for `UiPreference` must never
// return the customer's field. That is the roadmap-4.15 failure shape — "custom attributes" existed
// on `Player` while the requirement meant `Conversation`, and the name being taken is what made
// everyone assume the thing was built.
//
// A SEPARATE service rather than two rpcs on `UsersReadService`: a write on a service named *Read*
// is a lie in the contract, and this product has twice paid for names that stopped matching their
// contents. New service, EXISTING package — additive, so `buf breaking` stays clean, and no new
// hosting entry is needed. "No new entry needed" is precisely the assumption feature 015 got wrong
// live, so `hosting.spec.ts` asserts all four links rather than reasoning about them.
//
// NO PERMISSION gates these operations and none is created for them. ADR 0035's hard boundary:
// hiding something through a preference is not a restriction, and revealing something through a
// preference cannot grant access. The metadata read is `x-actor-account-id`, `x-actor-user-id` and
// `x-is-preview` — deliberately NOT `x-actor-permissions` (nothing to check) and NOT
// `x-actor-effective-role` (nothing here is masked, and reading a role would be the first step
// toward a preference that depends on one).
//
// NOT AUDITED, by decision (0019/SEC-29 records sensitive actions; a theme toggle is not one, and
// ~58 agents toggling several times a day would bury the entries that matter).
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service OperatorUiPreferencesService {
  rpc GetOperatorUiPreferences(GetOperatorUiPreferencesRequest) returns (OperatorUiPreferences);
  rpc UpdateOperatorUiPreferences(UpdateOperatorUiPreferencesRequest) returns (OperatorUiPreferences);
}

// Deliberately EMPTY. The subject is the authenticated caller, taken from the actor metadata. Adding
// a subject field here would be adding the very parameter that makes reading someone else's settings
// possible — the isolation guarantee is the ABSENCE of it, not a check.
message GetOperatorUiPreferencesRequest {}

message UpdateOperatorUiPreferencesRequest {
  // The keys to change, and ONLY those. Keys not named keep their stored value, or their default if
  // none was stored. An empty map is REFUSED — an empty change is a caller defect, not a no-op to
  // absorb silently.
  //
  // A map rather than typed fields: a field per preference would put the catalogue in the contract,
  // so adding a key would need a regenerate and a coordinated deploy — the opposite of the additive
  // property the catalogue exists to have. The map's openness is closed on the other side, where
  // every key and value is validated against `libs/common/src/preferences`.
  map<string, string> values = 1;
}

message OperatorUiPreferences {
  // ALWAYS the complete catalogue: stored values where they exist, system defaults where they do not.
  // A caller never has to know a default, which is what keeps defaults from being copied into every
  // client and drifting — feature 017 found two vocabularies that had already diverged.
  //
  // No masking here and therefore no absent-vs-blank distinction to preserve: every key is present
  // with a real value, and an empty string is not a member of any key's allowed set.
  map<string, string> values = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Feature 025 — AGENT PRESENCE, FOR ROUTING ONLY (roadmap 5.9, ADR 0042 §7 / U4).
//
// ADDITIVE ONLY: a new service, new messages, new enums, and two new fields on `ResolvedOperator`.
// Nothing above is renumbered, renamed or removed, so `buf breaking` stays clean — the wall
// `CheckBrandAccess` hit in feature 020 and `PersonalizeGroup` hit in 024.
//
// ⚠️ THE LINE THIS CONTRACT MUST NOT CROSS. Analytics and WFM are deferred by the operator, twice.
// The line is drawn at EVENTS vs AGGREGATES: presence transitions are recorded from day one, and
// WFM later READS THAT STREAM. So there is deliberately no count-by-state, no "who was online when",
// no adherence and no occupancy anywhere in this contract — `tests/presence/no-aggregates.spec.ts`
// asserts it, because the roadmap requires the absence not be "added quietly".
//
// ⚠️ NO SESSION OR DEVICE IDENTIFIER APPEARS HERE, and none may be added. Presence is per PERSON.
// A session id is the first step onto the employee-surveillance question, which is separate and
// undecided; a heartbeat states that a session is alive, never what the person is looking at.
// ═══════════════════════════════════════════════════════════════════════════════════════════════

enum PresenceState {
  // Refused on input, never coerced. An unknown value mapped to a default WIDENS availability, and
  // the widening direction is the one that pushes live customers at absent agents — the same
  // fail-closed rule the REST edge applies in `services/gateway/src/chats/wire.ts`.
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENCE_STATE_ONLINE = 1;
  // Not available for a NEW PUSH; available for a transfer handed over by a human. This is the only
  // state where the two asks disagree, and it is the whole reason presence is a state and not a
  // label — a label carries one value and could not express a two-valued answer (FR-010).
  PRESENCE_STATE_TRANSFERS_ONLY = 2;
  PRESENCE_STATE_AWAY = 3;
  PRESENCE_STATE_OFFLINE = 4;
}

// WHY a state was set. Not decoration: it is the difference between "the system decided you were
// away" and "you told us you were away" — two facts a future WFM report must never merge — and it is
// what makes the monotonicity rule decidable (FR-016: a heartbeat may raise availability only from a
// state the sweep itself set).
enum PresenceCause {
  PRESENCE_CAUSE_UNSPECIFIED = 0;     // never set — the default a first heartbeat may raise from
  PRESENCE_CAUSE_MANUAL = 1;          // the person said so
  PRESENCE_CAUSE_AUTO_INACTIVITY = 2; // the sweep
  PRESENCE_CAUSE_ADMIN = 3;           // somebody else said so
}

// The two kinds of ask, as separate values rather than one boolean, because `transfers_only` answers
// them differently and a single `is_available` could not be correct for both.
enum AvailabilityAsk {
  AVAILABILITY_ASK_UNSPECIFIED = 0;
  AVAILABILITY_ASK_NEW_PUSH = 1;
  AVAILABILITY_ASK_HUMAN_TRANSFER = 2;
}

// One outcome per distinguishable answer. `UNCHANGED` is NOT a second `OK`: FR-015 makes the
// difference observable — one path writes exactly one history record and the other must write none —
// and collapsing them would make "exactly one event" untestable from outside, which is how it
// quietly becomes "usually one".
enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_OK = 1;
  PRESENCE_STATUS_UNCHANGED = 2;
  // Caller lacks `users.presence.manage`. Separate from NO_SUCH_OPERATOR for the reason feature 024
  // gave for GROUP_STATUS_ESCALATION: "you may not" and "there is nobody here" send an administrator
  // looking for different things. ⚠️ This never becomes a cross-account probe — a caller from another
  // account never gets a row back at all, so from outside the two are indistinguishable.
  PRESENCE_STATUS_FORBIDDEN = 3;
  PRESENCE_STATUS_NO_SUCH_OPERATOR = 4;
  PRESENCE_STATUS_UNKNOWN_LABEL = 5;
  PRESENCE_STATUS_NAME_TAKEN = 6;
}

message OperatorPresence {
  string auth_user_id = 1;
  PresenceState state = 2;
  PresenceCause last_cause = 3;
  string last_seen_at = 4;              // RFC3339; empty = never active
  string label_id = 5;                  // empty = nothing displayed
  repeated string blocked_channels = 6; // ONLY the switched-off ones
  // ⚠️ The staff account is not deactivated (roadmap 3.16). A SEPARATE FACT from presence, carried
  // separately on purpose: conflating them would make a person at lunch indistinguishable from a
  // person who left the company, and this is the exact query where the two meet (FR-034).
  bool operator_active = 7;
}

message GetOperatorPresenceRequest {
  // Empty = the calling operator's own presence, which needs no permission. Naming somebody else
  // requires `users.list.view` — the same fact class as seeing the staff list at all.
  string auth_user_id = 1;
}

message ListOperatorPresenceRequest {
  repeated string auth_user_ids = 1;
}

message OperatorPresenceList {
  // An operator with no presence row is returned as OFFLINE; an auth id with no operator PROFILE is
  // simply ABSENT. Different answers to different questions, and not merged: the first is somebody
  // who has not started work, the second is not a member of staff.
  repeated OperatorPresence presence = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// OperatorPresenceService — the WRITES.
//
// A separate service from `UsersReadService` because a write on a service named *Read* is a lie in
// the contract, and a guard already enforces it. New service, EXISTING package — additive, and no
// new hosting entry is needed. "No new entry needed" is precisely what feature 015 got wrong live,
// so `hosting.spec.ts` asserts the links rather than reasoning about them.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service OperatorPresenceService {
  // Own presence. NO permission key: a statement about oneself is history, not a sensitive action,
  // so it writes a transition and NO audit entry (FR-021).
  rpc SetOwnPresence(SetOwnPresenceRequest) returns (SetPresenceResponse);

  // The activity signal. ⚠️ Presence is NOT inferred from ordinary authenticated traffic — a
  // background poll would keep a closed laptop "online" all night, rebuilding the very
  // untrustworthiness this feature exists to replace (FR-013).
  rpc Heartbeat(HeartbeatRequest) returns (SetPresenceResponse);

  rpc SetChannelAvailability(SetChannelAvailabilityRequest) returns (SetPresenceResponse);

  // Somebody ELSE's presence. Requires `users.presence.manage`, is AUDITED, and records
  // `PRESENCE_CAUSE_ADMIN`. The one presence act that is both a sensitive action and history.
  rpc SetOperatorPresence(SetOperatorPresenceRequest) returns (SetPresenceResponse);

  rpc ListPresenceLabels(ListPresenceLabelsRequest) returns (PresenceLabelList);
  rpc UpsertPresenceLabel(UpsertPresenceLabelRequest) returns (PresenceLabelResponse);
  rpc DeletePresenceLabel(DeletePresenceLabelRequest) returns (PresenceLabelResponse);
}

message SetOwnPresenceRequest {
  PresenceState state = 1;
  string label_id = 2; // empty clears the displayed label; it never changes the STATE
}

message HeartbeatRequest {}

message SetChannelAvailabilityRequest {
  string channel = 1;
  // false inserts the block, true removes it. There is no stored `true`: a row's EXISTENCE is the
  // block, which is what makes "a channel switch may only ever subtract" unrepresentable to violate
  // rather than merely forbidden (data-model, mirroring `GroupPermission`'s missing `granted`).
  bool available = 2;
}

message SetOperatorPresenceRequest {
  string auth_user_id = 1;
  PresenceState state = 2;
}

message SetPresenceResponse {
  PresenceStatus status = 1;
  // The state AFTER the call, so no caller has to re-read to find out what happened.
  OperatorPresence presence = 2;
}

// ── Labels: a display layer over availability, never an input to it ─────────────────────────────
//
// A TABLE and not a closed catalogue, for two reasons pointing the same way: ADR 0042 §7 requires
// administrators to edit the set, which a compile-time catalogue cannot allow; and every closed
// catalogue in this product is closed because a new member CHANGES BEHAVIOUR, while a new label must
// change none — proven by `tests/contracts/presence-label-never-branched-on.spec.ts`.

message PresenceLabel {
  string id = 1;
  string name = 2;         // operator-authored; no code branches on it
  PresenceState state = 3; // exactly one
}

message ListPresenceLabelsRequest {}

message PresenceLabelList {
  repeated PresenceLabel labels = 1;
}

message UpsertPresenceLabelRequest {
  string id = 1; // empty = create
  string name = 2;
  PresenceState state = 3;
}

message DeletePresenceLabelRequest {
  string id = 1;
}

message PresenceLabelResponse {
  PresenceStatus status = 1;
  PresenceLabel label = 2;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Feature 026 — PLAYER ↔ ACCOUNT-MANAGER ASSIGNMENT (roadmap 5.7, scope brief §4A / ADR 0032 §4).
//
// ADDITIVE ONLY: two read rpcs, one new service, new messages. Nothing renamed, so `buf breaking`
// stays clean.
//
// ⚠️ ATTACHMENT GRANTS ACCESS. Attaching a player to a manager hands that manager the player's
// portfolio, preferences and AM notes. This is not a "mine" marker; it is a grant of access to data
// about a real human being, and every field below is shaped by that.
//
// ⚠️ AND IT NARROWS SOMETHING ALREADY SHIPPED. Before this feature the `am_only` field tier was
// gated BY ROLE ALONE — any AM-role caller read every player's portfolio. From here, an AM sees the
// tier only for players they are attached to. The risk in this contract is therefore not "the new
// call fails" but "a call that worked yesterday returns less", which is the intent.
//
// ⚠️ IT IS NOT A GROUP (ADR 0039 §10). Attachment is per-player and deliberately narrower than
// membership of a unit; expressing it as a group would widen a manager's reach from "my portfolio"
// to "every VIP" — the exact opposite of the point.
// ═══════════════════════════════════════════════════════════════════════════════════════════════

message PlayerAssignment {
  // A player is (account, brand, player_id) since feature 020. A bare platform id names two people:
  // the same value under two brands is routinely two different human beings.
  string brand_id = 1;
  string player_id = 2;
  // ⚠️ The AUTH identity, NOT the operator profile id (research R1). The narrowing asks "is the
  // CALLER attached to this player?" on every masked read, and the caller is an auth identity —
  // storing anything else would put a translation on the hottest read path in the product. The
  // operator profile is still VALIDATED at write time; it is simply not the key.
  string am_auth_user_id = 3;
  // WHO DECIDED, which is not the same as who looks after the player. Self-assignment makes the two
  // equal most of the time, and that is precisely why they are separate fields: the abnormal-volume
  // signal is computed from THIS one, and it matters most in the case where they ARE equal.
  string assigned_by = 4;
  string started_at = 5; // RFC3339
  string ended_at = 6;   // empty = ACTIVE. A closed period is never deleted.
}

message GetPlayerAssignmentRequest {
  string brand_id = 1;
  string player_id = 2;
}

message ListAssignedPlayersRequest {
  // Empty = the CALLING manager's own portfolio. Naming somebody else requires `users.list.view` —
  // "show me another manager's book of business" is a supervisory question, not a self-service one.
  string am_auth_user_id = 1;
  int32 page_size = 2;   // clamped server-side
  string page_token = 3; // opaque cursor, never an offset (Principle VII)
}

message AssignedPlayerPage {
  repeated PlayerAssignment assignments = 1;
  string next_page_token = 2; // empty when no more pages
}

// One value per distinguishable outcome. Collapsing any two of these into a flat refusal sends an
// administrator hunting in the wrong place.
enum AssignmentStatus {
  ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  ASSIGNMENT_STATUS_OK = 1;
  // The act changed nothing: already attached to that manager, or already unattached. ZERO audit
  // entries. A distinct value because the difference must be observable from outside — otherwise
  // "exactly one entry per change" quietly becomes "usually one".
  ASSIGNMENT_STATUS_UNCHANGED = 2;
  ASSIGNMENT_STATUS_FORBIDDEN = 3;
  ASSIGNMENT_STATUS_NO_SUCH_PLAYER = 4;
  // The named manager has no ACTIVE operator profile. Separate from NO_SUCH_PLAYER: an attachment to
  // somebody who has left the company would be a portfolio nobody is looking after, while the record
  // claims otherwise.
  ASSIGNMENT_STATUS_NO_SUCH_MANAGER = 5;
  // ⭐ Already attached to SOMEBODY ELSE. Refused rather than silently replacing — the 🅿 one-active-
  // manager constraint is only visible if breaking it says so. A caller who means to move the player
  // unassigns first, deliberately.
  ASSIGNMENT_STATUS_ALREADY_ASSIGNED = 6;
}

message AssignPlayerRequest {
  string brand_id = 1;
  string player_id = 2;
  // Empty = attach to MYSELF. Self-assignment is a requirement rather than a tolerated case, and an
  // empty field is the shape that makes the common act the easy one.
  string am_auth_user_id = 3;
}

message UnassignPlayerRequest {
  string brand_id = 1;
  string player_id = 2;
}

message AssignmentResponse {
  AssignmentStatus status = 1;
  PlayerAssignment assignment = 2; // the state AFTER the call
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// PlayerAssignmentService — the WRITES.
//
// A separate service from `UsersReadService` because a write on a service named *Read* is a lie in
// the contract, and a guard enforces it. Third time this package gains a new service (021, 025);
// "no new hosting entry is needed" is true and is exactly the kind of true statement that stops
// anybody checking the other three links, so `hosting.spec.ts` asserts them.
//
// ⚠️ NO `TransferPlayer` VERB, deliberately. A move is unassign + assign: two acts, two audit
// entries. One combined verb would be a single entry describing two facts — and Q3.1 (who may take
// a player away from a manager) is still open, so a combined verb would bake in an answer nobody
// has given.
//
// ⚠️ NO BULK ASSIGN, deliberately. Attaching many players quickly IS the harvesting pattern the
// audit exists to detect; shipping a verb that does it in one call would be building the vector and
// the detector in the same feature.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service PlayerAssignmentService {
  rpc AssignPlayer(AssignPlayerRequest) returns (AssignmentResponse);
  rpc UnassignPlayer(UnassignPlayerRequest) returns (AssignmentResponse);
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// OperatorProfileService — THE JOIN NOBODY OWNED (roadmap 5.10, MVP block W1).
//
// Registration writes `User` + `Credential` + `UserRole` into `auth_db` and stops. An `Operator` row
// in `users_db` is what makes a person assignable — and **nothing in the product ever created one**,
// only the seed. So `AssignPlayer` answered `no such manager` for a manager who plainly existed, and
// every real person who joined by invite was unassignable while every seeded one worked.
//
// ⭐ **THE SUBJECT IS THE CALLER AND CANNOT BE A PARAMETER.** There is deliberately no
// `auth_user_id` field: the account and the identity come from the validated caller context
// (`x-actor-account-id` / `x-actor-user-id`), so this rpc can mint a profile for **exactly one
// person — whoever is calling**. That is what makes it safe to reach from the registration path,
// which is `@Public` by necessity: a leaked call can create at most the caller's own profile, and a
// profile grants nothing on its own (every access decision is still auth's roles + permissions).
// It is also the shape roadmap 5.11 requires, so that point inherits this surface rather than
// inventing a second one.
//
// ⚠️ **Idempotent by contract, not by luck.** Called after registration AND after every login, so a
// person who registered before this shipped is repaired on their next sign-in — the "named path"
// 5.10 asked for, instead of a hand-written INSERT. The upsert keys on
// `(account_id, auth_user_id)`, which is a UNIQUE constraint added with this rpc; without it two
// concurrent calls would produce two profiles for one human being, which is the duplicate-staff
// hazard 3.16 spends a paragraph on.
//
// ⚠️ **`EveryUserGetsOne` is the decided answer to 5.10's open question.** The alternative — create
// the profile when a role that can hold work is granted — is narrower and matches the name better,
// but it makes a ROLE CHANGE have a side effect in another service's database. A profile is inert;
// a cross-service side effect on a permission edit is not.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service OperatorProfileService {
  rpc EnsureOwnOperator(EnsureOwnOperatorRequest) returns (Operator);

  // ── ⭐ W19 (subpoint 5.4, roadmap 8.10) — set MY avatar ─────────────────────────────────────────
  // The subject is the caller, like its sibling above — there is deliberately no field to name
  // anyone else. The upload must already exist in the caller's account, carry the `avatar` purpose,
  // and have been uploaded BY the caller (your face is yours to set; an administrator changing
  // somebody's photo is not a capability this product has). Setting claims the upload (a claimed
  // row is out of any future pending-reclaim's reach) and replaces the previous reference — the old
  // upload row stays, retention (ADR 0015) owns collecting it. The display NAME remains immutable
  // by decision (2026-07-26): identity is the account, not a label.
  rpc SetMyAvatar(SetMyAvatarRequest) returns (Operator);
}

message SetMyAvatarRequest {
  string upload_id = 1;
}

// Deliberately EMPTY, and the emptiness is the design.
//
// ① The subject is the caller (see the service comment), so there is no identity to carry.
// ② A `display_name` field was drafted here and REMOVED before shipping: the only caller — the
//    gateway, on the registration and login tails — has no name to put in it. The authoritative
//    display name is `auth.User.display_name`, collected at registration; copying it into `users`
//    would create a second copy of the same fact for the two to drift apart, and passing the field
//    empty forever would make it an inert parameter — the exact shape of `x-actor-role`, an input
//    read by nothing that survived four phases because it looked purposeful.
//
// A name arrives here only when something actually knows one: HR-driven provisioning (roadmap 3.15)
// supplies one, and it can add a field then, additively, with a populated caller on day one.
message EnsureOwnOperatorRequest {}

// ── ⭐ W31 / feature 038: the operator lifecycle write ───────────────────────────────────────────
message SetOperatorActiveResult {
  // false when the flag already held that value — a repeated offboarding is a no-op (ADR 0043 §3),
  // and the caller must be able to tell «changed» from «was already so» without a second read.
  bool changed = 1;
  // ⭐ The operator row this auth user maps to — the id CHATS knows an assignee by.
  //
  // ⚠️ It is answered here because this service owns the mapping and has just done the lookup. The
  // offboarding sweep must name the departed person to two services that use two different id
  // spaces: auth answers a user id, `Conversation.assignee_operator_id` is a `users.Operator.id`.
  // Without this field the sweep would have to ask a second rpc for a row this one already read —
  // or, far worse, pass the auth id to chats, where it would match nothing and report a clean
  // «no open work» for somebody holding all of it. That is SEC-PV2's exact shape.
  string operator_id = 2;
}

message SetOperatorActiveRequest {
  // The AUTH user id — the id auth holds and the only one it can name. Users resolves its own
  // operator row from it, exactly as the profile path does.
  string auth_user_id = 1;
  bool active = 2;
}

message ReassignPortfolioRequest {
  // A machine has no account of its own; the row carries it, like every other maintenance call here.
  string account_id = 1;
  // Both are AUTH user ids — the id space `PlayerAssignment.am_auth_user_id` holds. No translation
  // happens in this service, deliberately: the one place auth ids become operator ids is the worker.
  string from_auth_user_id = 2;
  string to_auth_user_id = 3;
  int32 limit = 4; // server-clamped, like every maintenance batch
}

message ReassignPortfolioResult {
  int32 moved = 1;
  // Stopped being the departing person's between the read and the write — a human reassigned them, or
  // an earlier pass already moved them. Counted as neither moved nor failed: claiming a move we did
  // not make would inflate the report an administrator reads.
  int32 skipped = 2;
  int32 remaining = 3;
}


// ═══════════════════════════════════════════════════════════════════════════════════════════════
// ⭐ PlayerNotesService — WHAT SOMEBODY WROTE about a customer (W35 / feature 040, R35 · U17).
//
// ADDITIVE ONLY: a new service, two rpcs, new messages. Nothing renamed, so `buf breaking` stays clean.
//
// ⚠️ **THERE IS NO Update AND NO Delete, AND THE ABSENCE IS THE CONTRACT.** Q20 settled editability with
// a scenario rather than a preference: if a note can be changed, then *«вписал, показал кому надо, стёр,
// и в системе чисто»* — the note becomes a way to show somebody something and then make it never have
// happened. Append-only removes the move instead of policing it. A correction is a new note, and this
// service surface is what makes that structural rather than a convention: there is no verb to call.
//
// ⚠️ **A note is a MASKING-BYPASS CHANNEL, which is why this exists as its own contract** (R35). The
// customer's phone is withheld from `Player` by tier; nothing stops an author typing it into free text
// one line below. So `AddPlayerNote` runs the contact-shape detector, and `ADD_NOTE_OUTCOME_NEEDS_ACK`
// is the answer that carries the warning back to its author.
//
// ⚠️ **`NEEDS_ACK` stores NOTHING and is not a refusal.** U17 rejected a hard block, because *«телефон:
// восемь девять два…»* defeats one in two seconds and moves the behaviour where no detector can see it.
// The same request with `acknowledged = true` stores the note and writes ONE audit entry
// (`player.note_flagged`). No body is unstorable; what changes is that the trail records a deliberate
// act instead of a system noticing afterwards.
//
// ⚠️ **The reads are NOT on `UsersReadService`, and the writes could not be**: a write on a service named
// *Read* is a lie in the contract (`tests/users-read/no-outbound.spec.ts` enforces it). New service,
// EXISTING package, so no new hosting entry is needed — a claim `hosting.spec.ts` verifies.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service PlayerNotesService {
  rpc ListPlayerNotes(ListPlayerNotesRequest) returns (PlayerNotePage);
  rpc AddPlayerNote(AddPlayerNoteRequest) returns (AddPlayerNoteResult);
}

message ListPlayerNotesRequest {
  // ⚠️ BOTH are required. A bare platform id names two customers — the same value under two brands is
  // routinely two different human beings (feature 020), so there is no correct record to answer with,
  // only a lucky one.
  string brand_id = 1;
  string player_id = 2;
}

message PlayerNote {
  string id = 1;
  // The prose itself. Tier-equivalent to `am_only` — served only to a caller cleared for this record,
  // and the service refuses rather than returning an empty page to anyone else.
  string body = 2;
  // WHO WROTE IT: the AUTH user id. The stable fact, and what the screen falls back to when no profile
  // resolves a name.
  string author_ref = 3;
  // ⚠️ Resolved WITHOUT the `active` filter, deliberately: a note written by somebody who has since left
  // must still name them. W32 hands the portfolio over exactly when somebody leaves, and their notes are
  // what the successor inherits — an unattributed one invites the reader to mistake it for their own
  // conclusion, which is the failure the operator's «подписана автором и датой» exists to prevent.
  // EMPTY when no operator row resolves at all; the caller then shows `author_ref`.
  string author_display_name = 4;
  string created_at = 5; // RFC3339
  // What the author was warned about when they added it (`email` · `handle` · `phone`), if anything.
  // A record of what was SHOWN at the time — never recomputed, so a better detector later cannot
  // silently rewrite what somebody was told.
  repeated string pattern_kinds = 6;
}

message PlayerNotePage {
  repeated PlayerNote notes = 1; // newest first
}

message AddPlayerNoteRequest {
  string brand_id = 1;
  string player_id = 2;
  string body = 3;
  // "I saw the warning and mean to add it anyway."
  bool acknowledged = 4;
  // ⚠️ Idempotence keys off THIS and never off the body: two identical observations on different days
  // are two facts, and on an append-only store a silent no-op would be indistinguishable from a write
  // that vanished. A retried request is one row.
  string client_ref = 5;
}

enum AddNoteOutcome {
  // ⚠️ Not decoration. The gRPC wire drops zero values, so a client that receives no outcome reads
  // `UNSPECIFIED` and must treat it as a failure — never as "stored". `gotchas/grpc-wire-encoding` twice.
  ADD_NOTE_OUTCOME_UNSPECIFIED = 0;
  ADD_NOTE_OUTCOME_STORED = 1;
  // Nothing was stored. The kinds below say what was recognised.
  ADD_NOTE_OUTCOME_NEEDS_ACK = 2;
  ADD_NOTE_OUTCOME_EMPTY_BODY = 3;
  ADD_NOTE_OUTCOME_TOO_LONG = 4;
  ADD_NOTE_OUTCOME_NO_SUCH_PLAYER = 5;
}

message AddPlayerNoteResult {
  AddNoteOutcome outcome = 1;
  // Present on STORED — including an idempotent replay, where it is the FIRST row.
  PlayerNote note = 2;
  // Present on NEEDS_ACK.
  repeated string pattern_kinds = 3;
  // True when this call matched an earlier `client_ref` instead of writing. The caller can tell
  // "stored now" from "already stored" without comparing timestamps.
  bool replayed = 4;
}
