# Local development orchestration (spec 003-local-infra, US1).
#
# `docker compose up` brings up one Postgres engine (a DB + isolated role per data-owning
# service, created by deploy/local/postgres/init) and one Redis, then the six backend
# services. Only the gateway is exposed to the host (single ingress, US4). The Next.js web
# app runs via `npm run dev:web` (not containerised until Phase 8). Local dev only —
# production is Kubernetes (Phase 13). Secrets come from .env (git-ignored); there are NO
# defaults baked in (FR-005). See deploy/local/README.md for the port map.

name: crm

x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Per-service role passwords consumed by the init script (no hardcoded creds).
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
      CHATS_DB_PASSWORD: ${CHATS_DB_PASSWORD:?set CHATS_DB_PASSWORD in .env}
      BRANDS_DB_PASSWORD: ${BRANDS_DB_PASSWORD:?set BRANDS_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    # Optional host bind for a local DB client; comment out to keep Postgres internal-only.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Object store for uploaded bytes (feature 016, roadmap 4.9 — spec Q1 / research R6).
  # MinIO here and on beton-test; a managed private bucket in production — ONE client
  # (@aws-sdk/client-s3) for both, so Track B exercises the shape that actually ships.
  # ONLY the users service holds these credentials (research R2): the gateway proxies bytes
  # and gains no storage configuration at all, which is what makes "one validated path"
  # (FR-001) checkable rather than a convention.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - miniodata:/data
    # Host-bound to 127.0.0.1 so SC-010/SEC-39 can be asserted directly against the store
    # (Track B B4: an anonymous GET of an object URL must be denied).
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and assert it is PRIVATE. `mc anonymous set none` is
  # deliberate rather than relying on MinIO's default — SEC-39 is a posture we assert, not
  # one we inherit. No public read policy is set anywhere, ever.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        mc alias set store http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "store/$$S3_BUCKET" &&
        mc anonymous set none "store/$$S3_BUCKET" &&
        echo "bucket ready (private)"
    restart: 'no'

  gateway:
    <<: *service-base
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      REDIS_URL: redis://redis:6379
      AUTH_GRPC_TARGET: auth:50051
      USERS_GRPC_TARGET: users:50052
      CHATS_GRPC_TARGET: chats:50053
      BRANDS_GRPC_TARGET: brands:50054
      WORKER_GRPC_TARGET: worker:50055
      # Session edge (feature 009): the guard verifies the access JWT LOCALLY, so the gateway
      # needs the SAME secret the auth service signs with. `Secure` defaults ON; relax to off
      # (COOKIE_SECURE=false in .env) only for local plain-HTTP dev.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    # Single host-exposed ingress: REST + WebSocket on one port (US4 / FR-009).
    ports:
      - '${GATEWAY_PORT:-3000}:3000'

  auth:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/auth.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50051
      DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD:?}@postgres:5432/auth_db
      # Signs the short-lived access JWT; the gateway verifies it with the SAME secret (009).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Dev-only: path where the in-memory EmailPort also appends delivered login codes as JSON
      # so local/dev flows can read them without real SMTP. Empty (default) = off. Never in prod.
      LOGIN_CODE_DEV_SINK: ${LOGIN_CODE_DEV_SINK:-}

  users:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/users.Dockerfile }
    # Restated in full: a YAML merge key does not deep-merge `depends_on`, it replaces it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50052
      DATABASE_URL: postgresql://users_user:${USERS_DB_PASSWORD:?}@postgres:5432/users_db
      # Feature 016: the ONLY service holding object-store credentials (research R2/R10).
      # Its config guard is refuse-to-start, so a missing key is a boot failure, never a
      # runtime surprise. The gateway deliberately gains nothing here.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

  chats:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/chats.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50053
      DATABASE_URL: postgresql://chats_user:${CHATS_DB_PASSWORD:?}@postgres:5432/chats_db
      # Feature 014: an automation rule acts with its AUTHOR's current permissions, resolved from
      # auth on every evaluation (FR-023). Acyclic — auth never calls chats.
      AUTH_GRPC_TARGET: auth:50051
      # Feature 016: attachments are claimed and described over the users contract (research R8).
      # Acyclic — users never calls chats. Chats holds NO storage credentials: it references an
      # upload by id and never sees a byte.
      USERS_GRPC_TARGET: users:50052

  brands:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/brands.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50054
      DATABASE_URL: postgresql://brands_user:${BRANDS_DB_PASSWORD:?}@postgres:5432/brands_db

  worker:
    <<: *service-base
    build: { context: ., dockerfile: deploy/docker/worker.Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_URL: 0.0.0.0:50055
      REDIS_URL: redis://redis:6379
      # Feature 014: the worker's first real job (first-reply SLA sweep, roadmap 4.7). Scheduling
      # only — chats owns the data and the verdict (research R1/R2). Breach-detection latency is
      # bounded by the interval by design; override it to a few seconds on a test box so a breach is
      # observable in seconds instead of half a minute.
      CHATS_GRPC_TARGET: chats:50053
      SLA_SWEEP_INTERVAL_MS: ${SLA_SWEEP_INTERVAL_MS:-30000}
      SLA_SWEEP_BATCH: ${SLA_SWEEP_BATCH:-500}

volumes:
  pgdata:
  miniodata:
