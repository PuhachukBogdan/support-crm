// Chats core contract (roadmap 4.1–4.3, feature 012).
//
// The Chats service's own domain surface: conversations, messages, and the player feed.
// Cross-service data (operator/player/brand identity) is NOT modelled here — those cross via
// the users/brands contracts (Principle VIII), never a DB join. This file owns only chats_db shapes.
//
// Caller context rides in gRPC METADATA, not message fields (research R1) — keys
// `x-actor-user-id`, `x-actor-account-id`, `x-actor-role`, `x-actor-permissions` (comma-joined),
// `x-actor-brands` (comma-joined permitted brand ids, R3), `x-is-preview`. The service-tier guard
// re-checks the permission context independently so a call skipping the gateway is refused (SC-004).
//
// Pagination is keyset only (Principle VII / R7): opaque page_token (empty = first page) + page_size
// (server-capped at 100, default 50); responses return next_page_token (empty = no more). No offset,
// no totals. Additive-only: never renumber or reuse field numbers.
//
// Generated TS message types (git-ignored): libs/proto/gen/crm/chats/v1/chats.ts

syntax = "proto3";

package crm.chats.v1;

import "crm/audit/v1/audit.proto";

// Package-scoped enums → PREFIXED values; *_UNSPECIFIED = 0; wire value = NAME (enums:String).

// ⚠️ DEPRECATED by feature 032 (roadmap 4.16, ADR 0040). The flat vocabulary is not the model of
// record any more: a ticket's status is a per-account CONFIGURATION key (`status_key`) belonging to one
// closed CATEGORY (`ConversationStatusCategory` below).
//
// It stays declared because `buf breaking = FILE` forbids deleting it, and for no other reason. Every
// field of this type is NO LONGER POPULATED on reads and NOT ACCEPTED as a write or a filter — a
// request that carries only the old field is REFUSED. Mapping it instead would be lossy in the filter
// direction (`SNOOZED` would return every pending conversation), which is the confidently-wrong-answer
// shape feature 012 shipped once.
enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  CONVERSATION_STATUS_OPEN = 1;
  CONVERSATION_STATUS_PENDING = 2;
  CONVERSATION_STATUS_RESOLVED = 3;
  CONVERSATION_STATUS_SNOOZED = 4;
}

// ⭐ Feature 032 (roadmap 4.16, ADR 0040 §1) — the CLOSED, additive category catalogue. This is the
// only status vocabulary machine logic may branch on: the SLA pause (4.17), the terminal condition of
// the agent's rail (4.19), the "unsolved" scopes, the reporting buckets.
//
// Statuses themselves are configuration (`ConversationStatusDef`) and there are as many as the team's
// workflow actually has. Categories keep the machine's vocabulary at six while the humans get theirs.
// Canonical definition: `libs/common/src/statuses/categories.ts`.
enum ConversationStatusCategory {
  CONVERSATION_STATUS_CATEGORY_UNSPECIFIED = 0;
  CONVERSATION_STATUS_CATEGORY_NEW = 1;
  CONVERSATION_STATUS_CATEGORY_OPEN = 2;
  CONVERSATION_STATUS_CATEGORY_PENDING = 3;   // waiting on the CUSTOMER — the one 4.17 pauses for
  CONVERSATION_STATUS_CATEGORY_ON_HOLD = 4;   // waiting on US — deliberately NOT a pause (ADR 0041)
  CONVERSATION_STATUS_CATEGORY_SOLVED = 5;    // terminal, may reopen
  CONVERSATION_STATUS_CATEGORY_CLOSED = 6;    // terminal, archived; no seeded status yet (retention, SEC-25)
}

// One configured status of one account (feature 032). Read once by a screen and joined client-side —
// deliberately NOT denormalized onto every conversation row, which is the widest-fanout message here.
//
// TWO NAMES, both required (ADR 0040 §2). `In progress` means *escalated, being worked on* internally
// while the player is shown a neutral `Open`; with one name we either leak the internal workflow or
// lose the internal precision. ⚠️ `end_user_name` has NO CONSUMER UNTIL PHASE 6 (U10) — populated
// anyway, because dual naming cannot be retrofitted from data.
message ConversationStatusDef {
  string key = 1;                             // stable, per-account; what `status_key` carries
  ConversationStatusCategory category = 2;
  string agent_name = 3;
  string end_user_name = 4;
  bool active = 5;                            // inactive = not settable; existing rows keep it
  int32 order = 6;                            // display order within the account
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_PUBLIC_REPLY = 1;      // operator, not private
  MESSAGE_KIND_PRIVATE_NOTE = 2;      // operator, private — never in CUSTOMER projection (SEC-13)
  MESSAGE_KIND_INCOMING_CUSTOMER = 3; // player (normally channel-ingested, Phase 6)
  MESSAGE_KIND_SYSTEM = 4;            // system
}

enum ThreadProjection {
  THREAD_PROJECTION_UNSPECIFIED = 0;
  THREAD_PROJECTION_STAFF = 1;        // all kinds
  THREAD_PROJECTION_CUSTOMER = 2;     // public + incoming only; private notes excluded at query (R4)
}

// Feature 029 (roadmap 9.2): the order a conversation list arrives in.
//
// ⚠️ BOTH VALUES SORT ON `Conversation.updated_at`, which is what `last_activity_at` above already
// returns — there is no `last_activity_at` COLUMN. The rename is old and deliberate, but it is also
// what nearly made feature 029 sort on a field that does not exist (research R7): the decision that
// existed to catch requirements with no server behind them was itself written against this name.
//
// ⇒ The UI header for it reads "Updated", never "last activity": `updated_at` is a Prisma `@updatedAt`
// column, so OUR OWN relabelling, reassigning and resolving bump it. A queue sorted by it and labelled
// "last activity" reports our bookkeeping as customer contact — and looks right doing so.
//
// True customer contact is `last_inbound_at` (feature 022) — nullable and deliberately unindexed.
//
// ⭐ Feature 031 (roadmap 4.19/4.20) adds the URGENCY order this enum previously refused. The refusal read:
// "nothing computes urgency, and a sort asserting a property the data lacks is invisible to the person
// trusting it." A maintained rank now exists (`Conversation.priority_rank`), so the order says something
// true: highest priority first, longest wait first within a priority.
//
// ⚠️ It is NOT SLA proximity and NOT a model of anything, and the screen's label must stay inside that
// claim — the same discipline that made the other two options say "Updated" rather than "last activity".
enum ConversationOrder {
  CONVERSATION_ORDER_UNSPECIFIED = 0; // = UPDATED_DESC (the default), never "no order"
  CONVERSATION_ORDER_UPDATED_DESC = 1;
  CONVERSATION_ORDER_UPDATED_ASC = 2;
  CONVERSATION_ORDER_URGENCY_DESC = 3;
}

// Lean list item (no thread) — ListConversations / player feed.
message ConversationSummary {
  string id = 1;
  string brand_id = 2;
  string player_id = 3;               // "" when unlinked
  ConversationStatus status = 4;      // ⚠️ DEPRECATED (032) — no longer populated. See status_key below.
  string priority = 5;                // "" when unset
  string assignee_operator_id = 6;    // "" when unassigned
  string channel = 7;
  string last_activity_at = 8;        // ISO-8601 (updated_at)
  string created_at = 9;
  // Feature 023 (roadmap 4.18) — additive, and this is the field the feature EXISTS for: their current
  // lists read as "привет", "???" and mid-word fragments because the subject is the first message taken
  // literally. `subject_source` is deliberately NOT here — a list does not need to know how a title was
  // set, and the summary is the widest-fanout message in the product.
  string subject = 10;
  // ⭐ Feature 032 — the status, in the model of record. Both travel: the KEY is what a filter and a
  // write name, the CATEGORY is what the list may branch on (a badge colour, a group header) without
  // fetching the catalogue. The names live in `ConversationStatusDef`, fetched once per screen.
  string status_key = 11;
  ConversationStatusCategory status_category = 12;
}

// Full conversation detail (metadata; thread via GetThread).
message Conversation {
  string id = 1;
  string brand_id = 2;
  string player_id = 3;
  ConversationStatus status = 4;      // ⚠️ DEPRECATED (032) — no longer populated. See status_key below.
  string priority = 5;
  string assignee_operator_id = 6;
  string channel = 7;
  string reference = 8;
  // Reserved classification (ADR 0027) — surfaced read-only, populated by later features:
  string category = 9;
  string sub_category = 10;
  string classified_by = 11;
  string created_at = 12;
  string updated_at = 13;
  // Feature 014 (roadmap 4.7) — additive. The first-reply measurement rides on the detail so the UI
  // needs no second call. Absent when no clock ever started (no SLA policy applied).
  FirstReplySlaState first_reply_sla = 14;
  // Feature 023 (roadmap 4.18) — additive. The human-readable title, derived from the customer's own
  // first substantive words and then FROZEN; `subject_source` is `auto` | `manual` | "" (window still
  // open). Both may legitimately be empty, and proto3 omits defaults — here "unset" and "empty" are
  // the SAME fact for a reader, unlike the masking case of feature 019 where the distinction was
  // load-bearing. Do NOT make these `optional`: it would add nothing and would trip `buf breaking`
  // on a cardinality change.
  string subject = 15;
  string subject_source = 16;
  // Feature 024 (roadmap 5.3): the GROUP this conversation was routed to. A soft ref to
  // `auth.Group.id`, empty when it was not routed through a desk. It is the fact an automation's
  // group scope matches on, and the reason a dangling scope fails closed rather than open.
  string routed_group_id = 17;
  // ⭐ Feature 032 (roadmap 4.16) — the status in the model of record, same pair as on the summary.
  string status_key = 18;
  ConversationStatusCategory status_category = 19;
}

// Feature 016 (roadmap 4.9) — rendering metadata for a file attached to a message. The bytes are
// served by the uploads path (users), never inlined here. `upload_id` is a soft ref across a
// database boundary; the values beside it are fetched from users per thread page, deliberately NOT
// denormalized into chats_db — that keeps the PII-capable display_name in exactly one database.
message Attachment {
  string upload_id = 1;
  string content_type = 2;            // the VERIFIED type
  int64 byte_size = 3;
  string display_name = 4;            // sanitized; may be "" when the client sent nothing usable
  bool has_derivative = 5;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  MessageKind kind = 3;               // derived (R5)
  string author_id = 4;               // "" for system
  string body = 5;
  repeated string mentions = 6;       // operator-id soft refs; only on PRIVATE_NOTE; resolution deferred (R6)
  string created_at = 7;
  // Feature 016 — additive. ABSENT from the CUSTOMER projection for a private note, because the
  // note itself is excluded at query level (SEC-13) and attachments load THROUGH the message.
  // Nothing fetches attachments by a separate query; SC-008 asserts the ids are absent too, not
  // merely the bytes — the 012 lesson was that the id and the mentions leaked alongside the body.
  repeated Attachment attachments = 8;
}

service ChatsReadService {
  rpc ListConversations(ListConversationsRequest) returns (ConversationPage);
  rpc GetConversation(GetConversationRequest) returns (Conversation);
  rpc GetThread(GetThreadRequest) returns (MessagePage);
  rpc GetPlayerFeed(GetPlayerFeedRequest) returns (ConversationPage); // ONE brand's player (feature 020)
  // ── Feature 020 — additive. The cross-brand view, for a HUMAN established from a matching email or
  // phone. Kept separate from the call above on purpose: see GetPersonFeedRequest.
  rpc GetPersonFeed(GetPersonFeedRequest) returns (ConversationPage);
  // ── Feature 013 (workflow, roadmap 4.4–4.5) — additive ──
  rpc ListConversationLabels(ConversationIdRequest) returns (LabelList);
  rpc ListLabels(Empty) returns (LabelList);
  rpc ListMacros(Empty) returns (MacroList);
  rpc ListCannedResponses(Empty) returns (CannedResponseList);
  // ── Feature 014 (automations + first-reply SLA, roadmap 4.6–4.7) — additive ──
  rpc ListAutomations(ListAutomationsRequest) returns (AutomationList);
  rpc ListAutomationRuns(ListAutomationRunsRequest) returns (AutomationRunList);
  rpc GetFirstReplySlaPolicies(Empty) returns (FirstReplySlaPolicyList);

  // ── Feature 015 (audit trail, roadmap 4.8) — additive. One RPC per source; the gateway fans out
  // and merges. Gated by `platform.audit.view` at BOTH tiers. No write/update/delete counterpart
  // exists anywhere — append-only means there is no mutation path to expose.
  rpc ListAuditEntries(crm.audit.v1.ListAuditEntriesRequest) returns (crm.audit.v1.AuditEntryPage);

  // ── Feature 022 (contact history + last contact, roadmap 4.13) — additive ──
  //
  // "When did we last talk to this customer, and on which channels?" — answered WITHOUT paging the
  // feed, because the feed answers a different question and its `last_activity_at` answers this one
  // WRONGLY: that value is `Conversation.updated_at`, which relabelling, reassigning or resolving
  // bumps. A card built on it reports our own internal work as customer contact, and looks right
  // doing it.
  //
  // Both are gated by `crm.inbox.view` at both tiers, like the feeds. The person-level call
  // ADDITIONALLY requires `crm.contact.view`, because answering it means asking `users` which records
  // are one human — a statement about a customer that the contact key gates. Calling `users` as a
  // system actor to avoid that would launder the key, so it is not done (spec FR-025).
  rpc GetPlayerContactSummary(GetPlayerContactSummaryRequest) returns (ContactSummary);
  rpc GetPersonContactSummary(GetPersonContactSummaryRequest) returns (ContactSummary);

  // ── Feature 032 (roadmap 4.16) — the account's configured statuses, in display order.
  //
  // One call per screen, joined client-side: that is what keeps the two NAMES off every conversation
  // row. Gated by `crm.inbox.view` at both tiers — reading the vocabulary the list is labelled with is
  // the same fact class as reading the list. Inactive statuses are returned too (`active = false`), or
  // a conversation still sitting in a retired status would render with no label at all.
  rpc ListConversationStatuses(Empty) returns (ConversationStatusList);
}

message ConversationStatusList {
  repeated ConversationStatusDef statuses = 1;
}

message ListConversationsRequest {
  // All filters optional; any combination (FR-002). *_UNSPECIFIED / "" = no filter on that dimension.
  ConversationStatus status = 1;      // ⚠️ DEPRECATED (032) — REFUSED, not mapped. Use status_key / status_category.
  string priority = 2;
  string assignee_operator_id = 3;
  string player_id = 4;
  string brand_id = 5;                // optional narrowing; result is always intersected with permitted brands (R3)
  string page_token = 6;
  int32 page_size = 7;                // server-capped (100 max, 50 default)
  // Feature 014 (R10): the breached list is a FILTER on the inbox, not a parallel endpoint — it
  // inherits keyset paging, the page cap, brand intersection and crm.inbox.view. Unknown value ⇒
  // 400 at the REST edge (never a widened query).
  SlaOutcome sla_outcome = 8;
  // Feature 029 (roadmap 9.2) — additive.
  // ⚠️ `channel` is a FILTER, and "" means "no filter on channel", NOT "conversations that have no
  // channel". ~1 in 6 rows on the stand have none; they stay reachable only by not filtering, so the
  // screen must not offer an "unset" option that this field cannot express.
  string channel = 9;
  // UNSPECIFIED = the default order (updated_at DESC), never "unordered".
  ConversationOrder order = 10;
  // ⭐ Feature 032 (roadmap 4.16) — the two status filters of the model of record.
  //
  // `status_key` is EXACT ("show me VIP Pending"). `status_category` is the broad one ("show me
  // everything solved") and is resolved server-side into the account's keys in that category — so the
  // Archive screen (W10) is this list with a parameter, not a second endpoint. Both may be combined;
  // an inconsistent pair (a key that is not in that category) yields an empty page, which is the honest
  // answer to a contradictory question.
  //
  // ⚠️ An UNKNOWN key is REFUSED, not ignored: dropping it would widen the query to every conversation,
  // which is the opposite of what the caller asked for (the 012 lesson).
  string status_key = 11;
  ConversationStatusCategory status_category = 12;
}

message ConversationPage {
  repeated ConversationSummary conversations = 1;
  string next_page_token = 2;
}

message GetConversationRequest {
  string id = 1;
}

message GetThreadRequest {
  string conversation_id = 1;
  ThreadProjection projection = 2;    // STAFF | CUSTOMER (R4)
  string page_token = 3;
  int32 page_size = 4;
}

message MessagePage {
  repeated Message messages = 1;
  string next_page_token = 2;
}

message GetPlayerFeedRequest {
  string player_id = 1;
  ThreadProjection projection = 2;
  string page_token = 3;
  int32 page_size = 4;
  // ⚠️ REQUIRED since feature 020 (roadmap 5.2 / ADR 0038 §3). This feed used to merge conversations
  // across brands by `player_id` alone — "brand-union" — and Track B proved it did. GR8's id is unique
  // only WITHIN a brand, so wherever the platform reuses one, that merge showed an agent ANOTHER
  // PERSON'S conversations. The feed now keys on the triple; a genuine cross-brand human is a Person
  // (`GetPersonFeed`), established from a matching email or phone, never from an id collision.
  string brand_id = 5;
}

// Feature 020 — the conversations of one HUMAN across the brands they were linked on.
//
// A different question from GetPlayerFeed, and deliberately a different call rather than a flag: one
// asks "what has this account written to us", the other "what has this person written to us". A single
// call whose meaning depends on data it does not name is the shape of the defect being repaired.
// Each returned conversation still carries its own brand — the union never hides where a row came from.
message GetPersonFeedRequest {
  string person_id = 1;
  ThreadProjection projection = 2;
  string page_token = 3;
  int32 page_size = 4;
}

// ── Feature 022 (roadmap 4.13) ───────────────────────────────────────────────────────────────────

// One brand's player. `brand_id` is REQUIRED for the same reason `GetPlayerFeedRequest` requires it
// (feature 020 / roadmap 5.2): GR8's `player_id` is unique only WITHIN a brand, so a request naming
// only the platform id names two customers. Absent ⇒ INVALID_ARGUMENT, never merged.
message GetPlayerContactSummaryRequest {
  string player_id = 1;
  string brand_id = 2;
}

// One HUMAN, across the brands they were EXPLICITLY linked on (feature 020: a link is established
// from a matching email or phone, never from an id collision). Deliberately a separate call rather
// than a flag on the one above — the same reason GetPersonFeed is separate from GetPlayerFeed: a
// single call whose meaning depends on data it does not name is the shape of the 5.2 defect.
message GetPersonContactSummaryRequest {
  string person_id = 1;
}

// The card's contact facts. ONE response type for both questions: the shape is identical and only the
// identity in the request differs, so a second type would be two things to keep in step.
//
// ⚠️ Timestamps are OPTIONAL BY ABSENCE, expressed as strings that are EMPTY when the thing never
// happened. `""` = never — never an epoch date, which renders as "1 January 1970" on a card and is the
// classic way an absent timestamp becomes a wrong fact (FR-008).
//
// ⚠️ NO CONTACT VALUE IS EXPRESSIBLE HERE, and that is structural rather than a convention: there is
// no phone, email, handle or address field, and none may be added (SEC-AP1 / 0032 §5, FR-016).
// `tests/contracts/no-contact-fields-in-summary.spec.ts` asserts it. A channel KIND ("email",
// "whatsapp") is not a contact value and is present; a channel IDENTIFIER is one and has no field to
// sit in.
message ContactSummary {
  // The most recent CUSTOMER-authored message. "" = the customer has never written to us.
  string last_inbound_at = 1;
  // The most recent PUBLIC staff reply. "" = we have never publicly replied.
  // A private note is INERT — it is not contact with the customer. The same rule already governs the
  // first-reply SLA clock (roadmap 4.7); one fact, one definition.
  string last_outbound_at = 2;
  // DERIVED: the later of the two above, named as derived so nobody reads it as a third fact.
  // "" = no contact in either direction. Returned rather than left to the caller, because two callers
  // computing it would eventually disagree about which one wins on a tie.
  string last_contact_at = 3;

  // Conversations in scope (one player, or every linked member of one person).
  int32 conversation_count = 4;
  // Per-status counts over the CLOSED status vocabulary — deliberately NOT a single "open count".
  // "Open" is ambiguous between `status = open` and "not resolved" (pending and snoozed both exist),
  // and the two readings differ on real rows; a number whose definition the caller cannot see is the
  // mistake this message avoids one level up (research R9).
  repeated StatusCount counts_by_status = 5;

  // One entry per channel the customer ever reached us on, INCLUDING the conversations whose channel
  // was never recorded. The per-entry conversation counts SUM to `conversation_count` — no
  // conversation is absent from this list (FR-010).
  repeated ChannelContactEntry channels = 6;
}

message StatusCount {
  ConversationStatus status = 1;   // ⚠️ DEPRECATED (032) — no longer populated. See status_key.
  int32 conversation_count = 2;
  // ⭐ Feature 032: the count is per STATUS KEY now, so a card can show nine buckets rather than four.
  // The category is not repeated here — a client that wants to fold them reads the catalogue once.
  string status_key = 3;
}

// Contact facts within one channel.
message ChannelContactEntry {
  // The recorded channel, verbatim. Empty when `channel_unrecorded` is true.
  string channel = 1;
  // TRUE for the conversations whose channel was never recorded — `Conversation.channel` is nullable
  // and only the seed / API path writes it until Phase 6 builds real channels.
  //
  // ⚠️ A BOOLEAN, not a reserved string. `""` is how a null channel already renders elsewhere and is
  // indistinguishable from a channel genuinely named `""`; a sentinel like "unknown" would collide
  // with a future channel of that name. A separate field cannot collide with any value Phase 6 picks.
  bool channel_unrecorded = 2;

  string last_inbound_at = 3;
  string last_outbound_at = 4;
  int32 conversation_count = 5;
}

service ChatsWriteService {
  rpc PostMessage(PostMessageRequest) returns (Message);
  rpc SetConversationStatus(SetConversationStatusRequest) returns (Conversation);
  // Feature 023 (roadmap 4.18) — additive. A person names the conversation, and doing so LOCKS the
  // title against every automated writer, permanently (FR-022 / U9). Reuses the existing
  // conversation-write permission at both tiers: naming a ticket is not a new kind of authority, and
  // a key that gates one field would be a key nobody assigns.
  rpc SetConversationSubject(SetConversationSubjectRequest) returns (Conversation);
  // ⭐ Feature 032 (roadmap 4.16 — R22) — additive. The one field an agent may NOT change. Gated by
  // `crm.conversation.set_brand` at both tiers and audited inside the update's own transaction.
  rpc SetConversationBrand(SetConversationBrandRequest) returns (Conversation);
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);
  // Internal/seed + future channel ingress (Phase 6) path for inbound customer messages:
  rpc RecordIncomingMessage(RecordIncomingMessageRequest) returns (Message);
  // ── Feature 013 (workflow, roadmap 4.4–4.5) — additive ──
  rpc AssignConversation(AssignConversationRequest) returns (Conversation);
  rpc AutoAssignConversation(AutoAssignRequest) returns (AutoAssignResult);
  rpc AttachLabel(LabelLinkRequest) returns (Ack);
  rpc DetachLabel(LabelLinkRequest) returns (Ack);
  rpc CreateLabel(CreateLabelRequest) returns (Label);
  rpc DefineMacro(DefineMacroRequest) returns (Macro);
  rpc ApplyMacro(ApplyMacroRequest) returns (Conversation);
  rpc CreateCannedResponse(CreateCannedResponseRequest) returns (CannedResponse);
  // ── Feature 014 (automations + first-reply SLA, roadmap 4.6–4.7) — additive ──
  rpc CreateAutomation(CreateAutomationRequest) returns (Automation);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (Automation);
  rpc DeleteAutomation(AutomationIdRequest) returns (Ack);
  rpc SetFirstReplySlaPolicy(SetFirstReplySlaPolicyRequest) returns (FirstReplySlaPolicy);
  // NOTE: SetConversationSubject (roadmap 4.18) is declared by US3 alongside its handler — an rpc
  // ships with its writer, which is the lesson every-rpc-is-served taught twice in this feature.
}

message PostMessageRequest {
  string conversation_id = 1;
  MessageKind kind = 2;               // PUBLIC_REPLY | PRIVATE_NOTE only (validated)
  string body = 3;
  repeated string mentions = 4;       // honored only for PRIVATE_NOTE (R6)
  // Feature 016 — additive. Validated and CLAIMED via users.ClaimUploads BEFORE the message row is
  // written (feature 013's ordering discipline: a refused attachment leaves no partial message).
  // Capped at 50 like every other id list on this contract — an unbounded `repeated string` on an
  // authenticated path is an unbounded request (Principle VII).
  repeated string upload_ids = 5;     // max 50
}

message SetConversationStatusRequest {
  string conversation_id = 1;
  // ⚠️ DEPRECATED (032) and IGNORED. A caller that sends only this gets INVALID_ARGUMENT rather than a
  // coerced write: `resolved` no longer exists (it is `solved`), and silently deciding which of nine
  // statuses somebody meant is worse than refusing.
  ConversationStatus status = 2;
  // ⭐ Feature 032 — the status key, validated against the ACCOUNT's active statuses. Unknown, inactive
  // or empty ⇒ INVALID_ARGUMENT. There is no server-side default: a status write always names one.
  string status_key = 3;
}

// ⭐ Feature 032 (roadmap 4.16 — R22, amends ADR 0038). Brand is auto-assigned at ingestion, selectable
// when a ticket is created by hand, and READ-ONLY for agents; a supervisor may correct it.
//
// Its own rpc and its own permission (`crm.conversation.set_brand`), not a field on some update: brand
// drives reporting and record identity, so the change is AUDITED (0019) and an audited act needs a
// handler that cannot be reached by accident. A no-op (the brand it already has) is refused — an entry
// recording nothing is noise in the store that exists to be read.
message SetConversationBrandRequest {
  string conversation_id = 1;
  string brand_id = 2;
}

// Feature 023. `subject` is bounded at the edge and REFUSED when over-long rather than truncated: a
// silently shortened title is a title the author did not write, and they have no way to tell.
message SetConversationSubjectRequest {
  string conversation_id = 1;
  string subject = 2;
}

message CreateConversationRequest {
  string brand_id = 1;
  string player_id = 2;               // optional
  string priority = 3;
  string channel = 4;
  string assignee_operator_id = 5;
}

message RecordIncomingMessageRequest {
  string conversation_id = 1;
  string body = 2;
  string author_id = 3;               // player id
}

// ═══════════════════════════════════════════════════════════════════════════════
// Feature 013 — Conversation workflow (roadmap 4.4 assignment + 4.5 labels/macros/
// canned). ADDITIVE ONLY: nothing above is renumbered (Principle VIII, buf
// breaking=FILE). Caller context still rides in metadata (x-actor-*), never in a body.
// ═══════════════════════════════════════════════════════════════════════════════

// A macro's action set (v1, research R4). Richer actions (send message, SLA, automation)
// belong to roadmap 4.6/4.7 — an unknown type is rejected at define AND at apply.
enum MacroActionType {
  MACRO_ACTION_TYPE_UNSPECIFIED = 0;
  // ⚠️ Feature 032: `value` is now a STATUS KEY (`vip_pending`), validated against the account's active
  // statuses at define AND at apply — it used to be the proto enum NAME. Stored definitions were
  // rewritten by the 4.16 migration; a rule can no longer name a status nothing resolves.
  MACRO_ACTION_TYPE_SET_STATUS = 1;   // value = status key
  MACRO_ACTION_TYPE_ADD_LABEL = 2;    // value = label_id
  MACRO_ACTION_TYPE_ASSIGN = 3;       // value = operator_id
  // Feature 014: the shared action vocabulary is used by macros AND automation rules.
  MACRO_ACTION_TYPE_SET_PRIORITY = 4; // value = priority name (research R9)
}

message MacroAction {
  MacroActionType type = 1;
  string value = 2;
}

message Label {
  string id = 1;
  string name = 2;
  string color = 3;                   // "" when unset
}
message LabelList { repeated Label labels = 1; }

message Macro {
  string id = 1;
  string name = 2;
  repeated MacroAction actions = 3;
}
message MacroList { repeated Macro macros = 1; }

// Reusable reply text. Text ONLY — never sends a message by itself (FR-009).
message CannedResponse {
  string id = 1;
  string name = 2;
  string body = 3;
}
message CannedResponseList { repeated CannedResponse canned = 1; }

message Ack { bool ok = 1; }

// Round-robin candidate. Supplied BY THE CALLER until the Users service resolves teams +
// capacity (roadmap 5.3 / research R3) — the chats service makes no Users call here.
message RoundRobinCandidate {
  string operator_id = 1;
  int32 capacity = 2;
  int32 current_load = 3;
}

message ConversationIdRequest { string conversation_id = 1; }
message Empty {}

message AssignConversationRequest {
  string conversation_id = 1;
  string operator_id = 2;             // "" = unassign
}

// ⚠️ Feature 024 (roadmap 5.3) adds `group_id`. See the field's own note: when it is set it WINS and
// `candidates` is ignored — two sources for one routing answer is how a routing decision becomes
// unexplainable, and "which of the two did it use?" is not a question anyone should have to ask of a
// live queue.
message AutoAssignRequest {
  string conversation_id = 1;
  string group_key = 2;                        // opaque; rotation state keyed by (account, group_key)
  repeated RoundRobinCandidate candidates = 3; // caller-supplied; still fully supported
  // Feature 024 (roadmap 5.3): name a GROUP and let the service build the pool — membership from
  // auth, operator profiles from users, current load counted here, capacity from a 🅿 PROVISIONAL
  // configured default (revised by 4.19–4.21 and 5.9).
  //
  // PRECEDENCE: when set, this WINS and `candidates` is ignored. It also becomes the rotation key and
  // is recorded on the conversation as `routed_group_id`. A group that resolves to nobody assignable
  // answers with the existing GROUP_ROUTING_NOT_AVAILABLE — a guess is worse than a truthful "not
  // yet" (feature 013 US3 #4), and that is unchanged.
  string group_id = 4;
}
message AutoAssignResult {
  bool assigned = 1;
  string operator_id = 2;                      // "" when none available
  Conversation conversation = 3;               // populated when assigned
  // "" on success; a machine-readable reason when assigned=false, e.g.
  // NO_OPERATOR_AVAILABLE | GROUP_ROUTING_NOT_AVAILABLE (spec US3 #3/#4).
  string reason = 4;
}

message LabelLinkRequest {
  string conversation_id = 1;
  string label_id = 2;
}
message CreateLabelRequest {
  string name = 1;
  string color = 2;
}
message DefineMacroRequest {
  string name = 1;
  repeated MacroAction actions = 2;
}
message ApplyMacroRequest {
  string conversation_id = 1;
  string macro_id = 2;
}
message CreateCannedResponseRequest {
  string name = 1;
  string body = 2;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Feature 014 — Automations engine (roadmap 4.6) + first-reply SLA (roadmap 4.7).
// ADDITIVE ONLY: nothing above is renumbered; MacroActionType gained a value at the
// end (SET_PRIORITY = 4) and ListConversationsRequest a field (sla_outcome = 8).
// Caller context still rides in metadata (x-actor-*), never in a body.
// ═══════════════════════════════════════════════════════════════════════════════

// A rule's trigger. Closed, additive catalogue — an UNSPECIFIED/unknown trigger is refused at
// authoring AND at run time (a definition stored before a catalogue change must never resolve to a
// different meaning than its author intended).
enum AutomationTrigger {
  AUTOMATION_TRIGGER_UNSPECIFIED = 0;          // refused — a rule must name its trigger
  AUTOMATION_TRIGGER_CONVERSATION_CREATED = 1;
  AUTOMATION_TRIGGER_MESSAGE_RECEIVED = 2;     // inbound PLAYER message only (never staff replies)
  AUTOMATION_TRIGGER_STATUS_CHANGED = 3;
  AUTOMATION_TRIGGER_FIRST_REPLY_BREACHED = 4; // emitted by the 4.7 half (US3 join)
}

enum ConditionField {
  CONDITION_FIELD_UNSPECIFIED = 0;  // refused
  CONDITION_FIELD_STATUS = 1;
  CONDITION_FIELD_PRIORITY = 2;
  CONDITION_FIELD_BRAND = 3;
  CONDITION_FIELD_CHANNEL = 4;
  CONDITION_FIELD_ASSIGNEE = 5;     // PRESENT / ABSENT
  CONDITION_FIELD_LABEL = 6;        // PRESENT / ABSENT, value = label_id
  CONDITION_FIELD_MESSAGE_TEXT = 7; // CONTAINS, only under MESSAGE_RECEIVED
}

enum ConditionOp {
  CONDITION_OP_UNSPECIFIED = 0;     // refused
  CONDITION_OP_EQ = 1;
  CONDITION_OP_NE = 2;
  CONDITION_OP_PRESENT = 3;
  CONDITION_OP_ABSENT = 4;
  CONDITION_OP_CONTAINS = 5;        // message text only
}

// First-reply measurement outcome. Also the ListConversations filter (R10).
enum SlaOutcome {
  SLA_OUTCOME_UNSPECIFIED = 0;      // no filter
  SLA_OUTCOME_RUNNING = 1;
  SLA_OUTCOME_MET = 2;
  SLA_OUTCOME_BREACHED = 3;
}

message AutomationCondition {
  ConditionField field = 1;
  ConditionOp op = 2;
  string value = 3;
}

message AutomationDefinition {
  AutomationTrigger trigger = 1;
  repeated AutomationCondition conditions = 2; // may be empty (= every occurrence of the trigger)
  repeated MacroAction actions = 3;            // MUST be non-empty; shares the macro vocabulary
}

message Automation {
  string id = 1;
  string name = 2;
  bool active = 3;
  int32 position = 4;
  int32 revision = 5;
  // The authority the rule acts with: its author's CURRENT permissions, re-resolved on every
  // evaluation (FR-023 / research R5). A rule is never more powerful than its author.
  string author_user_id = 6;
  AutomationDefinition definition = 7;
  string created_at = 8;
  string updated_at = 9;
}
message AutomationList {
  repeated Automation automations = 1;
  string next_page_token = 2;
}

message ListAutomationsRequest {
  string page_token = 1;
  int32 page_size = 2;                         // server-capped
}

message CreateAutomationRequest {
  string name = 1;
  AutomationDefinition definition = 2;
  int32 position = 3;
  bool active = 4;
}

// Partial update. Explicit has_* presence flags: proto3 scalar presence is ambiguous through
// proto-loader, so "" / 0 / false must not silently mean "clear this field".
message UpdateAutomationRequest {
  string id = 1;
  string name = 2;
  bool has_name = 3;
  AutomationDefinition definition = 4;
  bool has_definition = 5;                     // when true the definition is revalidated + revision bumped
  int32 position = 6;
  bool has_position = 7;
  bool active = 8;
  bool has_active = 9;
}

message AutomationIdRequest { string id = 1; }

// One diagnostic entry per evaluation (FR-007). PII-FREE by construction: ids, an outcome and a
// short reason — never message text, never a player id. NOT the 0019 audit store (that is 4.8).
message AutomationRun {
  string id = 1;
  string automation_id = 2;
  int32 automation_revision = 3;
  string conversation_id = 4;
  AutomationTrigger trigger = 5;
  string outcome = 6;                          // applied | not_matched | refused
  string reason = 7;                           // e.g. "author lacks crm.conversation.assign"
  string created_at = 8;
}
message AutomationRunList {
  repeated AutomationRun runs = 1;
  string next_page_token = 2;
}

message ListAutomationRunsRequest {
  string automation_id = 1;                    // "" = every rule in the account
  string conversation_id = 2;                  // "" = every conversation
  string page_token = 3;
  int32 page_size = 4;
}

// The first-reply target. scope_* use the "*" sentinel rather than absence: Postgres unique
// indexes treat NULLs as DISTINCT, so NULL scoping would allow two account-level defaults and make
// "the target" ambiguous (research R7).
message FirstReplySlaPolicy {
  string id = 1;
  int32 target_minutes = 2;
  string scope_priority = 3;                   // "*" = any priority
  string scope_brand_id = 4;                   // "*" = any brand
}
message FirstReplySlaPolicyList { repeated FirstReplySlaPolicy policies = 1; }

message SetFirstReplySlaPolicyRequest {
  int32 target_minutes = 1;                    // > 0
  string scope_priority = 2;                   // "" or "*" = any
  string scope_brand_id = 3;
}

// Per-conversation measurement, surfaced on the conversation detail.
message FirstReplySlaState {
  SlaOutcome outcome = 1;
  string started_at = 2;
  string deadline_at = 3;
  int32 target_minutes = 4;                    // FROZEN at clock start (FR-016)
  string first_reply_at = 5;                   // "" while running
  int32 first_reply_seconds = 6;               // 0 while running
}

// ─────────────────────────────────────────────────────────────────────────────────
// Maintenance surface — deliberately a SEPARATE service (research R3).
//
// Not a user-facing surface: the gateway exposes NO route to it, and the handler requires actor
// metadata `x-actor-kind: system`. It is the entry point for the worker's repeatable tick and the
// only caller of the single unscoped id-only read. It answers with COUNTS — never rows — so no
// tenant data crosses the boundary even to a system caller.
// ─────────────────────────────────────────────────────────────────────────────────
service ChatsMaintenanceService {
  rpc SweepFirstReplySla(SweepRequest) returns (SweepResult);

  // ⭐ Feature 031 (roadmap 4.20, ADR 0042 §2): drain the backlog as capacity frees.
  //
  // Same shape as the sweep above and for the same reasons: the worker is the clock, the batch is
  // server-capped, and the answer is COUNTS ONLY — a drain that returned conversation ids would put
  // customer work in a maintenance log that nobody reads with customer eyes.
  rpc DrainBacklog(MaintenanceBatchRequest) returns (DrainResult);

  // Feature 017 (roadmap 4.10). Both inherit every property of the sweep above: system actor only, no
  // gateway route, batch-capped, COUNTS in the response.
  //
  // Claim and run due exports. `queued → running` is a CONDITIONAL update, so two overlapping ticks
  // cannot claim one row — idempotency comes from the predicate, not from bookkeeping. Also recovers a
  // STALE `running` row (claimed too long ago, i.e. the producer died) to failed/interrupted, which is
  // what stops a row from being `running` forever.
  rpc RunDueExports(MaintenanceBatchRequest) returns (RunDueExportsResult);

  // Flip `ready` rows past their expiry to `expired`. The BYTES are removed independently by
  // users.UsersMaintenanceService.PurgeExpiredArtefacts on its own predicate (research R7), so neither
  // service waits on the other: a downed peer delays nothing and loses nothing.
  rpc ExpireDueExports(MaintenanceBatchRequest) returns (ExpireDueExportsResult);

  // ── Feature 023 — additive. Same fencing as every sweep above: system actor only, no gateway route,
  // COUNTS in the response. ──
  //
  // Is the transition stream actually being written? The stream has NO consumer yet (the aggregation
  // store is roadmap 11.0), so without this there is no way to notice it has stopped — and this
  // codebase has shipped write-only machinery that rotted silently twice (a hosted package with no
  // registered handler, feature 015; a maintenance rpc reached by no tick, feature 017). COUNTS only:
  // returning rows would be the read surface this feature deliberately refuses.
  rpc ReportTransitionStreamHealth(SweepRequest) returns (TransitionStreamHealth);

  // Close the derivation windows whose ten minutes have passed (roadmap 4.18, FR-018). The other two
  // arms of the window — the customer's third message and the first staff reply — close on the write
  // path itself; only the timeout needs a tick. A sweep rather than ~3 000 delayed jobs a day
  // (research R5): a lost delayed job is a window never closed, silently.
  rpc SweepConversationSubjects(SweepRequest) returns (SweepSubjectsResult);
}

// Feature 023 — a COUNT, never a row.
message TransitionStreamHealth {
  int64 total = 1;
  int64 last_hour = 2;
  // Timestamp only: no payload, no dimensions, no subject id.
  string newest_at = 3;
}

// Feature 023 — counts only. `closed` is below `checked` whenever a window closed on the write path
// between the selection and the close, which is normal and not an error.
message SweepSubjectsResult {
  int32 checked = 1;
  int32 closed = 2;
}

message SweepRequest {
  int32 limit = 1;                             // server-capped (SLA_SWEEP_BATCH)
}
message SweepResult {
  int32 checked = 1;
  int32 breached = 2;
  int32 rules_applied = 3;
  // No ids of any kind. Counts only.
}

message DrainResult {
  int32 considered = 1;  // how many waiting items the drain looked at (server-capped)
  int32 assigned = 2;    // how many found an owner
  int32 skipped = 3;     // ⚠️ passed over because the freed capacity could not SERVE them — see ADR 0042
                         // §2. A high number here with `assigned` at zero is the head-of-line signal.
  int32 unroutable = 4;  // could reach nobody at all; each raises its own audited event
  // No ids of any kind. Counts only.
}

message MaintenanceBatchRequest {
  int32 limit = 1;                             // server-capped
}
message RunDueExportsResult {
  int32 claimed = 1;
  int32 completed = 2;
  int32 failed = 3;
  int32 recovered_stale = 4;
  // Counts only. No export ids, no scopes, no filters.
}
message ExpireDueExportsResult {
  int32 expired = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Exports (feature 017, roadmap 4.10 — SEC-21/SEC-22/SEC-27)
//
// An export is a FILE of data the requester may already read. Three properties make it defensible,
// and all three are visible in this contract:
//   • it is produced OUT of the request (FR-001) — CreateExport returns a record, never bytes;
//   • the bytes never appear here (research R4) — the artefact reaches storage through the EXISTING
//     users.UploadsService.CreateUpload, so feature 016's `bytes`-message set is unchanged and
//     `users` remains the only holder of storage credentials;
//   • nothing is a URL. ResolveExportArtefact hands back an ID, and the bytes are then fetched
//     through the brokered ReadUpload, which re-authorizes AT FETCH TIME (FR-010). A signed link
//     would move the decision to link-creation time, which IS the SEC-10/SEC-27 defect.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
service ChatsExportService {
  // Create a request. Refuses BEFORE writing a row when the scope is unknown, the caller lacks its
  // permission, a filter is unrecognised, or the quota is exhausted (FR-005/FR-009/FR-017).
  rpc CreateExport(CreateExportRequest) returns (ExportJob);

  // The caller's OWN exports, keyset-paged, newest first. Never anyone else's.
  rpc ListExports(ListExportsRequest) returns (ListExportsResponse);

  // One export. Account-scoped AND owner-checked: a same-account non-owner, another account's id, an
  // unknown id and an EXPIRED export all return the identical NOT_FOUND (FR-011) — no existence oracle.
  rpc GetExport(GetExportRequest) returns (ExportJob);

  // Resolve to the artefact reference the gateway may then read through UploadsService. Refuses unless
  // the caller is the OWNER, the status is `ready` and the expiry is in the future.
  rpc ResolveExportArtefact(GetExportRequest) returns (ExportArtefactRef);

  // ── Deliberately ABSENT ────────────────────────────────────────────────────────────────────────
  // • No UpdateExport / DeleteExport / CancelExport — an export is not editable in v1, and a
  //   requester-driven delete would be a SECOND way to remove bytes; research R8 keeps exactly one,
  //   and it is a system sweep.
  // • No RetryExport — a failed export is re-requested, so every attempt is one audited act rather
  //   than an unaudited second run against the same record.
  // • No DownloadExport carrying bytes — that would add a `bytes` message and break the single-path
  //   guarantee this whole design is built to preserve.
}

// The SAME filter vocabulary as ListConversationsRequest (FR-027).
//
// ⚠️ Mirrored, not extracted, and the field numbers MATCH so the parity test reads as an equality.
// Extracting a shared nested message would renumber a SHIPPED message and touch feature 012's wire
// tests to gain tidiness on an internal contract. What keeps two declarations ONE vocabulary is the
// test (`tests/exports/filter-parity.spec.ts`), not the intent — intent does not survive a future
// field added to one side only.
message ExportFilters {
  ConversationStatus status = 1;      // ⚠️ DEPRECATED (032) — REFUSED, not mapped. See status_key below.
  string priority = 2;
  string assignee_operator_id = 3;
  string player_id = 4;
  string brand_id = 5;
  // 6 and 7 are page_token / page_size on the list request — INTENTIONALLY ABSENT: an export covers
  // the whole filtered set up to the scope's row limit, so paging is an internal production concern
  // and never a request parameter.
  SlaOutcome sla_outcome = 8;
  // Feature 029: mirrors the list's new `channel` filter, and it is NOT optional tidiness — an admin
  // who narrows the Inbox to one channel and exports must not receive the whole set. That is more rows
  // of customer data than the screen showed, which is the anti-pitching failure itself (SEC-AP2).
  string channel = 9;
  // 10 is `order` on the list request — INTENTIONALLY ABSENT, for the same reason as 6 and 7: an export
  // is a SET, not a sequence. Ordering it would be a presentation choice smuggled into a data request.
  // Feature 032: both status filters are FILTERS, so both are mirrored — an admin who narrows the Inbox
  // to one category and exports must not receive the whole set (SEC-AP2). Same numbers as the list.
  string status_key = 11;
  ConversationStatusCategory status_category = 12;
}

message CreateExportRequest {
  // From the closed catalogue (libs/common/src/exports/scopes.ts). Unknown ⇒ INVALID_ARGUMENT, never
  // coerced to a default — feature 012's live defect was exactly a silently coerced unknown value.
  string scope = 1;
  ExportFilters filters = 2;
}

message ExportJob {
  string id = 1;
  string scope = 2;
  string format = 3;
  string status = 4;            // queued | running | ready | failed | expired
  int32 row_count = 5;          // 0 until complete
  int64 byte_size = 6;          // 0 until complete
  string failure_reason = 7;    // a short CODE from the closed list, never a raw error or a row value
  string expires_at = 8;        // RFC3339
  string created_at = 9;        // RFC3339
  string completed_at = 10;     // RFC3339, empty until terminal
  // `requested_by` is deliberately ABSENT: the caller is always the owner, so echoing an actor id
  // adds a joinable identifier and no information.
  // `upload_id` is deliberately ABSENT: obtainable only through ResolveExportArtefact, so no client
  // can accumulate artefact references from a list response.
}

message ListExportsRequest {
  int32 page_size = 1;          // server-capped
  string cursor = 2;            // opaque keyset cursor
}

message ListExportsResponse {
  repeated ExportJob exports = 1;
  string next_cursor = 2;
}

message GetExportRequest {
  string export_id = 1;
}

message ExportArtefactRef {
  string upload_id = 1;         // an id for UploadsService.ReadUpload — never a URL, never signed
  string display_name = 2;      // sanitized, for Content-Disposition; never logged (SEC-26)
}
