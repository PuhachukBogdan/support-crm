// Auth <-> Gateway boundary contract (roadmap 2.1, feature 006; extended by feature 009).
//
// Schema-first (Principle VIII): this .proto is reviewed/approved BEFORE bodies are
// implemented. Message shapes + RPC signatures only — NO business logic. The gateway
// calls ValidateToken on every request and does routing + JWT only.
//
// Feature 009 (Auth core & sessions) makes the flow TWO-STEP (email+password → emailed
// code → session) for ALL roles. This is ADDITIVE to the 006-approved contract:
// ValidateToken / Login / Refresh / TokenClaims / TokenPair keep their field numbers;
// only new RPCs/messages and one new field (RefreshRequest.remember_me) are added.
// See specs/009-auth-core-sessions/contracts/auth-grpc.md.
//
// Generated TS message types (git-ignored): libs/proto/gen/crm/auth/v1/auth.ts

syntax = "proto3";

package crm.auth.v1;

import "crm/audit/v1/audit.proto";
import "crm/security/v1/security.proto";

// Auth service surface the gateway (and later, admin flows) consume over gRPC.
service AuthService {
  // Gateway calls this on every protected request. Fast, read-only verification.
  rpc ValidateToken(ValidateTokenRequest) returns (TokenClaims);

  // Step 1 of login (feature 009 changed semantics): verify email+password, then on
  // success issue a one-time code via the EmailPort and return a challenge. NO token here.
  rpc Login(LoginRequest) returns (LoginChallenge);

  // Step 2 of login (feature 009): verify the emailed code for a challenge → issue the
  // token pair. No token is ever issued before a code is consumed (SEC-2, un-bypassable).
  rpc VerifyLoginCode(VerifyLoginCodeRequest) returns (TokenPair);

  // Re-send a code for an active challenge (rate-limited). Optional this feature.
  //
  // UNSERVED: declared by feature 009 as "optional this feature" and never implemented, and roadmap
  // 3.11 (the two-step login flow) closed `[x]` WITHOUT it — so no open point owns it. This marker
  // records a deliberate absence, not a to-do: without it, "nobody built this yet" is indistinguishable
  // from an oversight. Found by feature 022's repo-wide guard
  // (`tests/contracts/every-rpc-is-served.spec.ts`), which honours this marker as the exemption and
  // FAILS if the rpc ever gains a handler while the marker is still here.
  rpc ResendLoginCode(ResendLoginCodeRequest) returns (LoginChallenge);

  // Exchange a refresh token for a new pair (token expiry — SEC-4/5); rotates the refresh.
  rpc Refresh(RefreshRequest) returns (TokenPair);

  // Revoke the current refresh token (logout).
  rpc Logout(LogoutRequest) returns (LogoutResult);

  // --- Feature 010: account lifecycle (onboarding / invite / registration). ADDITIVE. ---
  // See specs/010-account-onboarding/contracts/auth-grpc.md.

  // Generic super-admin "activate account" entry (anti-enumeration): ALWAYS returns the same ack.
  // A code is emailed only when `email` is whitelisted AND has no active account.
  rpc RequestActivation(RequestActivationRequest) returns (ActivationAck);

  // Finish activation: verify emailed code + password policy → create the ACTIVE super-admin
  // (bound to the whitelist entry's account) and issue a session (a valid code was consumed).
  rpc CompleteActivation(CompleteActivationRequest) returns (TokenPair);

  // Issue a single-use, expiring invite (hierarchy enforced from caller claims). Emails the link.
  rpc CreateInvitation(CreateInvitationRequest) returns (InvitationResult);

  // Open an invite: validate token + email match; on success email a fresh verification code.
  rpc StartRegistration(StartRegistrationRequest) returns (RegistrationChallenge);

  // Finish registration: verify token + code + password policy → create/activate the user with
  // the invited role, consume the invite, and issue a session.
  rpc CompleteRegistration(CompleteRegistrationRequest) returns (TokenPair);

  // --- Feature 011: RBAC (roadmap 3.3/3.6/3.7). ADDITIVE. ---
  // See specs/011-rbac-role-matrix/contracts/auth-grpc.md. US1 wires ONLY the resolver; the
  // management / catalogue RPCs (SetRoleDefault, PersonalizeUser, …) land in US2/US3.

  // Resolve a user's EFFECTIVE permission set (hot path — the gateway calls this on a cache miss,
  // R-1). Inherited users resolve to their role's default set; standalone users to their snapshot.
  // `preview_role` (view-as, US5) shapes the resolved set to that role and marks it read-only.
  rpc ResolveEffectivePermissions(ResolveRequest) returns (ResolveResponse);

  // --- US2: catalogue / role defaults (super-admin admin-panel reads) ---
  rpc ListPermissionCatalogue(CatalogueRequest) returns (CatalogueResponse);
  rpc ListRoleDefaults(RoleDefaultsRequest) returns (RoleDefaultsResponse);

  // --- US3: management (super-admin only; each writes PrivilegeAudit) ---
  rpc SetRoleDefault(SetRoleDefaultRequest) returns (RbacMutationResult);
  rpc PersonalizeUser(PersonalizeRequest) returns (RbacMutationResult);
  // ⚠️ NAME COLLISION — "Group" HERE MEANS "A BATCH OF SELECTED USERS EDITED AT ONCE" (feature 011,
  // US3). It has nothing to do with the `Group` ENTITY introduced by feature 024 below. The word was
  // taken before the entity existed; the wire name is kept because renaming an rpc trips
  // `buf breaking` (the wall `CheckBrandAccess` hit in feature 020), so the collision is DECLARED
  // rather than removed. In TypeScript this one is `OverrideService.personalizeSelection`.
  rpc PersonalizeGroup(PersonalizeGroupRequest) returns (RbacMutationResult);
  rpc ResetToDefault(ResetRequest) returns (RbacMutationResult);
  rpc AssignRole(AssignRoleRequest) returns (RbacMutationResult);

  // ── Feature 024: GROUPS (roadmap 5.3, ADR 0039) — ADDITIVE ──────────────────────────────────────
  //
  // A group is an operator-named unit of staff that may carry permission grants. It CONTRIBUTES into
  // the one policy layer through ResolveEffectivePermissions above (ADR 0039 §2) — it gets no check,
  // no guard and no second place where "may they?" is answered. It GRANTS and never DENIES (§3), and
  // every consequence of membership is enforced server-side (§4).
  //
  // Every mutation below is gated by `platform.group.manage` at BOTH tiers and writes exactly one
  // audit entry. `affected_user_ids` drives the gateway's cache invalidation, exactly as
  // RbacMutationResult already does for the RBAC mutations.
  rpc CreateGroup(CreateGroupRequest) returns (GroupMutationResult);
  rpc RenameGroup(RenameGroupRequest) returns (GroupMutationResult);
  // ⭐ Feature 031 (ADR 0042): switch a desk into or out of AUTOMATIC DISTRIBUTION. Its own rpc rather
  // than a field on RenameGroup — a rename changes a label nothing branches on, while this changes who
  // receives customer conversations without anybody choosing.
  rpc SetGroupRoutable(SetGroupRoutableRequest) returns (GroupMutationResult);
  /**
   * ⭐ W32 (roadmap 3.16, ADR 0043 §4) — name, or unname, who answers for this desk.
   *
   * Two rpcs rather than one taking an optional id: "" as "clear" makes an accidental empty string
   * indistinguishable from an intent, and this decides where a departing colleague's customers go.
   */
  /**
   * ⭐ W32 (roadmap 12.10) — the deny-list an administrator manages.
   *
   * Under `platform.settings.manage`, checked here as well as at the edge (Principle II). Adding an
   * address that is already listed is a QUIET SUCCESS, not a conflict: the administrator expressed
   * the same intent twice, and the unique index absorbs it.
   */
  rpc ListDeniedAddresses(ListDeniedAddressesRequest) returns (ListDeniedAddressesResult);
  rpc AddDeniedAddress(AddDeniedAddressRequest) returns (DeniedAddressResult);
  rpc RemoveDeniedAddress(RemoveDeniedAddressRequest) returns (RemoveDeniedAddressResult);

  /**
   * ⭐ W32 (roadmap 12.11) — auth's contribution to the security page.
   *
   * ⚠️ NOT a maintenance rpc: it answers a human's permission-gated read, so it is guarded like every
   * other administrative rpc and is reachable from the gateway — which maintenance rpcs never are.
   */
  rpc ListSecurityFacts(crm.security.v1.ListSecurityFactsRequest) returns (crm.security.v1.ListSecurityFactsResult);

  /**
   * ⭐ W32 (roadmap 12.10) — the deny-list the BOUNDARY compares against.
   *
   * ── Why it is here and not on the maintenance service ───────────────────────────────────────────
   * It was drafted there and `tests/worker/maintenance-ticks.spec.ts` refused it, correctly. A
   * maintenance rpc in this product means «only a tick may call it», and this one is read by the
   * GATEWAY on a timer — so it never was one. It belongs beside `ValidateToken` and
   * `ResolveEffectivePermissions`: infrastructure the gateway asks auth for, on no session, because
   * there is no session yet.
   *
   * ⚠️ **Deliberately NOT account-scoped.** The boundary must refuse BEFORE authentication, and an
   * anonymous request carries no account — there is nothing to scope by at the moment the decision is
   * made. Rows are stored per account (that is where the screen and the trail belong); this answers
   * their union. See `DeniedAddress` in the schema for what that costs and when to revisit it.
   *
   * Addresses only: no note, no author, no account. The boundary needs a set to test membership
   * against, and everything else would be tenant configuration crossing to a service that has no
   * business holding it.
   */
  rpc ListDeniedAddressesForEdge(ListDeniedAddressesForEdgeRequest) returns (ListDeniedAddressesForEdgeResult);

  rpc SetGroupLead(SetGroupLeadRequest) returns (GroupMutationResult);
  rpc ClearGroupLead(ClearGroupLeadRequest) returns (GroupMutationResult);
  rpc DeleteGroup(DeleteGroupRequest) returns (GroupMutationResult);
  /**
   * ⭐ W14 (roadmap 3.8) — the account's PEOPLE. Additive.
   *
   * ⚠️ It did not exist, and its absence was structural rather than an oversight: every
   * people-shaped mutation the product has (change a role, add somebody to a desk, grant an
   * override) takes a USER ID, and there was no way to obtain one through the product at all. An
   * administrator could change a role only if they already knew a UUID.
   *
   * Staff facts only — id, email, display name, status, role. ⛔ No customer data touches this
   * surface, and `auth` holds none: the masking rules that govern the player card have no bearing
   * here, and conflating the two vocabularies is how a staff screen would grow a customer field.
   */
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc AddGroupMember(GroupMemberRequest) returns (GroupMutationResult);
  rpc RemoveGroupMember(GroupMemberRequest) returns (GroupMutationResult);
  // The routing seam: feature 013's `GROUP_ROUTING_NOT_AVAILABLE` finally has a source. Returns AUTH
  // user ids; chats maps them to assignable operator profiles through users (spec 024 research R3).
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse);
  // ⭐ W29 — additive: the INVERSE read (which groups is this user in). The resolver has answered
  // this internally since 024; macro AVAILABILITY («кому доступен») is the first cross-service
  // consumer. Ids only — names live on ListGroups.
  rpc ListUserGroups(UserGroupsRequest) returns (UserGroupsResponse);
  rpc SetGroupPermission(SetGroupPermissionRequest) returns (GroupMutationResult);

  // ── Feature 015 (audit trail, roadmap 4.8) — additive. One RPC per source; the gateway fans out
  // and merges. Gated by `platform.audit.view` at BOTH tiers. No write/update/delete counterpart
  // exists anywhere — append-only means there is no mutation path to expose.
  rpc ListAuditEntries(crm.audit.v1.ListAuditEntriesRequest) returns (crm.audit.v1.AuditEntryPage);

  // ── Feature 028 (mail delivery) — additive. The worker's tick says "now"; auth does the sending.
  //
  // ⚠️ NOTHING about a message crosses this wire — a count in, three counts out. The alternative
  // design had the worker doing the SMTP send, which would have put a LIVE ONE-TIME CODE into a
  // gRPC payload and into a second process's memory and failure paths. The promise that the code
  // reaches no log on any path is cheapest to keep by shrinking the number of places it exists
  // (spec 028 research R2).
  //
  // The tick exists at all because a repeatable job fires ONCE ACROSS REPLICAS, where a
  // `setInterval` inside auth fires once per pod — the same reasoning feature 017 recorded for
  // exports.
  rpc SendDueEmails(SendDueEmailsRequest) returns (SendDueEmailsResult);

  // ── ⭐ W31 / feature 038 (roadmap 3.17, ADR 0043 §5): the provisioning key's own lifecycle ──────
  //
  // Gated `platform.settings.manage` at BOTH tiers — the account-configuration key admins already
  // hold. No new permission key: issuing an integration credential is the same class of act as
  // configuring a channel, and one key per scope stops meaning anything once every screen invents
  // its own.
  //
  // ⚠️ `IssuedApiKey` is the ONLY message in this product that carries a key value, and it is
  // returned by exactly two rpcs. `ApiKey` has no such field at all, so a list or a read cannot leak
  // one by a forgotten filter — the absence is the protection.
  rpc ListApiKeys(ListApiKeysRequest) returns (ApiKeyList);
  rpc IssueApiKey(IssueApiKeyRequest) returns (IssuedApiKey);
  rpc RotateApiKey(ApiKeyIdRequest) returns (IssuedApiKey);
  rpc RevokeApiKey(ApiKeyIdRequest) returns (RevokeApiKeyResult);

  // ── ⭐ W31 / feature 038 (roadmap 3.15, ADR 0043 §1–§7): the machine path ────────────────────────
  //
  // ⚠️ These two take the RAW BYTES and the headers, never parsed fields. The gateway cannot parse
  // what it does not verify: if it sent a decoded body alongside the signature, the thing verified
  // and the thing applied would be two objects, and only one of them was signed. Auth verifies the
  // bytes and then parses the same bytes.
  //
  // ⚠️ **There is no role member in either request, and that is the least-privilege bar** (SEC-PV1):
  // the created role is a constant of the path, so no reordering, no default and no future field can
  // make this API mint an administrator. A check could be moved; an absent input cannot.
  //
  // Both answer with a rendered result — status, problem type, outcome, handover counts and the body
  // to return — because the decision belongs to the service that owns the accounts, and the gateway
  // renders it (Principle VIII).
  rpc ProvisionStaff(ProvisionStaffRequest) returns (ProvisioningResult);
  rpc DeactivateStaff(DeactivateStaffRequest) returns (ProvisioningResult);
}

message ValidateTokenRequest {
  string access_token = 1;
}

// Claims the gateway needs to route + authorize. account_id carries the tenant seam
// (ADR 0003); roles feed the policy layer (Principle II, enforced in services — not here).
message TokenClaims {
  bool valid = 1;
  string user_id = 2;
  string account_id = 3;
  repeated string roles = 4;
  // Unix seconds; 0 when invalid.
  int64 expires_at = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

// Step-1 outcome. status == CODE_SENT is the ONLY success; a token never appears here.
enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  CODE_SENT = 1; // credentials ok → code emailed; proceed to VerifyLoginCode.
  INVALID_CREDENTIALS = 2; // generic; caller MUST NOT distinguish from unknown-email.
  LOCKED = 3; // account temporarily locked (SEC-14).
}

message LoginChallenge {
  LoginStatus status = 1;
  string challenge_id = 2; // empty unless status == CODE_SENT.
  int64 code_expires_at = 3; // unix seconds; 0 unless CODE_SENT.
}

message VerifyLoginCodeRequest {
  string challenge_id = 1;
  string code = 2;
  bool remember_me = 3; // selects session lifetime (~1d vs ~7d).
}

message ResendLoginCodeRequest {
  string challenge_id = 1;
}

message RefreshRequest {
  string refresh_token = 1;
  bool remember_me = 2; // NEW (feature 009, additive) — rotation preserves session class.
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResult {
  bool revoked = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  int64 refresh_expires_at = 4;
}

// --- Feature 010 messages (account lifecycle) ---

message RequestActivationRequest {
  string email = 1;
}

// Deliberately empty / uniform — reveals nothing about whitelist membership (anti-enumeration).
message ActivationAck {}

message CompleteActivationRequest {
  string email = 1;
  string code = 2; // emailed activation code (LoginCode, purpose="activation")
  string password = 3; // must satisfy the password policy
}

message CreateInvitationRequest {
  // Caller identity — populated by the gateway from the VALIDATED access JWT (Principle II).
  string inviter_user_id = 1;
  string inviter_account_id = 2;
  repeated string inviter_roles = 3;
  // Invitation payload:
  string email = 4;
  string role_key = 5; // never "super_admin" (originates only from the whitelist).
}

enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_CREATED = 1; // invite issued + emailed.
  INVITATION_FORBIDDEN = 2; // hierarchy violation (caller may not grant role_key).
  INVITATION_RATE_LIMITED = 3; // issuance throttled (SEC-14).
}

message InvitationResult {
  InvitationStatus status = 1;
  string invitation_id = 2; // set only when CREATED (audit handle; NOT the secret).
}

message StartRegistrationRequest {
  string invite_token = 1; // "<invitation_id>.<secret>" from the emailed link.
  string email = 2; // must match the invitation's email exactly.
}

enum RegistrationStatus {
  REGISTRATION_STATUS_UNSPECIFIED = 0;
  REGISTRATION_CODE_SENT = 1; // token+email valid → verification code emailed.
  REGISTRATION_INVALID = 2; // bad/expired/consumed token or email mismatch (generic).
}

message RegistrationChallenge {
  RegistrationStatus status = 1;
  int64 code_expires_at = 2; // unix seconds; 0 unless CODE_SENT.
}

message CompleteRegistrationRequest {
  string invite_token = 1;
  string email = 2;
  string code = 3; // emailed verification code (LoginCode, purpose="registration")
  string password = 4; // must satisfy the password policy
}

// --- Feature 011 messages (RBAC) ---

// Whether a user's effective permissions are the live role default or a personalized snapshot.
// NB (proto3 trap): enum values share the package scope → every value is PREFIXED.
enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  PERMISSION_MODE_INHERITED = 1; // effective = the role's current default set (live).
  PERMISSION_MODE_STANDALONE = 2; // effective = the user's materialized snapshot (copy-on-write).
}

message ResolveRequest {
  string account_id = 1;
  string user_id = 2;
  string preview_role = 3; // view-as (US5); empty for normal resolution.
}

message ResolveResponse {
  string role_key = 1;
  repeated string permission_keys = 2; // the effective permission keys.
  PermissionMode mode = 3;
  bool is_preview = 4; // true when preview_role shaped the result (US5).
  bool read_only = 5; // true under preview — no mutation may proceed (US5).
  // ⭐ W28 (9.8) — additive. The GROUP term of the union, SEPARATELY: the Access-Management grid
  // cannot render an honest per-person toggle without knowing which keys arrive via membership —
  // a revoked key that a group still grants "springs back", and without this field that reads as
  // a broken switch instead of as "granted via group N" (0039: groups grant and never deny).
  // `permission_keys` above stays the full effective union — every existing consumer is unchanged.
  repeated string group_permission_keys = 6;
  // ⭐ W28 — the BASE term (snapshot-or-role-defaults), also separately. NOT derivable client-side:
  // `effective − group` silently loses a key present in BOTH terms, and the grid's toggle reflects
  // the base (what per-person editing controls), so the subtraction error would render a held key
  // as absent. The resolver holds both terms in hand; it says both.
  repeated string base_permission_keys = 7;
}

// --- US2: catalogue / role defaults ---

message CatalogueRequest {
  string account_id = 1;
}

message CataloguePermission {
  string key = 1;
  string label = 2;
  int32 introduced_version = 3;
}

message CatalogueCategory {
  string category = 1;
  repeated CataloguePermission permissions = 2;
}

message CatalogueResponse {
  repeated CatalogueCategory categories = 1;
}

message RoleDefaultsRequest {
  string account_id = 1;
  string role_key = 2;
}

message RoleDefaultsResponse {
  repeated string permission_keys = 1;
}

// --- US3: management (super-admin only) ---

// Outcome of an RBAC mutation. `affected_user_ids` feeds the gateway's cache invalidation (R-1).
// NB (proto3 trap): enum values share the package scope → every value is PREFIXED.
enum RbacStatus {
  RBAC_STATUS_UNSPECIFIED = 0;
  RBAC_STATUS_OK = 1; // applied.
  RBAC_STATUS_FORBIDDEN = 2; // caller is not super-admin (FR-018).
  // ⚠️ "group" here = a SELECTION of users edited at once, NOT the `Group` entity (feature 024).
  RBAC_STATUS_CROSS_ROLE = 3; // the selection spans >1 role (FR-011).
  RBAC_STATUS_SUPER_ADMIN_UI_FORBIDDEN = 4; // attempt to assign super_admin via UI (0033).
  RBAC_STATUS_NOT_FOUND = 5; // role/user/permission not found (account-scoped).
}

message RbacMutationResult {
  RbacStatus status = 1;
  string message = 2;
  repeated string affected_user_ids = 3; // whose effective-permission cache the gateway invalidates.
}

// Caller identity — populated by the gateway from the VALIDATED access JWT (Principle II).
message SetRoleDefaultRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string role_key = 4;
  string permission_key = 5;
  bool grant = 6; // true = add to the role template; false = remove.
}

message PersonalizeRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string user_id = 4;
  string permission_key = 5;
  bool grant = 6;
}

// ⚠️ A BATCH OF SELECTED USERS — NOT the `Group` entity (feature 024). See the note on the
// PersonalizeGroup rpc. `user_ids` is a hand-picked selection, not a membership.
message PersonalizeGroupRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  repeated string user_ids = 4; // must all share one role (else CROSS_ROLE).
  string permission_key = 5;
  bool grant = 6;
}

message ResetRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  // ⚠️ `user | selection | role`. `selection` is the preferred spelling since feature 024;
  // `group` is kept as a LEGACY SYNONYM for it and still works. A scope value is data, not a name,
  // so widening it is additive — and after feature 024 a caller sending `"group"` while thinking of
  // a group id is a plausible mistake that the strings alone would not warn them about.
  string scope = 4;
  string user_id = 5; // scope=user
  repeated string user_ids = 6; // scope=selection (a hand-picked batch — NOT a group's membership)
  string role_key = 7; // scope=role
}

message AssignRoleRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string user_id = 4;
  string role_key = 5; // never "super_admin" (whitelist only — 0033).
  string op = 6; // assign | revoke
}

// ── Feature 024: GROUPS (roadmap 5.3, ADR 0039) ───────────────────────────────────────────────────

// A SEPARATE result message from RbacMutationResult, deliberately: RbacStatus carries CROSS_ROLE,
// which belongs to the batch-selection path and is meaningless for a group. Sharing the enum would
// mean every group handler could return a status that cannot happen, and every reader would have to
// know which half applies.
// NB (proto3 trap): enum values share the PACKAGE scope → every value is prefixed.
enum GroupStatus {
  GROUP_STATUS_UNSPECIFIED = 0;
  GROUP_STATUS_OK = 1;
  GROUP_STATUS_FORBIDDEN = 2; // caller lacks `platform.group.manage`.
  // Also the answer for "exists, but in another account" — no enumeration (Principle I).
  GROUP_STATUS_NOT_FOUND = 3;
  GROUP_STATUS_NAME_TAKEN = 4; // a named refusal, never a database error reaching the caller.
  GROUP_STATUS_INVALID_NAME = 5; // empty after trimming, or over the length bound.
  GROUP_STATUS_UNKNOWN_PERMISSION = 6; // key not in the system catalogue — the catalogue stays closed.
  // ⚠️ The caller MAY manage groups but does not hold the key they are trying to confer. Distinct
  // from FORBIDDEN on purpose: "you cannot do this at all" and "you cannot give away what you do not
  // have" are different facts, and an administration screen that conflates them sends its user
  // looking for the wrong permission. Nobody can grant themselves a capability through a group —
  // otherwise `platform.group.manage` would be a route to the super-admin exclusives.
  GROUP_STATUS_ESCALATION = 7;
  // ⭐ W32: the person named as a desk's lead is not of this account. Its own value rather than
  // NOT_FOUND, so the screen can say which of the two things is wrong — an unknown desk and a
  // cross-account grant attempt deserve different words.
  GROUP_STATUS_UNKNOWN_USER = 8;
}

message GroupMutationResult {
  GroupStatus status = 1;
  string message = 2;
  // Whose effective-permission cache the gateway must invalidate. For a permission change or a
  // delete this is EVERY CURRENT MEMBER, read inside the mutation's own transaction — a stale grant
  // after a revocation is a live authorization defect, not a freshness nuisance.
  repeated string affected_user_ids = 3;
  string group_id = 4; // set on create; echoed otherwise.
}

message Group {
  string id = 1;
  string name = 2;
  bool active = 3;
  int32 member_count = 4; // a list-page convenience; never a source of truth.
  repeated string permission_keys = 5; // this group's grants — catalogue keys only, positive only.
  // ⭐ W32 (roadmap 3.16): who answers for this desk. "" = nobody, which is a legitimate state and
  // the reason the offboarding sweep counts «returned to the queue for want of a lead» separately.
  // An opaque auth user id — the screen resolves the name from the people list it already holds.
  string lead_user_id = 6;
}

// Caller identity is populated by the gateway from the VALIDATED access JWT (Principle II) — the
// same shape the RBAC management requests already use.
message CreateGroupRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string name = 4;
}

message RenameGroupRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string group_id = 4;
  string name = 5;
}

message SetGroupRoutableRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string group_id = 4;
  // ⚠️ Explicit, never inferred as a toggle. A toggle rpc means two administrators clicking at once can
  // leave the desk in whichever state arrived last, and neither of them asked for it.
  bool routable = 5;
}

message DeniedAddressWire {
  string id = 1;
  // The NORMALISED form — what the boundary actually compares. Showing the raw form an administrator
  // typed would let a ban look present on the screen while matching nothing.
  string address = 2;
  string note = 3;
  string created_by = 4;
  string created_at = 5;
}

message ListDeniedAddressesRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
}
message ListDeniedAddressesResult { repeated DeniedAddressWire addresses = 1; }

message AddDeniedAddressRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  string address = 3;
  string note = 4;
}
message DeniedAddressResult {
  DeniedAddressWire address = 1;
  // false when the address was already listed. Not an error — the same intent, expressed twice.
  bool created = 2;
}

message RemoveDeniedAddressRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  string id = 3;
}
message RemoveDeniedAddressResult { bool removed = 1; }

message SetGroupLeadRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string group_id = 4;
  // Must be a person of the caller's own account; refused otherwise. A desk led by somebody from
  // another tenant is not a configuration mistake, it is a cross-account grant.
  string lead_user_id = 5;
}

message ClearGroupLeadRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string group_id = 4;
}

message DeleteGroupRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string group_id = 4;
}

// ── W14 (roadmap 3.8): the people list ──
message StaffUser {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  // active | disabled | pending | invited — the column the login path already honours.
  string status = 4;
  // One role per person (assigning replaces), so this is a value and not a list.
  string role_key = 5;
  /**
   * ⭐⭐ W14, found by the live round: does this person still INHERIT their role's permissions?
   *
   * The moment anybody is personalised (a per-person override, ADR 0034), their permission set
   * becomes **standalone** — a snapshot — and from then on **changing their role does not change
   * what they may do** until somebody resets them to defaults. That is the override mechanism
   * working as designed, and it is invisible: the role beside their name changes, their access does
   * not, and nothing on screen explains why.
   *
   * ⇒ The list carries the fact so the screen can say it. A role control that silently does nothing
   * is worse than one that is absent.
   */
  bool inherits_role = 6;
}

message ListUsersRequest {
  string account_id = 1;
  // Keyset, as everywhere else: opaque token, never an offset (Principle VII).
  string page_token = 2;
  int32 page_size = 3;
  /**
   * The CALLER's effective permissions, forwarded by the gateway so this service can enforce
   * `users.list.view` itself (Principle II — the service tier decides independently).
   *
   * ⚠️ It was missing from the first draft of this message and the field was silently dropped on
   * the wire: the gateway sent an array, proto-loader discarded what the contract did not declare,
   * and every call — including the owner's — arrived with no permissions and was refused. The
   * symptom was a 500 at the edge, which reads like a broken service rather than a contract gap.
   */
  repeated string caller_permissions = 4;
}

message ListUsersResponse {
  repeated StaffUser users = 1;
  string next_page_token = 2; // empty when exhausted
}

message ListGroupsRequest {
  string account_id = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message GroupMemberRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string group_id = 4;
  string user_id = 5;
}

message ListGroupMembersRequest {
  string account_id = 1;
  string group_id = 2;
}

message ListGroupMembersResponse {
  // AUTH user ids. An empty list is a VALID and MEANINGFUL answer ("this group has nobody"), which
  // the caller must be able to tell apart from a failed call — hence the client fails closed with a
  // named error rather than returning an empty list, exactly as the authority client already does.
  repeated string user_ids = 1;
  // ⭐ Feature 031 (ADR 0042): is this desk fed by AUTOMATIC DISTRIBUTION? Answered here rather than by a
  // second call — the router asks "who staffs this desk" and "may I push work to it" in one breath, and a
  // separate round trip would let the two answers describe different moments.
  //
  // ⚠️ proto3 omits a false bool, so an ABSENT value means NOT routable. That is the safe direction and it
  // matches the column's default: a desk nobody has marked does not receive pushed work.
  bool routable = 2;
}

// ⭐ W29 — the inverse membership read (see the rpc note).
message UserGroupsRequest {
  string account_id = 1;
  string user_id = 2;
}

message UserGroupsResponse {
  // An empty list is a valid answer ("this user is in no group") — a caller that needs to tell it
  // apart from an outage fails closed with a named error, the membership client's standing rule.
  repeated string group_ids = 1;
}

message SetGroupPermissionRequest {
  string caller_account_id = 1;
  string caller_user_id = 2;
  repeated string caller_roles = 3;
  string group_id = 4;
  string permission_key = 5;
  // true = add the grant; false = remove it. There is NO deny: removing a grant returns the group to
  // SILENCE about that key, it never refuses it (ADR 0039 §3), so a member holding the key from
  // their role or from another group keeps it.
  bool grant = 6;
}

// Feature 028 — the mail sweep. Counts only; see the rpc comment for why nothing else is here.
message SendDueEmailsRequest {
  // How many messages to attempt in this tick. Clamped by the caller's own config.
  int32 batch = 1;
}

message SendDueEmailsResult {
  int32 attempted = 1;
  int32 sent = 2;
  int32 failed = 3;
}

// ── ⭐ W31 / feature 038: API keys ───────────────────────────────────────────────────────────────

message ApiKey {
  string id = 1;
  string consumer = 2;
  // Short, non-reversible label — what the screen and the audit trail show instead of a value.
  string fingerprint = 3;
  repeated string ip_allow_list = 4; // ⚠️ empty = DENIES every call (fail-closed)
  int32 rate_per_hour = 5;
  bool active = 6;
  string last_used_at = 7; // RFC3339; "" until an accepted call
  string created_at = 8;
  string rotated_from_id = 9; // "" for a first issuance
}

message ApiKeyList {
  repeated ApiKey keys = 1;
}

// This file has no shared Empty/Ack (that is the chats dialect) — a named request message keeps the
// contract self-describing and leaves room for a filter the day the list needs one.
message ListApiKeysRequest {}

message RevokeApiKeyResult {
  bool revoked = 1; // false when it was already revoked — a repeat is a no-op, not an error
}

message IssueApiKeyRequest {
  string consumer = 1;
  repeated string ip_allow_list = 2;
  int32 rate_per_hour = 3; // 0 = the server's default
}

message ApiKeyIdRequest {
  string key_id = 1;
}

// The ONE message carrying a key value. Returned by IssueApiKey and RotateApiKey, never stored,
// never logged, never returned again.
message IssuedApiKey {
  ApiKey key = 1;
  string value = 2; // "<id>.<secret>" — shown once, to one admin
}

// ── ⭐ W31 / feature 038: the machine path ───────────────────────────────────────────────────────

message ProvisionStaffRequest {
  string raw_body = 1;          // exactly the bytes that were signed
  string signature_header = 2;  // t=<unix>,v1=<hex>
  string key_id = 3;            // the public half the caller sent
  string key_secret = 4;        // the secret half — verified, never stored, never logged
  string idempotency_key = 5;
  string client_ip = 6;         // resolved by the edge from the forwarded chain
  int64 received_at = 7;        // unix seconds, the gateway's clock at receipt
}

message DeactivateStaffRequest {
  string raw_body = 1;          // empty body, still signed — the timestamp is what it protects
  string signature_header = 2;
  string key_id = 3;
  string key_secret = 4;
  string idempotency_key = 5;
  string client_ip = 6;
  int64 received_at = 7;
  string hr_employee_id = 8;    // from the path
}

// What the edge renders. `body_json` is the exact answer to return — including on an idempotent
// replay, where it is the FIRST call's answer read back out of the ledger.
//
// ⚠️ **It carries NO handover counts, and that is the design rather than an omission.** An earlier
// shape had the gateway close the account here and then call chats to move the work, reporting both
// in one answer. Two things killed it: a maintenance rpc reachable over HTTP makes its system-actor
// gate decoration (`tests/worker/maintenance-ticks.spec.ts` says so structurally), and «the work did
// not move» would have been reported to the HR platform — leaving the fix to a retry by a system we
// neither control nor test. The handover is a TICK now (see AuthMaintenanceService below), so it is
// guaranteed by our own infrastructure instead of by somebody else's error handling.
message ProvisioningResult {
  int32 status_code = 1;
  string problem_type = 2; // "" on success
  string outcome = 3;      // invited | reactivated | noop_active | deactivated | noop_inactive | refused
  string body_json = 4;
}

// ── ⭐ W31 / feature 038: the offboarding sweep ──────────────────────────────────────────────────
//
// System actor only, no gateway route, counts in the answer — the three properties every maintenance
// surface in this product has. It exists because closing an account in auth is only ONE THIRD of an
// offboarding: the operator flag lives in users and the open work lives in chats, and neither auth
// nor users holds a client to chats. The worker does, and this is what it asks first.
service AuthMaintenanceService {
  // Staff whose account is closed, most recently first. The sweep re-checks them and does nothing
  // when there is nothing to do — both follow-up calls are idempotent — so this needs no «handled»
  // flag and no second table to keep in step with reality.
  rpc ListDisabledStaff(ListDisabledStaffRequest) returns (ListDisabledStaffResult);

  /**
   * ⭐ W32 — every desk of one account and who leads it.
   *
   * Answers ALL desks rather than only the departing person's. A support organisation has a handful,
   * this is asked once per offboarding, and the alternative — ask chats which desks the work sits on,
   * then ask auth about those — spends a round trip to learn less.
   */
  rpc ListDeskLeads(ListDeskLeadsRequest) returns (ListDeskLeadsResult);

}

message ListDeskLeadsRequest { string account_id = 1; }
message DeskLead {
  string group_id = 1;
  string lead_user_id = 2; // "" = this desk has nobody answering for it
}
message ListDeskLeadsResult { repeated DeskLead desks = 1; }

message ListDeniedAddressesForEdgeRequest {}
message ListDeniedAddressesForEdgeResult {
  // Normalised forms only — the same shape `clientAddressFrom` produces, so the comparison at the
  // boundary is a set membership test and never a parsing exercise.
  repeated string addresses = 1;
}

message ListDisabledStaffRequest {
  int32 limit = 1;      // server-clamped, like every maintenance batch
  int32 within_days = 2; // 0 ⇒ the server's default window
}

message DisabledStaffMember {
  string account_id = 1; // a machine has no account of its own — the row carries it
  string user_id = 2;
}

message ListDisabledStaffResult {
  repeated DisabledStaffMember staff = 1;
}
